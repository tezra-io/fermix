<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fermix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-feature-settings: "ss01", "cv11";
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .stage {
      max-width: 1180px;
      margin: 0 auto;
      padding: 6rem 3rem 4rem;
    }

    .eyebrow {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a8a8a;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 3.25rem;
      font-weight: 200;
      letter-spacing: -0.035em;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .tagline {
      font-size: 1.0625rem;
      font-weight: 300;
      color: #b3b3b3;
      letter-spacing: -0.005em;
      margin-bottom: 5rem;
    }

    svg {
      width: 100%;
      display: block;
      overflow: visible;
    }

    .footer {
      margin-top: 5rem;
      font-size: 0.6875rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6a6a6a;
      text-align: center;
    }

    /* SVG text classes */
    .label-eyebrow {
      font: 500 9px 'Inter', sans-serif;
      letter-spacing: 0.18em;
      fill: #8a8a8a;
      text-transform: uppercase;
    }
    .label-row {
      font: 400 13px 'Inter', sans-serif;
      letter-spacing: -0.005em;
      fill: #ffffff;
    }
    .label-sub {
      font: 300 11px 'Inter', sans-serif;
      letter-spacing: 0;
      fill: #a0a0a0;
    }
    .label-quiet {
      font: 400 10px 'Inter', sans-serif;
      letter-spacing: 0;
      fill: #a8a8a8;
    }
    .label-hero {
      font: 300 22px 'Inter', sans-serif;
      letter-spacing: -0.02em;
      fill: #ffffff;
    }
    .label-hero-sub {
      font: 400 11px 'Inter', sans-serif;
      letter-spacing: 0.05em;
      fill: #b3b3b3;
    }
  </style>
</head>
<body>
  <div class="stage">

    <div class="eyebrow">System Architecture</div>
    <h1>Fermix.</h1>
    <p class="tagline">One VM. No bridges.</p>

    <svg viewBox="0 0 1100 830" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="tip" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#a0a0a0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ============================================================
           INPUT — Channels only at the top (full width above the VM)
           ============================================================ -->
      <text x="80" y="22" class="label-eyebrow">Channels</text>
      <rect x="80" y="34" width="940" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="550" y="65" class="label-row" text-anchor="middle">Telegram   ·   Discord   ·   Slack   ·   WhatsApp   ·   Signal   ·   CLI</text>

      <line x1="550" y1="86" x2="550" y2="140" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>

      <!-- ============================================================
           BEAM VM — frame + tiny corner label
           ============================================================ -->
      <rect x="80" y="140" width="940" height="560" rx="3"
            fill="none" stroke="#5a5a5a" stroke-width="1"/>
      <text x="98" y="134" class="label-eyebrow">BEAM VM</text>

      <!-- Layer 1 — Phoenix Endpoint -->
      <rect x="120" y="180" width="860" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="550" y="207" class="label-row" text-anchor="middle">Phoenix Endpoint</text>
      <text x="550" y="223" class="label-sub" text-anchor="middle">webhooks  ·  health  ·  liveview</text>

      <line x1="550" y1="232" x2="550" y2="262" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>

      <!-- Layer 2 — Channel Adapters -->
      <rect x="120" y="262" width="860" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="550" y="289" class="label-row" text-anchor="middle">Channel Adapters</text>
      <text x="550" y="305" class="label-sub" text-anchor="middle">normalise  ·  dispatch by conversation</text>

      <line x1="420" y1="314" x2="420" y2="348" stroke="#c0c0c0" stroke-width="1.25" marker-end="url(#tip)"/>

      <!-- HERO — Main Agent (left, larger) + Sub-agents callout (right, smaller) -->
      <rect x="120" y="348" width="600" height="120" rx="2"
            fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="420" y="388" class="label-hero" text-anchor="middle">Main Agent</text>
      <text x="420" y="413" class="label-hero-sub" text-anchor="middle">GenServer  ·  :permanent  ·  single-flight</text>
      <text x="420" y="439" class="label-sub" text-anchor="middle">LLM  →  parse tool calls  →  execute  →  loop</text>

      <!-- Spawn arrow → Sub-agents (horizontal sibling) -->
      <line x1="720" y1="408" x2="740" y2="408" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>
      <text x="730" y="396" class="label-quiet" text-anchor="middle">spawns</text>

      <!-- Sub-agents — transient workers (sibling to Main Agent) -->
      <rect x="740" y="368" width="240" height="80" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="860" y="394" class="label-row" text-anchor="middle">Sub-agents</text>
      <text x="860" y="412" class="label-sub" text-anchor="middle">transient  ·  one task each</text>
      <text x="860" y="428" class="label-sub" text-anchor="middle">AgentSupervisor → AgentServer</text>

      <!-- Fan connectors from Main Agent → Trio.
           Memory's centre falls just outside Main Agent's right edge,
           so its connector takes a short L-bend rather than a diagonal. -->
      <line x1="255" y1="468" x2="255" y2="496" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>
      <line x1="500" y1="468" x2="500" y2="496" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>
      <polyline points="660,468 660,482 820,482 820,496"
                fill="none" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>

      <!-- Trio — Providers · Tools · Memory (shared by Main Agent and Sub-agents) -->
      <rect x="120" y="496" width="270" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="255" y="521" class="label-row" text-anchor="middle">Providers</text>
      <text x="255" y="537" class="label-sub" text-anchor="middle">Req  ·  streaming  ·  tool calls</text>

      <rect x="410" y="496" width="180" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="500" y="521" class="label-row" text-anchor="middle">Tools</text>
      <text x="500" y="537" class="label-sub" text-anchor="middle">shell · browser · files · skills</text>

      <rect x="610" y="496" width="370" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="795" y="521" class="label-row" text-anchor="middle">Memory</text>
      <text x="795" y="537" class="label-sub" text-anchor="middle">ConversationStore  ·  ETS</text>

      <!-- Quiet bottom strip — Rustler NIF -->
      <text x="550" y="588" class="label-quiet" text-anchor="middle">fermix_nif  ·  Rustler  ·  HMAC-SHA256, tiktoken</text>

      <!-- ============================================================
           OUTBOUND — external dependencies the VM calls out to.
           LLM (the brain) and Disk (persistence), bottom row.
           ============================================================ -->

      <!-- Providers → LLM (dotted, exits VM bottom) -->
      <line x1="255" y1="548" x2="255" y2="760" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>
      <!-- Memory → Disk (dotted, exits VM bottom) -->
      <line x1="795" y1="548" x2="795" y2="760" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>

      <text x="80" y="748" class="label-eyebrow">LLM</text>
      <rect x="80" y="760" width="440" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="300" y="787" class="label-row" text-anchor="middle">OpenAI</text>
      <text x="300" y="803" class="label-sub" text-anchor="middle">HTTPS  ·  pluggable Provider behaviour</text>

      <text x="580" y="748" class="label-eyebrow">Disk</text>
      <rect x="580" y="760" width="440" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="800" y="787" class="label-row" text-anchor="middle">~/.fermix/</text>
      <text x="800" y="803" class="label-sub" text-anchor="middle">traces (JSONL)  ·  memory  ·  config  ·  prompts</text>

    </svg>

    <p class="footer">Elixir · OTP · Phoenix · Rustler</p>

  </div>
</body>
</html>
