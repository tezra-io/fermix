<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fermix</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #000;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-feature-settings: "ss01", "cv11";
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .stage {
      max-width: 1180px;
      margin: 0 auto;
      padding: 6rem 3rem 4rem;
    }

    .eyebrow {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a8a8a;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 3.25rem;
      font-weight: 200;
      letter-spacing: -0.035em;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .tagline {
      font-size: 1.0625rem;
      font-weight: 300;
      color: #b3b3b3;
      letter-spacing: -0.005em;
      margin-bottom: 5rem;
    }

    svg {
      width: 100%;
      display: block;
      overflow: visible;
    }

    .footer {
      margin-top: 5rem;
      font-size: 0.6875rem;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6a6a6a;
      text-align: center;
    }

    /* SVG text classes */
    .label-eyebrow {
      font: 500 9px 'Inter', sans-serif;
      letter-spacing: 0.18em;
      fill: #8a8a8a;
      text-transform: uppercase;
    }
    .label-row {
      font: 400 13px 'Inter', sans-serif;
      letter-spacing: -0.005em;
      fill: #ffffff;
    }
    .label-sub {
      font: 300 11px 'Inter', sans-serif;
      letter-spacing: 0;
      fill: #a0a0a0;
    }
    .label-quiet {
      font: 400 10px 'Inter', sans-serif;
      letter-spacing: 0;
      fill: #a8a8a8;
    }
    .label-hero {
      font: 300 22px 'Inter', sans-serif;
      letter-spacing: -0.02em;
      fill: #ffffff;
    }
    .label-hero-sub {
      font: 400 11px 'Inter', sans-serif;
      letter-spacing: 0.05em;
      fill: #b3b3b3;
    }
  </style>
</head>
<body>
  <div class="stage">

    <div class="eyebrow">System Architecture</div>
    <h1>Fermix.</h1>
    <p class="tagline">One VM. No bridges.</p>

    <svg viewBox="0 0 1100 830" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="tip" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M 0 1 L 7 4 L 0 7" fill="none" stroke="#a0a0a0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ============================================================
           INPUTS — two parallel ingress lanes above the VM.
           Channels (text) come in via Phoenix HTTP webhooks.
           FermixPet (voice) connects to a local Unix-domain socket and
           bypasses Phoenix entirely.
           ============================================================ -->
      <text x="80" y="22" class="label-eyebrow">Channels</text>
      <rect x="80" y="34" width="620" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="390" y="65" class="label-row" text-anchor="middle">Telegram  ·  Discord  ·  Slack  ·  WhatsApp  ·  Signal  ·  CLI</text>

      <text x="720" y="22" class="label-eyebrow">Voice (macOS)</text>
      <rect x="720" y="34" width="300" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="870" y="58" class="label-row" text-anchor="middle">FermixPet</text>
      <text x="870" y="74" class="label-sub" text-anchor="middle">Swift  ·  click-to-talk</text>

      <line x1="390" y1="86" x2="390" y2="140" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>
      <line x1="870" y1="86" x2="870" y2="140" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>

      <!-- ============================================================
           SANDBOX — operator's policy envelope wrapping the BEAM VM.
           Modes (strict/standard/open), allowed_roots, blocked_roots,
           env passthrough, and command profile govern what the agent
           can DO on this machine. Drawn outside the BEAM frame to
           reflect that Sandbox config is the framing context for the
           whole local runtime — not OS isolation, that lands in M10.
           Runtime enforcement (Sandbox.enforce/3) fires inside tool
           execute paths; LLM HTTPS calls and Memory writes intentionally
           bypass it (§3.4 control-surface carve-out).
           ============================================================ -->
      <rect x="60" y="108" width="980" height="612" rx="4"
            fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="70" y="100" class="label-eyebrow">Sandbox  ·  workspace + policy envelope</text>
      <text x="1030" y="100" class="label-eyebrow" text-anchor="end">strict  ·  standard  ·  open</text>

      <!-- ============================================================
           BEAM VM — frame + tiny corner label
           ============================================================ -->
      <rect x="80" y="140" width="940" height="560" rx="3"
            fill="none" stroke="#5a5a5a" stroke-width="1"/>
      <text x="98" y="134" class="label-eyebrow">BEAM VM</text>

      <!-- Phoenix Endpoint — left lane only (FermixPet's local socket bypasses it). -->
      <rect x="120" y="180" width="580" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="410" y="207" class="label-row" text-anchor="middle">Phoenix Endpoint</text>
      <text x="410" y="223" class="label-sub" text-anchor="middle">webhooks  ·  health  ·  liveview</text>
      <line x1="410" y1="232" x2="410" y2="262" stroke="#7a7a7a" stroke-width="1" marker-end="url(#tip)"/>

      <!-- Channel Adapters — left lane. Parses slash commands before MainAgent sees the message. -->
      <rect x="120" y="262" width="580" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="410" y="289" class="label-row" text-anchor="middle">Channel Adapters</text>
      <text x="410" y="305" class="label-sub" text-anchor="middle">normalise  ·  slash commands  ·  dispatch</text>
      <line x1="330" y1="314" x2="330" y2="348" stroke="#c0c0c0" stroke-width="1.25" marker-end="url(#tip)"/>

      <!-- FermixPet's local-socket lane: dashed line drops down the right side
           of the VM frame, lands on Realtime's top edge. Bypasses Phoenix +
           Channel Adapters. -->
      <line x1="870" y1="140" x2="870" y2="348" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>
      <text x="884" y="244" class="label-quiet">local socket</text>

      <!-- SESSIONS — siblings at the same architectural level. Both manage a
           conversational session, both share the Capability Registry, both
           call providers. Main Agent serves text channels; Realtime serves voice. -->
      <rect x="120" y="348" width="430" height="100" rx="2"
            fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="335" y="384" class="label-hero" text-anchor="middle">Main Agent</text>
      <text x="335" y="408" class="label-hero-sub" text-anchor="middle">GenServer  ·  :permanent  ·  single-flight</text>
      <text x="335" y="428" class="label-sub" text-anchor="middle">+ Sub-agents (spawned for skills)</text>
      <text x="335" y="443" class="label-sub" text-anchor="middle">LLM  →  parse tool calls  →  execute  →  loop</text>

      <rect x="570" y="348" width="410" height="100" rx="2"
            fill="none" stroke="#ffffff" stroke-width="1.25"/>
      <text x="775" y="384" class="label-hero" text-anchor="middle">Realtime Voice</text>
      <text x="775" y="408" class="label-hero-sub" text-anchor="middle">SessionSupervisor  ·  per-Pet session</text>
      <text x="775" y="428" class="label-sub" text-anchor="middle">OpenAI Realtime WS  ·  Unix socket</text>
      <text x="775" y="443" class="label-sub" text-anchor="middle">shares Capability Registry</text>

      <!-- Both sessions fan into the Trio below via the Capability Registry.
           Visualized by adjacency rather than explicit per-cell arrows —
           any session can call any Trio resource. -->
      <text x="550" y="476" class="label-quiet" text-anchor="middle">both sessions fan into the Trio via Capability Registry</text>

      <!-- TRIO — Providers · Tools · Memory.
           Sandbox enclosure (dashed) wraps Tools only: that's where the
           policy gate actually fires. Providers (HTTPS from BEAM) and Memory
           (in-VM, control-surface writes) are not sandbox-mediated. -->
      <rect x="120" y="496" width="270" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="255" y="521" class="label-row" text-anchor="middle">Providers</text>
      <text x="255" y="537" class="label-sub" text-anchor="middle">Req  ·  streaming  ·  tool calls</text>

      <!-- Tools — single Trio cell. Sandbox.enforce/3 runs inside each
           tool's execute path; the outer envelope captures the policy
           framing, the bottom quiet strip names the runtime internals. -->
      <rect x="410" y="496" width="180" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="500" y="521" class="label-row" text-anchor="middle">Tools</text>
      <text x="500" y="537" class="label-sub" text-anchor="middle">shell · file · git · mcp · skills</text>

      <rect x="610" y="496" width="370" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="795" y="521" class="label-row" text-anchor="middle">Memory</text>
      <text x="795" y="537" class="label-sub" text-anchor="middle">ConversationStore  ·  ETS  ·  SQLite</text>

      <!-- Quiet bottom strip — primitives that don't deserve their own boxes -->
      <text x="550" y="620" class="label-quiet" text-anchor="middle">Sandbox internals  ·  hardline  ·  path policy  ·  env passthrough  ·  decision telemetry</text>
      <text x="550" y="640" class="label-quiet" text-anchor="middle">Jobs (cron)  ·  Trace (JSONL)  ·  fermix_nif (HMAC-SHA256, tiktoken)</text>

      <!-- ============================================================
           OUTBOUND — destinations the VM calls out to.
           These sit OUTSIDE the Sandbox envelope because they are
           remote services (LLM APIs) or local OS resources whose
           access is governed by Sandbox config but whose behaviour
           is not.
           ============================================================ -->

      <!-- Outbound connectors, reordered to flow without crossings:
           Providers→LLM and Tools→Keychain slant down-left;
           Tools→MCP and Memory→Disk slant down-right. -->
      <line x1="255" y1="548" x2="190" y2="760" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>
      <line x1="500" y1="548" x2="430" y2="760" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>
      <line x1="500" y1="548" x2="670" y2="760" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>
      <line x1="795" y1="548" x2="910" y2="760" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#tip)"/>

      <text x="80" y="748" class="label-eyebrow">LLM</text>
      <rect x="80" y="760" width="220" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="190" y="785" class="label-row" text-anchor="middle">OpenAI  ·  Anthropic</text>
      <text x="190" y="801" class="label-sub" text-anchor="middle">HTTPS  ·  Realtime WS  ·  Codex</text>

      <text x="320" y="748" class="label-eyebrow">OS Keychain</text>
      <rect x="320" y="760" width="220" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="430" y="785" class="label-row" text-anchor="middle">security  ·  secret-tool  ·  pass</text>
      <text x="430" y="801" class="label-sub" text-anchor="middle">[sandbox.env]  ·  source = "command"</text>

      <text x="560" y="748" class="label-eyebrow">MCP Servers</text>
      <rect x="560" y="760" width="220" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="670" y="785" class="label-row" text-anchor="middle">subprocess  ·  stdio</text>
      <text x="670" y="801" class="label-sub" text-anchor="middle">peekaboo  ·  filesystem  ·  ...</text>

      <text x="800" y="748" class="label-eyebrow">Disk</text>
      <rect x="800" y="760" width="220" height="52" rx="2"
            fill="none" stroke="#6e6e6e" stroke-width="1"/>
      <text x="910" y="785" class="label-row" text-anchor="middle">~/.fermix/</text>
      <text x="910" y="801" class="label-sub" text-anchor="middle">traces · memory · grants · config</text>

    </svg>

    <p class="footer">Elixir · OTP · Phoenix · Rustler</p>

  </div>
</body>
</html>
