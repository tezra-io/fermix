suite: subagents
title: "Subagents — fan-out mechanism + model routing"
description: >
  Tests the delegation MECHANISM, deterministically: when the model is asked to
  run parallel workers it fans out (the `subagents` tool span + nested
  `subagent:*` worker spans), the MAIN turn runs on the default model, the WORKER
  llm spans run on the configured sub-agent model (or a per-call override), and
  the reply synthesizes every branch.

  It deliberately does NOT test the model's *autonomous* "decide to fan out"
  behavior. For small/medium tasks the model correctly answers in one pass
  (cheaper and just as good), so a fan-out assertion on a natural query would be
  testing a non-deterministic, task-size-dependent judgment call — and broad
  outcome quality is already covered by `complex` and `knowledge_qa`. So the
  gated subagents coverage is the explicit, deterministic fan-out below.

  `subagent_model_matches` REQUIRES >=1 nested worker span, so it fails loud if
  fan-out didn't nest into the trace (the "can't see inside the subagent" case)
  rather than passing vacuously. PRECONDITION: dev config has
  [fermix_core.routing] subagent_model = "claude-sonnet-4-6" and the main agent
  runs claude-opus-4-8; adjust the model regexes if that config changes.
defaults:
  # No `no_tool_errors` default: a worker's occasional failed web_fetch among many
  # tool calls is normal and must not fail the case. timeout_ms is generous; the
  # explicit small-task fan-outs here are actually cheap (a few sonnet workers).
  timeout_ms: 900000
  judge: true
  expect:
    status: ok

scenarios:
  - id: model_routing
    title: "Explicit fan-out runs main on the default model, workers on the sub-agent model"
    severity: normal
    tags: [subagents, delegation, routing]
    cases:
      - id: default_subagent_model
        query: >
          Use parallel subagents to research three things at once — the history of
          espresso, how ocean tides work, and the basics of bookbinding — then give
          me one short combined summary.
        expect:
          tools_any: [subagents]
          min_subagent_spawns: 2
          main_model_matches: "claude-opus-4-8"
          subagent_model_matches: "claude-sonnet-4-6"
          reply_matches: "(?i)espresso|tide|bookbind"
          max_cost_usd: 30
          max_duration_ms: 900000
        rubric: >
          Fans out and returns a combined summary covering all three topics; the
          main agent ran on the default model and the workers on the configured
          cheaper sub-agent model.
      - id: per_call_model_override
        # The user names a model for the workers — the on-the-fly override path.
        # opus is distinct from the configured sonnet default, so workers landing
        # on opus proves the override took effect (if it were ignored they'd be on
        # sonnet and subagent_model_matches would fail).
        query: >
          Spin up parallel subagents running on claude-opus-4-8 to look into three
          separate topics — the rules of cricket, how vaccines work, and the basics
          of jazz harmony — and bring it back as one summary.
        expect:
          tools_any: [subagents]
          min_subagent_spawns: 2
          main_model_matches: "claude-opus-4-8"
          subagent_model_matches: "claude-opus-4-8"
          reply_matches: "(?i)cricket|vaccine|jazz"
          max_cost_usd: 30
          max_duration_ms: 900000
        rubric: >
          Honors the per-call model override: workers run on the requested model
          (claude-opus-4-8) instead of the configured default sub-agent model, and
          the reply covers all three topics.
