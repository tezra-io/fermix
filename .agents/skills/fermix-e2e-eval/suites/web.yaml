suite: web
title: "Web research — search, fetch, and summarize"
description: >
  Exercises the assistant's web-research capability: searching the live web for
  a topic, asking for the latest on something, looking things up, and fetching a
  concrete public URL to summarize it. Gates are deliberately tolerant of the
  model's route — for an open-ended "what's the latest" or "look up" request the
  model may reach for web_search, and for a fetch-this-URL request it should reach
  for web_fetch, but either may chain the other, so tools gates use tools_any and
  reply_matches asserts a topical token rather than pinning an exact tool sequence.
  Network-bound, so budgets and timeouts are set higher than for offline lookups.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok

scenarios:
  - id: search_the_web
    title: "Searches the web for a topic on request"
    severity: normal
    tags: [web, search, core]
    cases:
      - id: mars_rovers
        query: "Search the web for the names of NASA's Mars rovers and tell me what you find."
        expect:
          tools_any: [web_search]
          reply_matches: "(?i)curiosity|perseverance|rover|mars"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Searches the web and reports real Mars rover names (e.g. Curiosity, Perseverance) without inventing them."
      - id: nobel_physics
        query: "Can you look up who won the most recent Nobel Prize in Physics? Search online for it."
        expect:
          tools_any: [web_search]
          reply_matches: "(?i)nobel|physics|prize|laureate"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Searches the web and reports a Nobel Prize in Physics laureate, grounded in the search results."
      - id: tallest_building
        query: "Look up online what the tallest building in the world is right now."
        expect:
          tools_any: [web_search]
          reply_matches: "(?i)burj khalifa|tallest|building|meter|metre|feet"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Searches the web and reports the world's tallest building (Burj Khalifa) from the results."

  - id: whats_the_latest
    title: "Reports the latest on a current topic"
    severity: normal
    tags: [web, search, news]
    cases:
      - id: latest_ai
        query: "What's the latest on AI model releases this year? Search the web and give me a quick rundown."
        expect:
          tools_any: [web_search]
          reply_matches: "(?i)model|release|ai|launch|announce"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Searches the web and summarizes recent AI model releases grounded in the search results, not from memory alone."
      - id: latest_spacex
        query: "What's the latest news on SpaceX launches? Look it up for me."
        expect:
          tools_any: [web_search]
          reply_matches: "(?i)spacex|launch|rocket|starship|falcon"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Searches the web and reports recent SpaceX launch news from the results."

  - id: fetch_and_summarize
    title: "Fetches a concrete public URL and summarizes it"
    severity: critical
    tags: [web, fetch, core]
    cases:
      - id: fetch_example_com
        query: "Fetch https://example.com and summarize what's on the page for me."
        expect:
          tools_any: [web_fetch]
          reply_matches: "(?i)example|domain|illustrative|documentation"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Fetches example.com and summarizes its actual content (the illustrative example-domain page), without fabricating sections that aren't there."
      - id: fetch_iana_about
        query: "Please grab the page at https://www.iana.org/about and give me a short summary of what IANA does."
        expect:
          tools_any: [web_fetch]
          reply_matches: "(?i)iana|internet|number|assigned|registr|domain"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Fetches the IANA about page and summarizes IANA's role (coordinating internet number/name assignments) from the page content."
      - id: fetch_rfc_editor
        query: "Read https://www.rfc-editor.org/ and tell me in a sentence or two what that site is for."
        expect:
          tools_any: [web_fetch]
          reply_matches: "(?i)rfc|request for comments|document|internet|standard"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Fetches the RFC Editor homepage and explains that it publishes/hosts RFC documents, grounded in the fetched content."
