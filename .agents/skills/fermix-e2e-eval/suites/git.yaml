suite: git
title: "Git — status, log, branch, and safe inspection"
description: >
  Exercises the assistant's git surface against the local repository: reporting
  the working-tree status, showing recent commits, naming the current branch, and
  summarizing what changed. These are read-only intents and should route through
  git_read (which fronts status/log/diff/branch/show). Gates are tolerant of the
  model's route — it may run one git_read or several, and may word the answer many
  ways — so they assert git_read was used plus that the reply mentions the relevant
  branch/commit/status vocabulary. One write-ish case ("stage the changes") is kept
  deliberately tolerant: with nothing to stage the model may legitimately decline
  or report a clean tree instead of calling git_write, so it asserts neither a write
  nor a refusal, only that the answer stays grounded in real git state.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: working_tree_status
    title: "Reports the current git status"
    severity: normal
    tags: [git, read, status]
    cases:
      - id: whats_the_status
        query: "What's the current git status of this repo?"
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)status|clean|modified|staged|untracked|changes|nothing to commit|working tree"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Reports the working-tree status (clean, or which files are modified/staged/untracked) based on a real git_read, without inventing files."
      - id: anything_uncommitted
        query: "Do I have any uncommitted changes right now? Give me the short version."
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)clean|nothing to commit|no (uncommitted|pending) changes|modified|staged|untracked|uncommitted"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Answers whether there are uncommitted changes, grounded in actual git status output."
      - id: check_state_before_commit
        query: "Before I commit, can you check whether the working tree is clean?"
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)clean|working tree|nothing to commit|modified|staged|untracked|uncommitted"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Inspects git status and reports whether the working tree is clean or has pending changes."

  - id: recent_history
    title: "Shows recent commits and the current branch"
    severity: normal
    tags: [git, read, log, branch]
    cases:
      - id: last_three_commits
        query: "Show me the last 3 commits in this repo."
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)commit|log|message|author|[0-9a-f]{7}"
          max_cost_usd: 0.7
          max_duration_ms: 100000
        rubric: "Lists recent commits (subjects and/or hashes) drawn from a real git log, without fabricating commits."
      - id: what_branch
        query: "What branch am I on?"
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)branch|main|dev|master|on .* branch|currently on"
          max_cost_usd: 0.5
          max_duration_ms: 80000
        rubric: "Names the current git branch based on git_read, not a guess."
      - id: summarize_recent_changes
        query: "Summarize what's changed recently in this repo — the gist of the last few commits."
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)commit|recent|change|log|added|fixed|updated|feat|fix"
          max_cost_usd: 0.9
          max_duration_ms: 120000
        rubric: "Summarizes the recent commit history from real git log output, without inventing changes."

  - id: stage_when_idle
    title: "Staging request is handled gracefully when there's nothing to do"
    severity: normal
    tags: [git, write, tolerant]
    cases:
      - id: stage_the_changes
        query: "Stage the changes in this repo for me."
        expect:
          tools_any: [git_read, git_write]
          reply_matches: "(?i)stage|staged|nothing to (stage|commit|add)|clean|already|no changes|working tree|added"
          max_cost_usd: 0.8
          max_duration_ms: 110000
        rubric: "Either stages the changes or, if there is nothing to stage, says so plainly — grounded in real git state, never claiming a stage that did not happen."
      - id: stage_or_report_clean
        query: "Can you git add everything that's modified? If there's nothing to add, just tell me."
        expect:
          tools_any: [git_read, git_write]
          reply_matches: "(?i)stage|staged|add|nothing to (stage|commit|add)|clean|already|no (changes|modified)|working tree"
          max_cost_usd: 0.8
          max_duration_ms: 110000
        rubric: "Stages modified files if any exist, otherwise reports that there is nothing to add — honest about whether a write occurred."
