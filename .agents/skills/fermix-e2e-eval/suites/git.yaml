suite: git
title: "Git — status, log, branch, and safe inspection"
description: >
  Exercises the assistant's git surface against the Fermix repo at
  /Users/sujshe/projects/fermix. Queries name the repo path explicitly because
  the eval runs via the CLI channel whose sandbox root is ~/.fermix-dev/workspace
  (not the repo); the model must use the path-specified repo, not the sandbox cwd.
  Gates are tolerant of the model's route — it may run one git_read or several —
  and assert git_read was used plus that the reply mentions the relevant
  branch/commit/status vocabulary. The stage_when_idle scenario is deliberately
  tolerant: with nothing staged the model may legitimately report clean instead
  of calling git_write.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    # no_tool_errors omitted: git_read may emit an intermediate error while
    # resolving the repo path (the sandbox cwd differs from the target repo)
    # before succeeding on a retry — the answer is still correct.
    # The reply_matches and tools_any gates are the real correctness signal.

scenarios:
  - id: working_tree_status
    title: "Reports the current git status"
    severity: normal
    tags: [git, read, status]
    cases:
      - id: whats_the_status
        query: "What's the current git status of /Users/sujshe/projects/fermix?"
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)status|clean|modified|staged|untracked|changes|nothing to commit|working tree"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Reports the working-tree status (clean, or which files are modified/staged/untracked) based on a real git_read, without inventing files."
      - id: anything_uncommitted
        query: "Do I have any uncommitted changes in /Users/sujshe/projects/fermix right now? Give me the short version."
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)clean|nothing to commit|no (uncommitted|pending) changes|modified|staged|untracked|uncommitted"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Answers whether there are uncommitted changes, grounded in actual git status output."
      - id: check_state_before_commit
        query: "Before I commit in /Users/sujshe/projects/fermix, can you check whether the working tree is clean?"
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)clean|working tree|nothing to commit|modified|staged|untracked|uncommitted"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Inspects git status and reports whether the working tree is clean or has pending changes."

  - id: recent_history
    title: "Shows recent commits and the current branch"
    severity: normal
    tags: [git, read, log, branch]
    cases:
      - id: last_three_commits
        query: "Show me the last 3 commits in /Users/sujshe/projects/fermix."
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)commit|log|message|author|[0-9a-f]{7}"
          max_cost_usd: 0.7
          max_duration_ms: 100000
        rubric: "Lists recent commits (subjects and/or hashes) drawn from a real git log, without fabricating commits."
      - id: what_branch
        query: "What branch am I on in /Users/sujshe/projects/fermix?"
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)branch|main|dev|master|on .* branch|currently on"
          max_cost_usd: 0.5
          max_duration_ms: 80000
        rubric: "Names the current git branch based on git_read, not a guess."
      - id: summarize_recent_changes
        query: "Summarize what's changed recently in /Users/sujshe/projects/fermix — the gist of the last few commits."
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)commit|recent|change|log|added|fixed|updated|feat|fix"
          max_cost_usd: 0.9
          max_duration_ms: 120000
        rubric: "Summarizes the recent commit history from real git log output, without inventing changes."

  - id: diff_inspect
    title: "Inspects uncommitted diff without staging (read-only write-path coverage)"
    severity: normal
    tags: [git, read, diff]
    cases:
      # Stage-write cases are NOT in the eval suite — an automated test must not
      # mutate the host repo. Write-path coverage lives in the ExUnit suite.
      # These cases cover the read side of the git diff/stat surface instead.
      - id: whats_changed_in_detail
        query: "What files have changed in /Users/sujshe/projects/fermix, and what's the broad breakdown of what's in them?"
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)modified|changed|file|\\.ex|apps/"
          max_cost_usd: 0.8
          max_duration_ms: 110000
        rubric: "Lists the changed files or gives a breakdown of what is modified, drawn from real git status/diff output, without fabricating files."
      - id: show_diff_one_file
        query: "In /Users/sujshe/projects/fermix, show me the diff for apps/fermix_opik/lib/fermix_opik/aggregation.ex."
        expect:
          tools_any: [git_read]
          reply_matches: "(?i)diff|\\+|aggregation|no (diff|change)|not modified|unchanged|identical"
          max_cost_usd: 0.8
          max_duration_ms: 110000
        rubric: "Shows the diff for aggregation.ex from real git output, or states there is no diff if the file is unchanged."
