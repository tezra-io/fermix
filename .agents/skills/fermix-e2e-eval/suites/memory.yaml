suite: memory
title: "Memory — store, recall, and durable facts"
description: >
  Exercises the assistant's long-term and conversational memory: storing a fact
  when asked, using a fact stated earlier in the same conversation, and reporting
  what it knows. Gates are deliberately tolerant of the model's route — it may
  answer a same-conversation follow-up directly from context without a
  memory_recall tool call, so recall scenarios assert the reply content, not the
  tool. Only "remember this" requests are expected to actually call memory_store.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: store_when_asked
    title: "Stores a fact when explicitly asked to remember"
    severity: critical
    tags: [memory, core]
    cases:
      - id: favourite_team
        query: "Please remember this for the future: my favourite football team is Arsenal."
        expect:
          tools_any: [memory_store]
          reply_matches: "(?i)arsenal|remember|noted|got it|saved|stored"
          max_cost_usd: 1.0
        rubric: "Confirms it has stored that the user's favourite football team is Arsenal."
      - id: dietary_pref
        query: "Remember that I'm vegetarian and don't eat seafood — keep that in mind going forward."
        expect:
          tools_any: [memory_store]
          reply_matches: "(?i)vegetarian|remember|noted|got it|saved|stored"
          max_cost_usd: 1.0
        rubric: "Acknowledges and stores that the user is vegetarian and avoids seafood."
      - id: work_schedule
        query: "For future reference, save that I work night shifts Tuesday through Saturday."
        expect:
          tools_any: [memory_store]
          reply_matches: "(?i)night shift|tuesday|remember|noted|saved|stored"
        rubric: "Stores that the user works night shifts Tuesday through Saturday."

  - id: recall_in_conversation
    title: "Uses a fact stated earlier in the same conversation"
    severity: normal
    tags: [memory]
    cases:
      - id: name_then_question
        turns:
          - query: "Hi! My name is Priya and I'm learning to play the cello."
            expect:
              reply_matches: "(?i)priya|hello|hi|nice"
          - query: "What instrument did I say I'm learning?"
            expect:
              reply_matches: "(?i)cello"
        rubric: "Correctly answers that the user is learning the cello."
      - id: project_then_question
        turns:
          - query: "I'm building a budget app called PennyWise in Flutter. Please remember that."
            expect:
              tools_any: [memory_store]
          - query: "What's the name of the app I'm working on, and what framework is it in?"
            expect:
              reply_matches: "(?i)pennywise"
        expect:
          reply_matches: "(?i)flutter"
        rubric: "Recalls the app name PennyWise and that it is built in Flutter."

  - id: report_what_is_known
    title: "Reports stored knowledge on request"
    severity: normal
    tags: [memory]
    cases:
      - id: ask_what_you_know
        turns:
          - query: "Remember: I drive a blue Tesla Model 3 and my dog's name is Mochi."
            expect:
              tools_any: [memory_store]
          - query: "What do you remember about my car and my pet?"
            expect:
              reply_matches: "(?i)tesla|model 3|blue"
        expect:
          reply_matches: "(?i)mochi"
        rubric: "Reports the blue Tesla Model 3 and the dog named Mochi without inventing details."
      - id: list_memory_sources
        query: "What kinds of things have you saved about me? List your memory sources if you can."
        expect:
          tools_any: [memory_recall, memory_sources_list]
        rubric: "Describes what it has stored or lists memory sources without inventing facts."
