# Pinned self-hosted Opik for disposable CI eval boxes (Milestone 22 §3.2).
#
# Provenance: Opik 2.0.27 — the exact stack the operator's local (proven) Opik
# runs; adapted from the upstream comet-ml/opik self-hosted compose. Every image
# is pinned tag@digest; bumping Opik is a reviewed diff of this file (see
# README.md next to it), never a floating tag.
#
# CI-lean deltas vs a persistent local stack:
#   - no volumes: the box is disposable; the report artifact is the durable
#     record (M22 D3). Containers write to their own layer.
#   - no restart policies (a crash should fail the job, not loop silently).
#   - mem_limit on every service so Opik + daemon + build fit a 16 GB runner.
#   - only the frontend publishes a host port (5173); the eval harness and the
#     fermix_opik exporter speak exclusively to http://localhost:5173/api.
#
# Bring-up: docker compose -f this-file up -d --quiet-pull, then poll the
# harness's own precondition via ../wait_opik.sh. Deliberately NOT `--wait`:
# compose --wait treats the exit-0 opik-minio-init one-shot as a failure
# (docker/compose#10596, reproduced locally); wait_opik.sh is the real gate —
# the API route it polls only serves once the whole chain is healthy.

services:
  opik-mysql:
    image: mysql:8.4.2@sha256:ac80b6e09e5b12b4f9d5cd4f6425e43464247aa4ba4f6169da5daf59e5877f7d
    environment:
      MYSQL_ROOT_PASSWORD: opik
      MYSQL_DATABASE: opik
      MYSQL_USER: opik
      MYSQL_PASSWORD: opik
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      timeout: 1s
      interval: 2s
      retries: 120
    mem_limit: 1g
    networks:
      - opik-network

  opik-redis:
    image: redis:7.2.4-alpine3.19@sha256:c8bb255c3559b3e458766db810aa7b3c7af1235b204cfdb304e79ff388fe1a5a
    command: redis-server --requirepass opik
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6379"]
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    networks:
      - opik-network

  opik-zookeeper:
    image: zookeeper:3.9.4@sha256:dfa9ba46d14bd52bcb3c1dac3ba91f179cf4cebf7ee576e1c2df09c68fc1d30d
    user: root
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /bitnami/zookeeper/data
        chown -R zookeeper:zookeeper /bitnami/zookeeper
        exec gosu zookeeper /docker-entrypoint.sh zkServer.sh start-foreground
    environment:
      JVMFLAGS: "-Xmx512m"
      ZOO_4LW_COMMANDS_WHITELIST: "srvr,ruok"
      ZOO_DATA_DIR: /bitnami/zookeeper/data
      ZOO_DATA_LOG_DIR: /bitnami/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 2s
      timeout: 2s
      retries: 120
    mem_limit: 768m
    networks:
      - opik-network

  opik-clickhouse:
    image: clickhouse/clickhouse-server:25.3.6.56-alpine@sha256:157423fca52f596b62a1bf301b037b9f74bfca38089aa57d1bd36c9025f7ecef
    environment:
      CLICKHOUSE_DB: opik
      CLICKHOUSE_USER: opik
      CLICKHOUSE_PASSWORD: opik
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 120
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 3g
    volumes:
      # The stock image ships no <zookeeper> node or {shard}/{replica} macros;
      # without this file the backend's replicated-table migrations fail and the
      # stack never becomes healthy. A read-only bind-mount of a repo file, not
      # a persistent volume — still disposable.
      - ./clickhouse_config/additional_config.xml:/etc/clickhouse-server/config.d/additional_config.xml:ro
    depends_on:
      opik-zookeeper:
        condition: service_healthy
    networks:
      - opik-network

  opik-minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z@sha256:46b3009bf7041eefbd90bd0d2b38c6ddc24d20a35d609551a1802c558c1c958f
    environment:
      MINIO_ROOT_USER: THAAIOSFODNN7EXAMPLE
      MINIO_ROOT_PASSWORD: LESlrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    command: server --console-address ":9090" /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s
    mem_limit: 512m
    networks:
      - opik-network

  opik-minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z@sha256:470f5546b596e16c7816b9c3fa7a78ce4076bb73c2c73f7faeec0c8043923123
    depends_on:
      opik-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set s3 http://opik-minio:9000 THAAIOSFODNN7EXAMPLE LESlrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY --api S3v4 ;
      /usr/bin/mc mb --ignore-existing s3/public;
      /usr/bin/mc anonymous set download s3/public/;
      "
    networks:
      - opik-network

  opik-backend:
    image: ghcr.io/comet-ml/opik/opik-backend:2.0.27@sha256:f316f16ef91e4a8d810759719224c624039e51f6b1a5a81502b354ae67387383
    command: ["bash", "-c", "./run_db_migrations.sh && ./entrypoint.sh"]
    environment:
      STATE_DB_PROTOCOL: "jdbc:mysql://"
      STATE_DB_URL: "opik-mysql:3306/opik?createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
      STATE_DB_DATABASE_NAME: opik
      STATE_DB_USER: opik
      STATE_DB_PASS: opik
      ANALYTICS_DB_MIGRATIONS_URL: "jdbc:clickhouse://opik-clickhouse:8123"
      ANALYTICS_DB_MIGRATIONS_USER: opik
      ANALYTICS_DB_MIGRATIONS_PASS: opik
      ANALYTICS_DB_PROTOCOL: "HTTP"
      ANALYTICS_DB_HOST: "opik-clickhouse"
      ANALYTICS_DB_PORT: 8123
      ANALYTICS_DB_DATABASE_NAME: opik
      ANALYTICS_DB_USERNAME: opik
      ANALYTICS_DB_PASS: opik
      JAVA_OPTS: "-Dliquibase.propertySubstitutionEnabled=true -XX:+UseG1GC -XX:MaxRAMPercentage=80.0"
      REDIS_URL: redis://:opik@opik-redis:6379/
      OPIK_OTEL_SDK_ENABLED: "false"
      OPIK_USAGE_REPORT_ENABLED: "false"
      AWS_ACCESS_KEY_ID: THAAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: LESlrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      IS_MINIO: "true"
      S3_URL: http://opik-minio:9000
      PYTHON_EVALUATOR_URL: http://opik-python-backend:8000
      TOGGLE_GUARDRAILS_ENABLED: "false"
      TOGGLE_WELCOME_WIZARD_ENABLED: "false"
      CORS: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 5s
      timeout: 30s
      retries: 60
      start_period: 30s
    mem_limit: 2560m
    depends_on:
      opik-mysql:
        condition: service_healthy
      opik-clickhouse:
        condition: service_healthy
      opik-minio:
        condition: service_healthy
      opik-redis:
        condition: service_healthy
    networks:
      - opik-network
    tmpfs:
      - /tmp

  opik-python-backend:
    image: ghcr.io/comet-ml/opik/opik-python-backend:2.0.27@sha256:27e7a52b15853bb81259853f040d32466238a62d10aa8f928b39f837d5fafce7
    privileged: true
    environment:
      OPIK_OTEL_SDK_ENABLED: "false"
      PYTHON_CODE_EXECUTOR_STRATEGY: process
      PYTHON_CODE_EXECUTOR_CONTAINERS_NUM: 5
      PYTHON_CODE_EXECUTOR_EXEC_TIMEOUT_IN_SECS: 3
      PYTHON_CODE_EXECUTOR_ALLOW_NETWORK: "false"
      PYTHON_CODE_EXECUTOR_CPU_SHARES: 512
      PYTHON_CODE_EXECUTOR_MEM_LIMIT: "256m"
      OPIK_REVERSE_PROXY_URL: http://opik-frontend:5173/api
      PYTHON_BACKEND_PORT: 8000
      REDIS_URL: redis://:opik@opik-redis:6379/0
      RQ_WORKER_ENABLED: "true"
      OPIK_URL_OVERRIDE: http://opik-backend:8080
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --quiet http://127.0.0.1:8000/healthcheck || exit 0"]
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 10s
    mem_limit: 1g
    depends_on:
      opik-redis:
        condition: service_healthy
    networks:
      - opik-network
    tmpfs:
      - /var/lib/docker

  opik-frontend:
    image: ghcr.io/comet-ml/opik/opik-frontend:2.0.27@sha256:3f73c3aa376213906ccf5cd81bc01cc664560867cad8414a4f06f78717f8c0eb
    ports:
      - "5173:5173"
    environment:
      NGINX_PORT: 5173
      OTEL_TRACE: "off"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:5173/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    mem_limit: 256m
    depends_on:
      opik-backend:
        condition: service_healthy
    networks:
      - opik-network

networks:
  opik-network:
    driver: bridge
