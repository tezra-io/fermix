# Fermix E2E eval — runner configuration.
# Every value here is overridable by an env var (see comments) or a CLI flag.

daemon:
  # The Opik-ENABLED dev daemon. The brew daemon at ~/.fermix does NOT export to
  # Opik, so it cannot be used. Tilde and $HOME are expanded. Env: FERMIX_EVAL_HOME.
  fermix_home: "~/.fermix-dev"
  # `fermix` binary used to drive queries. Env: FERMIX_EVAL_BIN. Default is the
  # bundled shim (resolved relative to the skill dir): it speaks the daemon's
  # current length-prefixed control-socket framing, which the Homebrew 0.1.0
  # binary predates (it gets `:closed`). Set back to "fermix" once a released
  # binary catches up.
  fermix_bin: "bin/fermix-shim"
  # Per-turn timeout handed to `fermix ask --timeout`. Env: FERMIX_EVAL_TIMEOUT_MS.
  # Matches the Fermix `ask`/`chat` default (FermixChannels.CLI.default_timeout_ms/0
  # = 300_000ms), so a slow thinking model isn't cut off mid-turn and scored a
  # failure for being slow rather than wrong.
  default_timeout_ms: 300000

opik:
  # Local Opik REST base (no trailing slash). Env: OPIK_BASE_URL.
  base_url: "http://localhost:5173/api/v1/private"
  # Project the dev daemon exports to. Env: OPIK_PROJECT.
  # The source-built dev daemon (mix fermix.dev) uses "fermix-dev" from config/dev.exs.
  project: "fermix-dev"
  # How long to wait for a turn's trace to appear after `fermix ask` returns.
  poll_timeout_s: 90
  poll_interval_s: 2
  # Web UI base, used only to build clickable trace links in reports.
  ui_base: "http://localhost:5173"

judge:
  # fermix | openai | none. `fermix` reuses the dev daemon (no extra creds) on a
  # dedicated `e2e-judge-*` session; `openai` calls an OpenAI-compatible endpoint
  # (EVAL_JUDGE_API_KEY / EVAL_JUDGE_BASE_URL / model below); `none` skips rubrics.
  backend: "fermix"
  # Judge runs only when enabled here OR `--judge` is passed. Off by default to
  # control cost (each fermix-backed rubric is another real turn).
  enabled: false
  # Model for the openai backend — a fixed, independent judge (recommended for
  # cross-model sweeps so the grader doesn't float with the daemon). IGNORED by the
  # fermix backend; to actually use this, set backend: "openai" above + export
  # EVAL_JUDGE_API_KEY (and EVAL_JUDGE_BASE_URL if not api.openai.com).
  model: "gpt-5.5"

usage_limit:
  # When the daemon's model hits a usage/rate/quota limit mid-sweep, Fermix returns
  # a canned "try again" reply — scoring it would count Fermix's own limit as a task
  # failure. Instead the runner WAITS these many minutes (in order) and retries the
  # turn, then gives up (exit 4, stops at the pointer) if the last wait still fails.
  # Escalating backoff rides out a subscription session-limit (hours long, and whose
  # "~N min" self-report is unreliable). Env: EVAL_USAGE_RETRY_BACKOFF_MIN ("30,60,..").
  # Set to [] for fail-fast (abort on the first limit, no waiting).
  retry_backoff_min: [30, 60, 120, 180]

budgets:
  # Default per-case ceilings; a case may override either in its `expect:` block.
  # A turn exceeding these is a structural gate failure (not a crash).
  max_cost_usd: 2.0
  # Matches `default_timeout_ms` (the Fermix turn timeout): the duration gate must
  # not be stricter than the timeout Fermix itself allows, or a slow-but-correct
  # turn fails on speed rather than on the answer.
  max_duration_ms: 300000

report:
  # Run outputs go to <dir>/<UTC-timestamp>/. Relative to the skill dir. Gitignored.
  dir: "reports"

policy:
  # A run exits non-zero when a `critical`-severity scenario fails a structural
  # gate. Rubric (LLM-judge) failures are surfaced but, by default, only warn.
  rubric_failures: "warn"   # warn | fail
