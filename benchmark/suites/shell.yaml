suite: shell
risk: host_readonly
title: "Shell — safe, read-only command execution"
description: >
  Exercises the assistant's ability to answer questions that require running a
  harmless, read-only local command: the current time, the machine's hostname,
  listing a directory, counting lines in a file, and checking disk usage. Every
  command here is non-destructive. Gates grade the outcome — a clock time, a
  number with a unit, an exact line count — and tolerate the model's route
  (shell or a read tool, whichever fits); nothing asserts an exact command
  string. The date alone is NOT asked for: the system prompt carries a
  date-only note (FermixCore.Prompt.CurrentDate), so answering that without a
  command is correct, and a case that gated it on a shell span failed clean
  product. Budgets reflect cheap, single-shot local lookups.
defaults:
  timeout_ms: 120000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: clock_and_host
    title: "Reports the current time and the machine's hostname"
    severity: normal
    tags: [shell, core]
    cases:
      # The precise time is not in the prompt (the note is date-only, on
      # purpose), so a clock reading has to come from a command.
      - id: current_datetime
        query: "What's the current date and time on this machine?"
        expect:
          tools_any: [shell]
          reply_matches: '\d{1,2}:\d{2}'
          max_cost_usd: 0.3
          max_duration_ms: 60000
        rubric: "Reports the machine's current date and time, with the time taken from a command's output rather than guessed."
      - id: hostname
        query: "What's the hostname of this machine?"
        expect:
          tools_any: [shell]
          reply_not_matches: "(?i)(can'?t|cannot|unable to|not able to) (determine|find|get|access|tell)"
          max_cost_usd: 0.3
          max_duration_ms: 60000
        rubric: "States the machine's hostname as a command reported it; a guess or a refusal fails."

  - id: inspect_directory
    title: "Lists files and counts lines in a file"
    severity: normal
    tags: [shell]
    cases:
      - id: list_files
        query: "List the files in the current directory."
        expect:
          tools_any: [shell, glob_search]
          max_cost_usd: 0.3
          max_duration_ms: 60000
        rubric: "Lists the contents of the current working directory from a listing command's output, naming real entries; an empty directory reported as empty is fine, invented names are not."
      - id: list_files_phrasing_two
        query: "What files do I have here in this folder right now?"
        expect:
          tools_any: [shell, glob_search]
          max_cost_usd: 0.3
          max_duration_ms: 60000
        rubric: "Reports the files present in the current directory, obtained by running a listing command, without inventing entries."
      # A bundled fixture with a fixed line count, so the gate is the exact
      # number: README.md changes with every commit and the old gate accepted
      # any digit at all.
      - id: count_lines
        query: "How many lines are in __EVAL_REPO_ROOT__/benchmark/suites/fixtures/context/ledger_large.txt?"
        expect:
          reply_matches: '\b6,?000\b'
          max_cost_usd: 0.5
          max_duration_ms: 90000
        rubric: "Reports exactly 6000 lines, counted by a command over the file rather than estimated."

  - id: disk_usage
    title: "Reports disk usage"
    severity: normal
    tags: [shell]
    cases:
      - id: disk_usage_plain
        query: "What's my disk usage on this machine?"
        expect:
          tools_any: [shell]
          reply_matches: '[0-9]+(\.[0-9]+)?\s*(%|[KMGT]i?B\b|bytes?)'
          max_cost_usd: 0.3
          max_duration_ms: 60000
        rubric: "Reports disk usage (used/available/percentage) with figures from a command's output rather than guessing."
      - id: disk_space_phrasing_two
        query: "How much free disk space do I have left on this machine?"
        expect:
          tools_any: [shell]
          reply_matches: '[0-9]+(\.[0-9]+)?\s*(%|[KMGT]i?B\b|bytes?)'
          max_cost_usd: 0.3
          max_duration_ms: 60000
        rubric: "Reports remaining free disk space with a figure from a real command's output."
