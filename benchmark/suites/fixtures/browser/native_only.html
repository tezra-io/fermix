<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebMCP counter fixture — native only</title>
<!-- An empty data: icon, so the page requests nothing at all: a browser's
     automatic /favicon.ico fetch would 404 and put a console error in front of
     anyone debugging a failing case. -->
<link rel="icon" href="data:,">
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; }
  #counter { font-size: 2rem; font-weight: 700; }
</style>
</head>
<body>
<h1>WebMCP counter fixture (native only)</h1>
<p>
  This page owns one counter and offers it to agents as two WebMCP tools, but
  only when the browser already provides the WebMCP API. It has no buttons and no
  form fields, so the counter can only be changed by calling
  <code>counter_add</code>.
</p>
<p>Counter: <span id="counter">58</span></p>
<p id="status">Registering tools…</p>

<script>
// Fixture for the `browser` tool's `webmcp` action. Served by
// benchmark/bin/browser_fixture.py on loopback; named by suites/browser.yaml and
// suites/capability/candidates/browser_webmcp.yaml.
//
// This is the NATIVE-ONLY page: it installs no shim, so its tools exist only if
// the managed Chrome was launched with --enable-features=WebMCP. It is therefore
// the proof that the launch flag works, and the alarm the day a Chrome upgrade
// renames the feature — the flag then silently stops applying, this page reports
// no tools, and the cases naming it fail while its shimmed twin still passes.
//
// The tool bodies are identical to shimmed.html's on purpose: the only
// difference between the two pages is what registers the tools, so a failure
// here is about the browser and never about the fixture.
//
// The counter lives in a closure and in the DOM, and nowhere else: no
// localStorage, no sessionStorage, no cookies, no network. Every page load
// therefore starts from the same seed, so a trial cannot inherit the previous
// trial's total.
(function () {
  "use strict";

  const START = 58;
  let count = START;
  const readout = document.getElementById('counter');
  const status = document.getElementById('status');
  const calls = [];

  function render() {
    readout.textContent = String(count);
  }

  // Structured errors, never a throw: a thrown error reaches an agent as opaque
  // text ("the invocation failed"), which tells it nothing about what to fix.
  function add(input) {
    const amount = (input || {}).amount;
    if (typeof amount !== 'number' || !Number.isInteger(amount)) {
      calls.push({ tool: 'counter_add', ok: false });
      return { ok: false, error: 'invalid_amount', message: 'amount must be a whole number' };
    }
    count += amount;
    calls.push({ tool: 'counter_add', ok: true, amount: amount, value: count });
    render();
    return { ok: true, value: count };
  }

  function read() {
    calls.push({ tool: 'counter_read', ok: true, value: count });
    return { ok: true, value: count };
  }

  // The page's own state, readable without trusting a tool's return value.
  window.__fixture = {
    page: 'native_only',
    start: START,
    get value() { return count; },
    calls: calls,
  };

  render();

  const mc = document.modelContext;
  if (!mc) {
    status.textContent =
      'This page offers no tools. It registers them only when the browser already provides the WebMCP API.';
    return;
  }

  // Registered synchronously while this script evaluates, so the tools are
  // listable as soon as the document is ready.
  mc.registerTool({
    name: 'counter_add',
    description: 'Add a whole number to the counter this page owns and return the new total.',
    inputSchema: {
      type: 'object',
      properties: { amount: { type: 'integer', description: 'How much to add to the counter.' } },
      required: ['amount'],
    },
    execute: (input) => add(input),
  });

  mc.registerTool({
    name: 'counter_read',
    description: 'Read the current value of the counter this page owns.',
    inputSchema: { type: 'object', properties: {} },
    execute: () => read(),
  });

  status.textContent = 'This page offers two tools: counter_add and counter_read.';
}());
</script>
</body>
</html>
