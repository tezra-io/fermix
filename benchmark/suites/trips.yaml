          - query: "Remove the Lisset weekend trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply gives the plan as plain text ready to send, a stop a line.
          2. The second reply leaves the door code out.
          3. The third reply confirms the trip was removed.

  - id: trip_not_list
    title: "A trip reaches the trips, never a list, a reminder or a job"
    tags: [trips, routing]
    cases:
      # THE labelled route-sanity case: a planned day reaches trip_edit, and neither
