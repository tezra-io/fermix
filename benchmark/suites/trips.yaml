# Trips (M89) — the owner's trips through real turns: a day trip, a week and three
# weeks, each from one sentence (the last over several calls, since one call carries
# at most 100 ops); a stop moved to another day; "what is Thursday"; a fixed stop
# asked about before it moves; a reply that writes the days out where nothing draws
# a trip; after reading a web page the change the owner asks for lands in that
# turn; a trip made after a search or a page in its turn lands with what was found
# (D9); a trip to a named town is made with that town as its `near`; and the shared
# form carries no note.
#
# WHAT A TURN CAN DRIVE. `fermix ask` is the owner's private chat (the CLI marks its
# turns `chat_type: private`), so trip_read and trip_edit are on the surface, and
# once a trip exists the per-turn lines name it and carry the trip guidance. The CLI
# draws nothing, so every turn is told to write a trip's days out: this suite proves
# that posture, not Telegram's (C23). A turn drawn on the Mac needs the companion
# driver to pull the trips index and gate a `trips` block, which
# `bin/evallib/companion.py` cannot do yet (no `trips_pull`, no block gate): no case
# here pretends to.
#
# PLACES. Every place here is invented, so a lookup finds nothing or offers another
# name, and the stops are saved without a place; a town given as a trip's `near` is
# found by no place search either, so its lookups only offer (D10). The gates never
# depend on placing, only the rubrics read what the answer said about each place.
# The lookups still run against the eval home's place search (Apple Maps where the
# build carries the helper, Brave with a key that includes Place Search on Linux).
# With none ready every stop is saved unplaced and the answer says no place search
# is set up here, which the day-trip rubric accepts as an honest outcome.
#
# ROUTE ASSERTIONS. A change to a trip is the outcome under test, so the turns that
# change one assert `tools_any: [trip_edit]` and what the call carried
# (`tool_inputs_match_all`), phrasing-independent. Reading is not gated on the tool:
# the model may already hold the trip from the turn that made it, so the read turns
# gate on what the reply must name and must not. The suite bans memory_store
# everywhere (a ban, so always sticky): a trip never lives in memory. One labelled
# route-sanity case pins the boundary against the list, reminder and job rails;
# search_then_make labels its own, that the page was read before the trip was made.
#
# FLOORS. Each turn's floor is the stop or day the reply must name, or the tool span
# that is the outcome. Only the shared form's `reply_not_matches` is sticky: its
# pattern is the booking reference itself, the material the shared form must leave
# out.
#
# PROBING FIRST. A model may read a trip before making it, to see none exists, and
# trip_read answers no_trip, as checklist_read answers no_list: right, and a tool
# error. So every turn that makes a new trip lifts `no_tool_errors` and gates the
# create it carried instead; the trip's existence is the next turns' to prove (a
# read's floor, or the remove turn, which keeps the suite's `no_tool_errors` and
# fails when no trip was made).
#
# CLEANUP. The eval home keeps its trips between runs and a title names one trip, so
# every case ends with a turn in which the owner removes the trip it made. A case
# that fails before that turn leaves its trip behind; a later run's create is then
# refused as a title in use, so reseed the home when a run reports title_taken. Every
# name, place and date is invented.
#
# PRECONDITIONS. Trips need no switch and no consent gate, only the memory store,
# which an eval home has. The outside-content cases read the page with `browser`
# (the eval home's web_fetch refuses the runner's loopback fixture server).
suite: trips
risk: isolated_mutation
title: "Trips — a day, a week and three weeks from one sentence, moves, reads, fixed stops, outside content and sharing"
description: >
  Exercises the M89 trip rail through real turns: a day trip, a week and three weeks
  each from one sentence, the long one made over several trip_edit calls; a stop
  moved to another day; one day read on its own; a booked stop asked about before it
  moves; the days written out on a channel that draws nothing; after reading a web
  page the dinner moved and the cruise added as the owner asks, in that turn; a trip
  made after a search or a page in the same turn lands with what was found; a trip
  to a named town is made with that town as where its places are looked up; and the
  shared form leaves the owner's booking note out.
defaults:
  timeout_ms: 300000
  judge: true
  expect:
    status: ok
    no_tool_errors: true
    tools_none: [memory_store]

scenarios:
  - id: day_trip
    title: "A day trip from one sentence: one trip, the stops in order, each place looked up"
    severity: critical
    tags: [trips, core]
    cases:
      - id: varonne_saturday
        turns:
          - query: >-
              Plan Saturday 12 June 2027 in Varonne as a day trip for me: the fish
              market at 8:30, the Torre de Vale Escuro at 10, lunch at Tasca Pedra
              Negra at 13:00 and the Corvelo gardens in the afternoon.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b', '\bplace\W+=>', "2027-06-12"]
              no_tool_errors: false
          - query: "That's all for Varonne, you can remove the trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The first reply confirms a one-day trip on Saturday 12 June 2027 with the
             four stops in the order given, each with its time where one was given.
          2. The first reply says, for the places, what the tool evidence shows: which
             were placed, which were offered under another name, and which were not
             found or not looked up. It invents no address or link the evidence does
             not show.
          3. The second reply confirms the trip was removed.
      - id: lisset_friday
        turns:
          - query: >-
              Make me a day trip to Lisset on Friday 14 May 2027: the cathedral at 9,
              coffee at Café Lúmen, the river walk, then dinner at Casa Orvalho at 8pm.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b', '\bplace\W+=>', "2027-05-14"]
              no_tool_errors: false
          - query: "Plans changed, remove the Lisset trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The first reply confirms a one-day trip on Friday 14 May 2027 with the
             cathedral, the coffee, the river walk and the dinner in that order.
          2. The first reply invents no address or link the tool evidence does not
             show, and says which places could not be placed.
          3. The second reply confirms the trip was removed.

  # NEAR (D10). A place's name searched with nowhere to search lands wherever the
  # search is: a live run placed a small town's "fish market" in another country.
  # A trip made from a request that names its town carries that town as its `near`,
  # so its lookups search there. The gate reads the create op that carried it:
  # `near` and `op => create` in one op's inspected map (`near` sorts before `op`,
  # and `[^}]` keeps the match inside that op). The place search finds no invented
  # town, so these stops are offered, never placed, and the rubric holds the reply
  # to what the answer said.
  - id: near_the_named_town
    title: "A trip to a named town is made with that town as where its places are looked up"
    risk: isolated_mutation
    tags: [trips, places, near]
    cases:
      - id: brevany_fish_market
        turns:
          - query: >-
              Plan Saturday 19 June 2027 in Brevany for me: the fish market at 8:30,
              the clock tower at 10 and lunch by the harbour at 13:00.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bnear\W+=>[^}]*\bop\W+=>\W+create\b', "2027-06-19"]
              no_tool_errors: false
          - query: "Thanks, you can remove the Brevany trip now."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The first reply confirms a one-day trip on Saturday 19 June 2027 with the
             fish market, the clock tower and lunch in that order, each at its time.
          2. The first reply calls no stop placed that the tool evidence shows offered
             or not placed, and gives no stop an address, town or link the tool
             evidence does not show for it.
          3. The second reply confirms the trip was removed.
      - id: ostmere_two_days
        turns:
          - query: >-
              Set up Ostmere days for me, Friday 25 and Saturday 26 June 2027, in
              Ostmere: Friday the old bridge and the town museum, Saturday the
              farmers' market at 9.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bnear\W+=>[^}]*\bop\W+=>\W+create\b', "2027-06-25"]
              no_tool_errors: false
          - query: "Remove the Ostmere days trip, please."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The first reply confirms a two-day trip on Friday 25 and Saturday 26 June
             2027: the old bridge and the town museum on Friday, the farmers' market at
             9:00 on Saturday.
          2. The first reply calls no stop placed that the tool evidence shows offered
             or not placed, and gives no stop an address, town or link the tool
             evidence does not show for it.
          3. The second reply confirms the trip was removed.

  - id: week_and_one_day
    title: "A week from one sentence, then one day of it read on its own"
    severity: critical
    tags: [trips, core]
    cases:
      - id: corvane_thursday
        turns:
          - query: >-
              Set up a week in Corvane, Monday 7 to Sunday 13 June 2027: Monday the old
              town, Tuesday the harbour, Wednesday the Escuro caves, Thursday the
              Marrow valley walk, Friday the vineyards at Corvelo, Saturday the coast
              road, and Sunday the 11:40 train home.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b', "2027-06-07"]
              no_tool_errors: false
          - query: "What's on Thursday?"
            expect:
              reply_matches: "(?i)marrow"
              reply_not_matches: "(?i)caves|vineyard"
          - query: "Remove the Corvane trip, thanks."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The first reply confirms a seven-day trip from Monday 7 to Sunday 13 June
             2027 and says in a few words what each day holds, or that the days are
             set as asked.
          2. The second reply is about Thursday 10 June alone: the Marrow valley walk,
             and nothing from another day.
          3. The third reply confirms the trip was removed.
      - id: halden_wednesday
        turns:
          - query: >-
              Make a week-long trip called Halden week from Monday 7 to Sunday 13 June
              2027. Monday arrive and check in, Tuesday the Halden museum, Wednesday
              the lighthouse at Skarn Point, Thursday a boat to Ostrel island, Friday a
              rest day, Saturday the market, Sunday fly home at 16:05.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b', "2027-06-07"]
              no_tool_errors: false
          - query: "What do I have on Wednesday?"
            expect:
              reply_matches: "(?i)lighthouse|skarn"
              reply_not_matches: "(?i)museum|ostrel"
          - query: "Remove the Halden week trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The first reply confirms a seven-day trip from 7 to 13 June 2027.
          2. The second reply is about Wednesday 9 June alone: the lighthouse at Skarn
             Point, and nothing from another day.
          3. The third reply confirms the trip was removed.

  - id: three_weeks_over_calls
    title: "Three weeks from one sentence, made over several calls of at most 100 ops"
    tags: [trips, long]
    cases:
      - id: barrow_loop
        timeout_ms: 600000
        turns:
          - query: >-
              Set up a three-week rail trip called Barrow loop, 1 to 21 September 2027:
              the first week in Corvane, the second in Lisset and the third in Barrow
              Ness. Every day has breakfast at 8:00, a morning walk at 9:30, lunch at
              13:00, a museum at 15:00 and dinner at 19:30.
            expect:
              tools_any: [trip_edit]
              min_tool_calls: 2
              tool_inputs_match_all: ['\bop\W+create\b', "2027-09-01"]
              no_tool_errors: false
          - query: "Where am I on day 16, and what's first that day?"
            expect:
              reply_matches: "(?i)barrow ness"
          - query: "Remove the Barrow loop trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 4.0
        rubric: |
          1. The first reply confirms a 21-day trip from 1 to 21 September 2027 with
             the five daily stops, and the tool evidence shows every day was made.
          2. The second reply places day 16 (Thursday 16 September) in Barrow Ness and
             names breakfast at 8:00 as its first stop.
          3. The third reply confirms the trip was removed.
      - id: lisset_month
        timeout_ms: 600000
        turns:
          - query: >-
              Plan three weeks for me called Lisset stay, Wednesday 1 September to
              Tuesday 21 September 2027, all in Lisset: each day a swim at 7:00, work
              from 9:00, lunch at 12:30, a walk at 17:00 and dinner at 20:00.
            expect:
              tools_any: [trip_edit]
              min_tool_calls: 2
              tool_inputs_match_all: ['\bop\W+create\b', "2027-09-01"]
              no_tool_errors: false
          - query: "What's the last thing on Tuesday 14 September?"
            expect:
              reply_matches: "(?i)dinner|20[:.]00|8\\s*(:00)?\\s*p\\.?m"
          - query: "Remove the Lisset stay trip please."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 4.0
        rubric: |
          1. The first reply confirms a 21-day trip from 1 to 21 September 2027 with
             the five daily stops, and the tool evidence shows every day was made.
          2. The second reply names dinner at 20:00 as the last stop of Tuesday 14
             September.
          3. The third reply confirms the trip was removed.

  - id: move_a_stop
    title: "A stop moved to another day lands on that day"
    severity: critical
    tags: [trips, core]
    cases:
      - id: museum_to_friday
        turns:
          - query: >-
              Make a trip, Skarn coast, Wednesday 9 to Friday 11 June 2027. Wednesday:
              the Skarn museum at 10 and the harbour walk at 14:00. Thursday: the
              lighthouse at 11. Friday: the market at 9.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b']
              no_tool_errors: false
          - query: "Move the museum to Friday."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+move\b']
          - query: "What's on Friday now?"
            expect:
              reply_matches: "(?i)museum"
          - query: "Remove the Skarn coast trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The second reply confirms the museum moved to Friday 11 June in a sentence
             or two.
          2. The third reply names the market and the museum on Friday.
          3. The fourth reply confirms the trip was removed.
      - id: caves_to_thursday
        turns:
          - query: >-
              Plan Ostrel days, Tuesday 8 to Thursday 10 June 2027: Tuesday the Ostrel
              caves at 10:30 and the old mill at 15:00, Wednesday the beach, Thursday
              the ferry back at 18:20.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b']
              no_tool_errors: false
          - query: "Put the caves on Thursday instead."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+move\b']
          - query: "So what does Thursday look like?"
            expect:
              reply_matches: "(?i)caves"
          - query: "Remove the Ostrel days trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The second reply confirms the caves moved to Thursday 10 June.
          2. The third reply names the caves and the ferry back at 18:20 on Thursday.
          3. The fourth reply confirms the trip was removed.

  - id: fixed_stop_asked_first
    title: "A booked stop is asked about before it moves, and stays where it is"
    severity: critical
    tags: [trips, judgment]
    cases:
      - id: booked_dinner
        turns:
          - query: >-
              Make a trip called Ostrel weekend, Friday 11 to Sunday 13 June 2027.
              Friday: dinner at Casa Orvalho at 20:00, booked, table for two. Saturday:
              the castle at 10.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b', '\bfixed\W+true\b']
              no_tool_errors: false
          - query: "Move the dinner to Saturday."
            expect:
              tools_none: [trip_edit]
          - query: "Leave it then. When's that dinner?"
            expect:
              reply_matches: "(?i)friday"
          - query: "Remove the Ostrel weekend trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The second reply asks before moving the dinner, saying it is booked for
             Friday, and does not say it was moved.
          2. The third reply says the dinner is on Friday 11 June at 20:00.
          3. The fourth reply confirms the trip was removed.
      - id: flight
        turns:
          - query: >-
              Set up Barrow Ness hop, Friday 11 to Saturday 12 June 2027: Friday the
              9:40 flight to Barrow Ness, already ticketed, then the old harbour;
              Saturday the walking tour at 10.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b', '\bfixed\W+true\b']
              no_tool_errors: false
          - query: "Push the flight to Saturday morning."
            expect:
              tools_none: [trip_edit]
          - query: "No, keep it. What day is the flight?"
            expect:
              reply_matches: "(?i)friday"
          - query: "Remove the Barrow Ness hop trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The second reply asks before moving the flight, saying it is ticketed for
             Friday, and does not say it was moved.
          2. The third reply says the flight is on Friday 11 June at 9:40.
          3. The fourth reply confirms the trip was removed.

  - id: days_written_out
    title: "Where nothing draws a trip, the reply writes the day out, a stop a line with its time"
    tags: [trips, presentation]
    cases:
      - id: show_saturday
        turns:
          - query: >-
              Make a trip called Corvelo weekend for Saturday 12 and Sunday 13 June
              2027: Saturday the vineyard tour at 10:30, lunch at 13:00 and the cellar
              tasting at 16:00; Sunday the train home at 12:10.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b']
              no_tool_errors: false
          - query: "Show me Saturday."
            expect:
              reply_matches: "\\b1[03][:.][03]0\\b"
              reply_not_matches: "(?i)12[:.]10"
          - query: "Remove the Corvelo weekend trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply writes Saturday 12 June out as short lines, a stop a line
             with its time: the vineyard tour at 10:30, lunch at 13:00 and the cellar
             tasting at 16:00.
          2. Every stop the tool evidence shows with a place is linked in the second
             reply; no link is invented for a stop without one.
          3. The third reply confirms the trip was removed.
      - id: whole_trip
        turns:
          - query: >-
              Plan Marrow valley, Saturday 2 to Sunday 3 October 2027: Saturday the
              ridge walk at 9:00 and supper at the Marrow inn at 19:00; Sunday the bus
              back at 15:20.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b']
              no_tool_errors: false
          - query: "Write the whole trip out for me."
            expect:
              reply_matches: "\\b(9[:.]00|19[:.]00|15[:.]20)\\b"
          - query: "Remove the Marrow valley trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply writes both days out, a stop a line with its time.
          2. No link is invented for a stop the tool evidence shows without a place.
          3. The third reply confirms the trip was removed.

  # AFTER A PAGE (D9). Reading a page limits nothing a trip takes: the owner reads
  # a restaurant's notice and asks for what it says, Friday's dinner at its new time
  # and the supper cruise added, and both land in that turn. The second turn gates
  # the outcome as the calls carried it, a stop's `time` of 22:00 and a stop's `text`
  # naming the cruise, and keeps the suite's `no_tool_errors`: a trip_edit refused
  # after the page is a tool error, so its pass says nothing was refused. The third
  # turn reads the trip back: its floor is the cruise and the dinner at 22:00, in the
  # trip only if both landed. The dinner is not said to be booked, so no fixed stop
  # is asked about first (fixed_stop_asked_first owns that).
  - id: page_then_change
    title: "After reading a web page, the change the owner asks for lands in the same turn"
    severity: critical
    risk: isolated_mutation
    tags: [trips, outside_content]
    cases:
      - id: restaurant_notice
        turns:
          - query: >-
              Make a trip called Halden coast, Wednesday 9 to Friday 11 June 2027:
              Wednesday the harbour walk, Thursday the lighthouse at 11, Friday dinner
              at Tasca Pedra Negra at 20:00.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b']
              no_tool_errors: false
          - query: >-
              Read __EVAL_FIXTURE_URL__/trip-notice.html and update my Halden coast
              trip with it: Friday's dinner at the time they give now, and their supper
              cruise added too.
            expect:
              tools_any: [browser]
              tool_inputs_match_all: ['\btime\W+22:00\b', '\btext\W+[^"\\]*(?i:cruise)']
          - query: >-
              In my Halden coast trip, what's on Thursday evening, and what time is
              dinner on Friday?
            expect:
              reply_matches: "(?is)^(?=.*\\bcruise)(?=.*(\\b22[:.]00\\b|\\b10\\s*(:00)?\\s*p\\.?m\\b))"
          - query: "Remove the Halden coast trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.5
        rubric: |
          1. The second reply says Friday's dinner is now at 22:00 and the supper
             cruise on Thursday at 19:00 was added, and does not say that either
             change waits for the owner or was refused.
          2. The third reply names the supper cruise on Thursday evening and says the
             trip's dinner on Friday is at 22:00.
          3. The fourth reply confirms the trip was removed.
      - id: note_from_the_restaurant
        turns:
          - query: >-
              Set up Halden days, Wednesday 9 to Friday 11 June 2027: Wednesday the
              museum, Thursday the islands boat at 10, Friday dinner at Tasca Pedra
              Negra at 20:00.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b']
              no_tool_errors: false
          - query: >-
              The restaurant sent this: __EVAL_FIXTURE_URL__/trip-notice.html. Change
              my Halden days trip to match it, and add their supper cruise.
            expect:
              tools_any: [browser]
              tool_inputs_match_all: ['\btime\W+22:00\b', '\btext\W+[^"\\]*(?i:cruise)']
          - query: "In my Halden days trip, when is Friday's dinner, and what's on Thursday night?"
            expect:
              reply_matches: "(?is)^(?=.*\\bcruise)(?=.*(\\b22[:.]00\\b|\\b10\\s*(:00)?\\s*p\\.?m\\b))"
          - query: "Remove the Halden days trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.5
        rubric: |
          1. The second reply says the trip's dinner on Friday moved to 22:00 and the
             supper cruise was added, and does not say that either change waits for
             the owner or was refused.
          2. The third reply says the trip's dinner on Friday is at 22:00 and names the
             supper cruise on Thursday.
          3. The fourth reply confirms the trip was removed.

  # OUTSIDE FIRST, THEN THE TRIP (D9). A search or a page read before a trip is made
  # limits nothing: the trip made after it in the same turn lands, with what was
  # found. penrask_dinners asks for places to eat first. A search for an invented
  # town finds no restaurant, and a place search answers invalid_location, a tool
  # error that taints the turn all the same, so the first turn lifts
  # `no_tool_errors` and gates what needs no search: the create, its first date, a
  # third day as `days` or a stop's `day`, and a dinner each night (a stop's `text`
  # naming one; the `text` key is trip_edit's alone among such a turn's calls). No
  # gate reads one tool's errors, so a trip_edit refused after the search is the
  # rubric's, read from the tool evidence. halden_page_route_sanity is this
  # scenario's labelled route-sanity case: the trip is made from a page, which is
  # read before trip_edit runs (`tools_in_order`), and the create carries what only
  # the page says, the cruise at 19:00 and the dinner at 22:00. The input patterns
  # match a tool span's input as it is recorded, the call's arguments inspected
  # into the span's text (`"op" => "create"`, its quotes escaped when the grader
  # serializes the inputs), so they match no quote.
  - id: search_then_make
    title: "A trip made after a search or a page in the same turn lands with what was found"
    risk: isolated_mutation
    tags: [trips, outside_content]
    cases:
      - id: penrask_dinners
        turns:
          - query: >-
              I'm going to Penrask from Thursday 17 to Saturday 19 June 2027. First
              find me good places to eat there, then plan the trip: the Orrin abbey on
              Thursday morning, the salt marsh walk on Friday and the clock tower at 10
              on Saturday, with a good dinner every night.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all:
                - '\bop\W+create\b'
                - "2027-06-17"
                - '\bdays?\W+3\b'
                - '\btext\W+[^"\\]*(?i:dinner|supper)'
              no_tool_errors: false
          - query: "Thanks, that's enough for now. Remove the Penrask trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The first reply confirms a three-day trip from Thursday 17 to Saturday 19
             June 2027 with the abbey, the salt marsh walk and the clock tower on their
             days, and a dinner each night.
          2. No trip_edit answer in the first turn's tool evidence refuses a change
             because the turn had read something from outside.
          3. Every restaurant the first reply recommends by name is one the tool
             evidence shows a search returned; where the search found none, the reply
             says so and names no restaurant.
          4. The second reply confirms the trip was removed.
      # The labelled route-sanity case: the page is read before the trip is made.
      - id: halden_page_route_sanity
        turns:
          - query: >-
              Have a look at __EVAL_FIXTURE_URL__/trip-notice.html, then make me a trip
              called Halden supper for Thursday 10 and Friday 11 June 2027, with their
              supper cruise on Thursday and dinner at Tasca Pedra Negra on Friday at
              the time they give.
            expect:
              tools_in_order: [browser, trip_edit]
              tool_inputs_match_all:
                - '\bop\W+create\b'
                - "2027-06-10"
                - '\btext\W+[^"\\]*(?i:cruise)'
                - '\btime\W+19:00\b'
                - '\btime\W+22:00\b'
              no_tool_errors: false
          - query: "Remove the Halden supper trip, please."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The first reply confirms a two-day trip on Thursday 10 and Friday 11 June
             2027 with the supper cruise on Thursday at 19:00 and dinner at Tasca Pedra
             Negra on Friday at 22:00.
          2. No trip_edit answer in the first turn's tool evidence refuses a change
             because the turn had read something from outside.
          3. The second reply confirms the trip was removed.

  - id: shared_form_no_note
    title: "The trip as it is sent carries no booking note"
    severity: critical
    tags: [trips, privacy]
    sticky_gates: [reply_not_matches]
    cases:
      - id: for_my_sister
        turns:
          - query: >-
              Make a trip called Varonne weekend, Saturday 12 to Sunday 13 June 2027:
              Saturday the Torre de Vale Escuro at 10 and dinner at Tasca Pedra Negra
              at 20:00 with the note "booking ref KX-4417"; Sunday the coast road.
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+create\b']
              no_tool_errors: false
          - query: "Give me the Varonne weekend plan the way I'd send it to my sister."
            expect:
              tool_inputs_match_all: ['\bas\W+share\b']
              reply_not_matches: "KX-?4417"
          - query: "Remove the Varonne weekend trip."
            expect:
              tools_any: [trip_edit]
              tool_inputs_match_all: ['\bop\W+remove_trip\b']
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply gives the plan as plain text ready to send: the title and
             dates, each day, a stop a line with its time.
          2. The second reply leaves the booking reference out.
          3. The third reply confirms the trip was removed.
      - id: copy_for_a_friend
        turns:
