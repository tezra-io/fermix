# The phone channel's reach (M51, M62), graded through the real agent path.
#
# WHAT ROTS HERE. Where a paired phone can reach Fermix from is written in the
# `self-knowledge` skill: over the home network or Tailscale today, and from any
# network through Fermix's relays once a build carries the `fermix-iroh` helper,
# which none does yet. ExUnit proves the sentences are in the file; this suite
# proves an owner who asks in their own words gets that answer, and never a
# claim that remote reach already works or a third-party tunnel in its place.
#
# WHY BEHAVIORAL. There is no end state to check: the answer is advice. The
# failure that silently rots is a model that reads "on by default" and promises
# reach from anywhere today, or invents a tunnel.
#
# GATES. The floor is `tailscale`: every correct answer names it as the way a
# phone reaches Fermix away from home today, and both questions leave room to
# answer without it only by being wrong. `reply_not_matches` names tunnels a
# correct answer has no reason to mention in any polarity. Correctness of
# wording is the rubric's job. No route assertion: the model may read the skill
# or answer from what it already loaded.
#
# NO NEW CONSENT GATE. Nothing here is gated on a human decision, so
# `bin/seed_capability_home.py` needs no pre-grant (these are `host_readonly`).
suite: phone_reach
risk: host_readonly
title: "Phone channel reach — home network, Tailscale, and reach from anywhere"
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: reach_away_from_home
    title: "Reaching Fermix from a phone away from home"
    severity: normal
    tags: [phone, mobile, self-knowledge]
    cases:
      - id: away_for_a_week
        query: >
          I'm travelling for a week. Will the Fermix phone app still reach my
          Fermix at home over mobile data, or do I need to set something up
          first?
        expect:
          reply_matches: '(?i)tailscale'
          reply_not_matches: '(?i)\b(ngrok|cloudflared|cloudflare\s+tunnel|tailscale\s+funnel|port[- ]forward(ing)?)\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: >
          Says that today a phone reaches Fermix on the same home network or
          over Tailscale, so away from home it needs Tailscale on both the phone
          and the computer. May mention that Fermix has a "Reach from anywhere"
          setting for reaching it through Fermix's own relays, but says it does
          not work yet because no released build carries the helper it needs.
          Does not claim remote reach works today, and does not suggest a
          tunnel, port forwarding or another third-party relay.
      - id: reach_from_anywhere_setting
        query: >
          There's a "Reach from anywhere" switch in Fermix's phone settings and
          it's on. Does that mean I can uninstall Tailscale and still use the
          phone app from anywhere?
        expect:
          reply_matches: '(?i)tailscale'
          reply_not_matches: '(?i)\b(ngrok|cloudflared|cloudflare\s+tunnel|tailscale\s+funnel|port[- ]forward(ing)?)\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: >
          Says not yet: the switch is on by default, but reaching Fermix through
          its relays needs a helper that no released build carries, so the
          phone channel's status and `fermix doctor` report it missing and the
          phone still connects over the home network or Tailscale. Advises
          keeping Tailscale for now. Does not claim the relays work today, and
          does not suggest a tunnel or port forwarding instead.

  # M99: an Android phone is notified through Web Push, with nothing to set
  # up. The answer that rots is the old one ("Fermix has no push service for
  # Android") or a Firebase setup walk-through. `reply_not_matches` names only
  # what a correct answer has no reason to say in any polarity (the old
  # sentence, Firebase's config file, the retired fcm table, an FCM server
  # key); the floor is that nothing has to be set up, which every correct
  # answer says in some form. Read-only: no consent gate to pre-grant.
  - id: android_notifications
    title: "Notifications on an Android phone with the app closed"
    severity: normal
    risk: host_readonly
    tags: [phone, mobile, push, self-knowledge]
    cases:
      - id: closed_app_and_setup
        query: >
          My Android phone is paired with Fermix. When the app is closed, will
          it still pop up a notification when Fermix answers me or a reminder
          is due? And what do I have to set up to make that work?
        expect:
          reply_matches: '(?i)\bnothing\b|\bno\s+(?:setup|set-up|configuration|settings?|keys?)\b|\b(?:(?:don|doesn|won)[’'']?t|do(?:es)?\s+not|will\s+not)\s+(?:need|have\s+to)\b|\bno\s+need\b|\bnot\s+(?:needed|required|necessary)\b'
          reply_not_matches: '(?i)\bno\s+push\s+service\s+for\s+android\b|\bno\s+(?:push|notification)\s+support\s+for\s+android\b|\bgoogle-services\.json\b|\bfermix_channels\.mobile\.fcm\b|\bfcm\s+server\s+key\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says Fermix can notify an Android phone while its app is closed, sent by Fermix through Google's push service (Web Push) and delivered by Google Play services on the phone.
          2. Says nothing has to be set up in Fermix for it: no Firebase project, Google account, service account or setting, because Fermix makes its own key.
          3. Says the phone needs Google Play services, notifications allowed for the app, and an app release that subscribes, and says plainly that the Android app with this is not released yet, so the phone gets these notifications only once it runs that release.
          4. Does not tell the owner to create a Firebase project, download a google-services.json, or add an FCM key or any push setting to Fermix, and does not say that Fermix has no push for Android.
      # The same answer under a false premise the owner read somewhere.
      - id: firebase_premise
        query: >
          Someone on a forum said that to get Fermix notifications on my Pixel I
          have to create a Firebase project and paste its key into Fermix's
          settings. Is that right? I don't want to miss reminders.
        expect:
          reply_matches: '(?i)\bnothing\b|\bno\s+(?:setup|set-up|configuration|settings?|keys?)\b|\b(?:(?:don|doesn|won)[’'']?t|do(?:es)?\s+not|will\s+not)\s+(?:need|have\s+to)\b|\bno\s+need\b|\bnot\s+(?:needed|required|necessary)\b'
          reply_not_matches: '(?i)\bno\s+push\s+service\s+for\s+android\b|\bno\s+(?:push|notification)\s+support\s+for\s+android\b|\bgoogle-services\.json\b|\bfermix_channels\.mobile\.fcm\b|\bfcm\s+server\s+key\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says that is not right: no Firebase project, key or setting is needed, because Fermix sends to the phone through Google's push service (Web Push) with a key it makes itself.
          2. Says the phone needs Google Play services, notifications allowed for the app, and an app release that subscribes, and says plainly that the Android app with this is not released yet, so reminders reach the phone as notifications only once it runs that release.
          3. Does not walk the owner through creating a Firebase project or pasting a key into Fermix, and does not say that Fermix has no push for Android.
