suite: git
risk: host_readonly
title: "Git — status, log, branch, and safe inspection"
description: >
  Exercises the assistant's read-only git surface against the repository under
  evaluation. The runner expands an explicit repository-root placeholder so the
  development daemon does not mistake its own workspace for the target checkout.
  The working tree and recent history are live state with no fixed answer, so
  those cases are graded by the rubric against the tool evidence; the one
  scenario with a fixed floor asks about the repository's first commit, which
  never changes. The model may run git_read or a git command through the shell,
  so tool gates list both.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: working_tree_status
    title: "Reports the current git status"
    # critical: git tooling is a differentiator; deterministic (a git span) so a
    # broken git path fails the run rather than passing green.
    severity: critical
    tags: [git, read, status]
    cases:
      - id: whats_the_status
        query: "What's the current git status of the repository at __EVAL_REPO_ROOT__?"
        expect:
          tools_any: [git_read, shell]
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Reports the working-tree status (clean, or which files are modified/staged/untracked) based on real git output, without inventing files."
      - id: check_state_before_commit
        query: "Before I commit in the repository at __EVAL_REPO_ROOT__, check whether its working tree is clean."
        expect:
          tools_any: [git_read, shell]
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Inspects git status and reports whether the working tree is clean or has pending changes, naming real files if there are any."

  - id: recent_history
    title: "Shows recent commits and the current branch"
    severity: normal
    tags: [git, read, log, branch]
    cases:
      - id: what_branch
        query: "What branch is checked out in the repository at __EVAL_REPO_ROOT__?"
        expect:
          tools_any: [git_read, shell]
          max_cost_usd: 0.5
          max_duration_ms: 80000
        rubric: "Names the branch that git reports as checked out, not a guess such as main."
      - id: summarize_recent_changes
        query: "Summarize the last 3 commits in the repository at __EVAL_REPO_ROOT__."
        expect:
          tools_any: [git_read, shell]
          max_cost_usd: 0.9
          max_duration_ms: 120000
        rubric: "Summarizes the three most recent commits from real git log output — subjects or hashes that appear in the evidence — without inventing changes."

  - id: project_origins
    title: "Finds the repository's first commit (a fixed floor in live history)"
    severity: normal
    tags: [git, read, log]
    cases:
      # Replaces the old diff_inspect pair, whose gates ("diff|\+|aggregation|
      # unchanged") could not fail. The root commit is dated 2026-03-30 and
      # added CLAUDE.md, a project plan and .gitignore; neither fact moves.
      - id: first_commit_when
        query: "When was the very first commit made in the repository at __EVAL_REPO_ROOT__, and what was it about?"
        expect:
          tools_any: [git_read, shell]
          reply_matches: '(?is)(?=.*2026)(?=.*(2026-03-30|30(th)?\s+(of\s+)?mar(ch)?\b|\bmar(ch)?\s+30(th)?\b))(?=.*\binit)'
          max_cost_usd: 0.9
          max_duration_ms: 120000
        rubric: "Dates the first commit to 30 March 2026 and describes it as the project's initial commit, from real git log output rather than assumption."
      - id: first_commit_contents
        query: "What files did the very first commit in the repository at __EVAL_REPO_ROOT__ add?"
        expect:
          tools_any: [git_read, shell]
          reply_matches: '(?i)\.gitignore|CLAUDE\.md'
          max_cost_usd: 0.9
          max_duration_ms: 120000
        rubric: "Lists the files the root commit added (it included CLAUDE.md, a project plan document and .gitignore), taken from git's own listing of that commit."
