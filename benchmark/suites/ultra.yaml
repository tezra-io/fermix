suite: ultra
risk: expensive
title: "/ultra — wide fan-out on complex multi-part tasks"
description: >
  Exercises /ultra: each query starts with "/ultra ", which the gateway tags
  `run_profile: :ultra`.

  Since the Option B collapse (2026-06-04) /ultra is NOT a separate orchestrator —
  it is a NORMAL agent turn run with the ultra caps unlocked (`subagent_mode: :ultra`
  → up to ~50 narrow probes, <=12 concurrent) plus an exhaustive-mode prompt
  addendum. The model decomposes, fans out WIDE through the `subagents` tool, and
  synthesizes one answer.

  Because it is a normal turn, its workers NEST under the parent trace like regular
  `subagents`, so /ultra is now fully gradeable: the parent trace carries the
  `subagents` tool span, the nested `subagent:*` worker spans (breadth), real cost,
  and the final answer. (The old orphan-telemetry gap that forced reply-only gates
  is gone — see docs/design/ADAPTIVE_EFFORT_AND_DELEGATION.md.)

  COST/TIME: a wide /ultra run is EXPENSIVE and SLOW — one observed run was ~38
  probes, ~17 minutes, ~$85. Run ONE case at a time, deliberately; `timeout_ms` is
  sized to outwait the full fan-out under load (45 min). `min_subagent_spawns` is a
  conservative floor (the model sizes the fan-out to the task; /ultra typically goes
  much wider). Two shapes are kept — a compare-and-recommend and a research-and-plan
  with live fetching; the former second case of each (a three-cloud compare and a
  hiring plan built on levels.fyi scraping) duplicated these at ~$85 apiece.
defaults:
  timeout_ms: 2700000
  judge: true
  expect:
    status: ok
    # A wide /ultra fan-out legitimately runs many minutes (observed 5-17 min);
    # override the global 240s budget so normal runs aren't failed on time. This
    # is a real ceiling (30 min) — still well under the 45-min timeout — to flag a
    # pathological hang. Quality/refusal is graded by the rubric, not a regex.
    max_duration_ms: 1800000

scenarios:
  - id: wide_fanout_tasks
    title: "Decomposes a broad task, fans out wide, and synthesizes one recommendation"
    severity: normal
    tags: [ultra, fanout, research, planning]
    cases:
      - id: databases_high_write
        query: >
          /ultra Compare the trade-offs of three database options for a
          high-write, time-series-heavy workload — PostgreSQL, Cassandra, and
          ClickHouse — across write throughput, read/query patterns, operational
          complexity, and cost at scale. Then recommend one and justify the
          choice with concrete reasons.
        expect:
          tools_any: [subagents]
          min_subagent_spawns: 3
          reply_matches: "(?is)(?=.*postgres)(?=.*cassandra)(?=.*clickhouse)"
          max_cost_usd: 120
        rubric: >
          Covers all three databases (PostgreSQL, Cassandra, ClickHouse) across
          the requested dimensions (write throughput, query patterns,
          operational complexity, cost), then makes a single clear recommendation
          with concrete justification grounded in those trade-offs.
      - id: platform_migration_comparison
        query: >
          /ultra We're moving off Heroku (3 apps, ~5 million requests/month,
          one managed Postgres at 10 GB). Research the three most commonly
          recommended alternatives — Railway, Fly.io, and Render — by fetching
          their current pricing pages and docs. For each: what would our monthly
          bill look like at our scale, how does their managed Postgres compare
          (backups, connection pooling, max storage), and what do recent
          developer community posts say about reliability and support quality.
          Then give us a concrete recommendation with a migration sequence.
        expect:
          tools_any: [subagents]
          min_subagent_spawns: 3
          reply_matches: "(?is)(?=.*railway)(?=.*fly\\.io|.*\\bfly\\b)(?=.*render)"
          max_cost_usd: 120
        rubric: >
          Fetches current pricing and docs for all three platforms (Railway,
          Fly.io, Render), produces a cost estimate for the stated scale,
          compares managed Postgres across the three, incorporates recent
          community sentiment (not just marketing copy), and ends with a single
          concrete recommendation and a migration sequence.
