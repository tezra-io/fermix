suite: jobs
risk: isolated_mutation
title: "Scheduled jobs — schedule, list, pause/resume, remove"
description: >
  Exercises the scheduled-jobs subsystem end to end via the CLI: creating a
  recurring reminder, listing what's scheduled, pausing/resuming it, and
  removing it. Every case uses a run/trial-unique name and its final turn calls
  remove_job. That is normal-path cleanup, not an interruption guarantee: if a
  turn times out or the daemon stops after scheduling, the identifiable job can
  remain in the disposable eval home. Stop the eval daemon and inspect/discard
  that home after an interrupted run. Structural gates are strict where
  identity-preserving behavior matters (clarify before create, update in place
  rather than delete-and-recreate) and leave room for one read beside the
  write: a `list_jobs` before an update or a removal is a reasonable route, not
  a defect. Reply assertions remain phrasing-tolerant. The follow-ups rely on
  one shared conversation thread, so each lifecycle is multi-turn.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: schedule_list_remove
    title: "Schedule a recurring reminder, list it, then delete it"
    # critical: the scheduled-jobs subsystem is a differentiator; deterministic
    # (schedule_job + list_jobs + remove_job spans) so a broken jobs path fails the run.
    severity: critical
    tags: [jobs, core, lifecycle]
    cases:
      - id: weekday_stretch
        turns:
          - query: "Create a weekday 9am stretch reminder named stretch-__EVAL_RUN_ID__-__EVAL_TRIAL__."
            expect:
              tools_any: [schedule_job]
              reply_matches: "(?i)stretch|remind|scheduled|9\\s*am|weekday|every|set up"
          - query: "Show me my scheduled jobs."
            expect:
              tools_any: [list_jobs]
              reply_matches: "(?i)stretch|stand up|9\\s*am|weekday"
          - query: "Okay, delete that stretch reminder."
            expect:
              tools_any: [remove_job]
              reply_matches: "(?i)remov|delet|cancel|gone|done"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 180000
        rubric: >
          Schedules a recurring weekday-9am stretch reminder, then lists it
          showing the stretch reminder, then removes it — confirming the
          deletion at the end. No leftover job should remain.
      - id: hourly_water_reminder
        turns:
          - query: "Set up a Mon–Fri hourly 9am–5pm water reminder named water-__EVAL_RUN_ID__-__EVAL_TRIAL__."
            expect:
              tools_any: [schedule_job]
              reply_matches: "(?i)water|hour|remind|scheduled|set up|every"
          - query: "What jobs do I currently have running?"
            expect:
              tools_any: [list_jobs]
              reply_matches: "(?i)water|hour"
          - query: "Get rid of that water reminder, please."
            expect:
              tools_any: [remove_job]
              reply_matches: "(?i)remov|delet|cancel|gone|done"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 180000
        rubric: >
          Creates an hourly 9–5 Mon–Fri water-reminder job, lists it back, and
          then removes it, confirming the removal. Ends with no leftover job.

  - id: pause_resume_lifecycle
    title: "Schedule, pause, resume, then remove a job"
    severity: normal
    tags: [jobs, lifecycle, pause-resume]
    cases:
      - id: standup_pause_resume
        turns:
          - query: "Schedule a daily 8:30am standup reminder named standup-__EVAL_RUN_ID__-__EVAL_TRIAL__."
            expect:
              tools_any: [schedule_job]
              reply_matches: "(?i)standup|stand-up|8:?30|remind|scheduled|daily|set up"
          - query: "I'm on vacation this week — pause that standup reminder for now."
            expect:
              tools_any: [pause_job]
              reply_matches: "(?i)paus|hold|suspend|stopp?ed"
          - query: "I'm back. Resume the standup reminder."
            expect:
              tools_any: [resume_job]
              reply_matches: "(?i)resum|re-?enabl|active|back on|running"
          - query: "Actually I switched teams — remove the standup reminder entirely."
            expect:
              tools_any: [remove_job]
              reply_matches: "(?i)remov|delet|cancel|gone|done"
        expect:
          max_cost_usd: 2.0
          max_duration_ms: 180000
        rubric: >
          Walks the full lifecycle: schedules a daily standup reminder, pauses
          it, resumes it, and finally removes it, confirming each step. No job
          is left behind.
      - id: backup_pause_resume
        turns:
          - query: "Create a Sunday 10pm laptop-backup reminder named backup-__EVAL_RUN_ID__-__EVAL_TRIAL__."
            expect:
              tools_any: [schedule_job]
              reply_matches: "(?i)back\\s*up|sunday|10\\s*pm|remind|scheduled|set up"
          - query: "Pause the backup reminder while I sort out my drive."
            expect:
              tools_any: [pause_job]
              reply_matches: "(?i)paus|hold|suspend|stopp?ed"
          - query: "Drive's fixed — turn the backup reminder back on."
            expect:
              tools_any: [resume_job]
              reply_matches: "(?i)resum|re-?enabl|active|back on|running"
          - query: "Never mind, delete the backup reminder."
            expect:
              tools_any: [remove_job]
              reply_matches: "(?i)remov|delet|cancel|gone|done"
        expect:
          max_cost_usd: 2.0
          max_duration_ms: 180000
        rubric: >
          Schedules a weekly backup reminder, pauses it, resumes it, then
          removes it — confirming each action and leaving no durable job.

  - id: schedule_update_remove
    title: "Schedule a job, change its timing, then remove it"
    severity: normal
    tags: [jobs, lifecycle, update]
    # Identity-preserving: a retime is an update_job on the same job, never a
    # remove-and-recreate (the tools_none pins that). One read beside the write
    # is allowed — the old `max_tool_calls: 1` failed a model that listed jobs
    # to find the id before editing, which is a reasonable route.
    cases:
      - id: meds_retime
        turns:
          - query: "Create a daily 7am medication reminder named meds-__EVAL_RUN_ID__-__EVAL_TRIAL__."
            expect:
              tools_any: [schedule_job]
              reply_matches: "(?i)medication|meds|7\\s*am|remind|scheduled|daily|set up"
          - query: "Actually, move that medication reminder to 8am instead."
            expect:
              tools_all: [update_job]
              tools_none: [schedule_job, remove_job]
              max_tool_calls: 2
              reply_matches: "(?i)8\\s*am|updat|chang|moved|reschedul"
          - query: "Thanks — now delete the medication reminder."
            expect:
              tools_all: [remove_job]
              tools_none: [schedule_job, update_job]
              max_tool_calls: 2
              reply_matches: "(?i)remov|delet|cancel|gone|done"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 180000
        rubric: >
          Schedules a daily 7am medication reminder, retimes it to 8am, then
          removes it. Acknowledges the time change and the deletion. Leaves no
          leftover job.
      - id: report_retime
        turns:
          - query: "Set a Friday 4pm status-report reminder named report-__EVAL_RUN_ID__-__EVAL_TRIAL__."
            expect:
              tools_any: [schedule_job]
              reply_matches: "(?i)status report|friday|4\\s*pm|remind|scheduled|weekly|set up"
          - query: "Change that report reminder to Thursday at 3pm."
            expect:
              tools_all: [update_job]
              tools_none: [schedule_job, remove_job]
              max_tool_calls: 2
              reply_matches: "(?i)thursday|3\\s*pm|updat|chang|moved|reschedul"
          - query: "Great, you can remove the report reminder now."
            expect:
              tools_all: [remove_job]
              tools_none: [schedule_job, update_job]
              max_tool_calls: 2
              reply_matches: "(?i)remov|delet|cancel|gone|done"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 180000
        rubric: >
          Schedules a weekly Friday-4pm report reminder, reschedules it to
          Thursday 3pm, then removes it — confirming the change and the
          deletion. Ends clean with no durable job.

  - id: clarify_before_scheduling
    title: "Clarifies missing action details before creating a durable job"
    severity: critical
    tags: [jobs, chief-of-staff, multi-turn, clarification, action-boundary]
    # The first-turn floor is "asked a question" plus no write. The old gates
    # demanded the words "time" / "when" / "how long" and both questions at
    # once; a model that asks "Mondays at 9?" or asks the two questions one at
    # a time was correct and failed. Which detail it asked for is the rubric's.
    cases:
      - id: leadership_checkin_scope
        turns:
          - query: >
              Set up a recurring Monday leadership check-in reminder named
              leadership-__EVAL_RUN_ID__-__EVAL_TRIAL__ so I do not miss it.
            expect:
              tools_none: [schedule_job, update_job]
              max_tool_calls: 0
              reply_matches: '\?'
          - query: "Use 9:00 AM America/New_York every Monday."
            expect:
              tools_all: [schedule_job]
              tools_none: [update_job, remove_job]
              max_tool_calls: 1
              reply_matches: "(?i)leadership|monday|9:?00|scheduled|created|set up"
          - query: "Remove that leadership check-in reminder now."
            expect:
              tools_all: [remove_job]
              tools_none: [schedule_job, update_job]
              max_tool_calls: 2
              reply_matches: "(?i)remov|delet|cancel|gone|clean"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 180000
        rubric: >
          Does not invent a time or create a partial reminder on the ambiguous
          first turn. It asks for the missing schedule detail (the time; a
          proposed default is fine as long as nothing is created before the
          answer), creates the named Monday reminder after the answer, and
          removes that same job.
      - id: board_packet_scope
        turns:
          - query: >
              Remind me before the board review to circulate the packet. Name the
              reminder board-packet-__EVAL_RUN_ID__-__EVAL_TRIAL__.
            expect:
              tools_none: [schedule_job, update_job]
              max_tool_calls: 0
              reply_matches: '\?'
          - query: >
              The review is September 10, 2035 at 2:00 PM America/New_York;
              remind me two hours before.
            expect:
              tools_all: [schedule_job]
              tools_none: [update_job, remove_job]
              max_tool_calls: 1
              reply_matches: "(?i)board|packet|september|12:?00|noon|scheduled|created|set up"
          - query: "Remove that board-packet reminder now."
            expect:
              tools_all: [remove_job]
              tools_none: [schedule_job, update_job]
              max_tool_calls: 2
              reply_matches: "(?i)remov|delet|cancel|gone|clean"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 180000
        rubric: >
          Asks for the review date and the lead time (either or both; a second
          question after the first answer is fine) before mutating durable
          state, then schedules the noon reminder and removes that same job. It
          does not pretend the incomplete first request was actionable.

  - id: run_and_inspect
    title: "Fire a job now and read its execution history (runtime, not just CRUD)"
    # The jobs RUNTIME tools (run_job_now / list_job_runs / get_job_run) were untested —
    # scheduling CRUD never proved a job actually EXECUTES. Deterministic tool-span gates
    # on the run and the history read; the detail read is one valid route, not required,
    # because list_job_runs already carries each run's final response.
    severity: normal
    tags: [jobs, runtime, execution]
    cases:
      - id: run_now_then_history
        turns:
          - query: >
              Set up a one-off job called "eval-run-__EVAL_RUN_ID__-__EVAL_TRIAL__"
              for 2035-01-01 00:00 UTC whose only task is to reply with the exact
              marker EVAL-RUN-OK, then kick it off right now so I can see it
              work. Don't tell me how it went yet.
            expect:
              tools_all: [schedule_job, run_job_now]
              tools_none: [remove_job]
              reply_matches: "(?i)trigger|started|queued|running|run|kicked"
              reply_not_matches: "(?i)(can'?t|cannot|unable to|couldn'?t) (run|trigger|fire|schedule|create) (the |a )?job"
          - query: >
              Did it finish? Check that job's run history and tell me the actual
              result — if the newest run is still going, look again a couple of
              times, but don't make anything up and don't remove the job.
            expect:
              tools_any: [list_job_runs, get_job_run]
              tools_none: [remove_job]
              max_tool_calls: 5
              reply_matches: "(?is)(?=.*\\bok\\b)(?=.*EVAL-RUN-OK)"
              reply_not_matches: "(?i)still (queued|running|pending)|not finished yet"
          - query: "Great, delete that one-off job now."
            expect:
              tools_all: [remove_job]
              tools_none: [schedule_job, update_job, run_job_now]
              max_tool_calls: 2
              reply_matches: "(?i)remov|delet|cancel|gone|clean"
        expect:
          max_cost_usd: 2.5
          max_duration_ms: 240000
        rubric: >
          Creates a far-future one-off job, fires it immediately, reads its
          history with bounded re-checks until an `ok` run containing
          EVAL-RUN-OK appears, reports that record, then removes the job. It
          neither races the async run nor invents an outcome.
      - id: run_now_then_run_detail
        turns:
          - query: >
              Set up a one-off job called "backup-check-__EVAL_RUN_ID__-__EVAL_TRIAL__"
              for 2035-01-02 00:00 UTC whose only task is to reply with the exact
              marker BACKUP-CHECK-OK, and run it right away. No need to report
              the outcome yet.
            expect:
              tools_all: [schedule_job, run_job_now]
              tools_none: [remove_job]
              reply_matches: "(?i)trigger|started|queued|running|run|kicked"
          - query: >
              What did that run actually produce? Pull up the newest run of that
              job and give me its status and output — re-check a couple of times
              if it hasn't finished, and leave the job in place.
            expect:
              tools_any: [list_job_runs, get_job_run]
              tools_none: [remove_job]
              max_tool_calls: 6
              reply_matches: "(?is)(?=.*\\bok\\b)(?=.*BACKUP-CHECK-OK)"
              reply_not_matches: "(?i)still (queued|running|pending)|not finished yet"
          - query: "Remove that backup-check job now and confirm it's gone."
            expect:
              tools_all: [remove_job]
              tools_none: [schedule_job, update_job, run_job_now]
              max_tool_calls: 2
              reply_matches: "(?i)remov|delet|cancel|gone|clean"
        expect:
          max_cost_usd: 2.5
          max_duration_ms: 240000
        rubric: >
          Schedules and triggers the job, finds the identified run with bounded
          re-checks, verifies it is `ok` with BACKUP-CHECK-OK, grounds the
          report in that record, and removes the durable job afterward.
