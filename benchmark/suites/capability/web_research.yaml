suite: cap_web_research
title: "Capability — live web research (single verifiable answer)"
description: >
  Realistic info-seeking tasks (the ~21% of real assistant use that needs live
  data) — each reverse-designed (GAIA/AssistantBench style) to have ONE short,
  stable, verifiable answer, with a built-in trap (offset fiscal calendars, a
  common memory-vs-reality flip, set boundaries) so frontier models actually
  diverge instead of all scoring 100%. Every gold was verified against a primary
  source on 2026-06-30 (provenance below each case). A correct answer requires the
  model to actually fetch/ground, not recall stale parametric memory.

  PRECONDITION: the dev daemon's web_search + web_fetch must work, or ALL of these
  fail uniformly (a daemon gap, not a model difference). Answers are stable
  (closed fiscal years, fixed model-year EPA ratings, set-membership), but re-verify
  if re-using much later.
defaults:
  judge: false
  timeout_ms: 240000

scenarios:
  - id: quant_lookup
    title: "Find a specific current/quantitative figure"
    severity: normal
    tags: [capability, web, research]
    cases:
      - id: nvidia_rev_growth_fy24_fy25
        query: >
          NVIDIA's data-center boom blew up its top line. By how many billions of
          US dollars did NVIDIA's TOTAL annual revenue grow from its fiscal year
          2024 to its fiscal year 2025 (use the full-year revenue figures from its
          annual results)? Reply with ONLY the number in billions, as a plain
          decimal (e.g. 12.3) — no units, no commas, nothing else.
        # FY2025 $130.5B − FY2024 $60.9B = $69.6B. Trap: NVIDIA's offset fiscal
        # calendar invites the wrong year-pair. Source: nvidianews.nvidia.com
        # "Financial Results for Fourth Quarter and Fiscal 2025". tol rejects "70".
        score: { match: numeric, expected: 69.6, tolerance: 0.3 }
        # Provenance gate: a no-fetch answer (parametric recall of closed FYs) scores
        # 0 even if the number is right — this task must be answered by live retrieval.
        requires_tools: [web_search, web_fetch]

      - id: irs_401k_limit_2026
        query: >
          What is the IRS employee elective-deferral contribution limit for a
          401(k) plan, for someone under age 50, for tax year 2026? Reply with ONLY
          the dollar amount as a plain number, no commas and no symbols
          (e.g. 12345).
        # $24,500 (up from $23,500 in 2025). Fresh fact (announced Nov 2025, Notice
        # 2025-67) — correct answer is strong evidence of a live lookup. Source:
        # irs.gov/newsroom "401(k) limit increases to $24,500 for 2026".
        score: { match: numeric, expected: 24500, tolerance: 0 }
        requires_tools: [web_search, web_fetch]

      - id: rav4_crv_awd_hybrid_mpg
        query: >
          I'm cross-shopping the all-wheel-drive HYBRID versions of the 2024 Toyota
          RAV4 and the 2024 Honda CR-V. According to the EPA's official ratings
          (fueleconomy.gov), which of the two has the higher COMBINED MPG, and what
          is that combined MPG figure? Reply with ONLY the winning model name and
          its combined MPG, in the form 'RAV4: 39'.
        # RAV4 Hybrid AWD = 39 combined (41/38) beats CR-V Hybrid AWD = 37 (40/34).
        # Trap: the CR-V hybrid is commonly assumed the efficiency leader (memory vs
        # live data). Sources: fueleconomy.gov IDs 47392 (RAV4), 46716 (CR-V).
        score: { match: regex, expected: '(?i)(rav[\s-]?4[\s\S]{0,40}\b39\b|\b39\b[\s\S]{0,40}rav[\s-]?4)' }
        requires_tools: [web_search, web_fetch]

  - id: precise_figure_lookup
    title: "Look up a precise, verify-worthy figure (financial / regulatory)"
    # Replaces the old name-answer 'reason over a set' cases (nato/eu_gdp): those were
    # answerable from parametric memory (Romania/Poland), so a frontier model answered
    # WITHOUT fetching and the provenance gate correctly zeroed a right-but-unretrieved
    # answer — a bad retrieval test. A PRECISE numeric answer reliably induces a fetch
    # (the model verifies the exact figure rather than risk misremembering), matching the
    # nvidia/irs/rav4 cases above. Golds verified against primary sources 2026-07-02.
    severity: normal
    tags: [capability, web, research]
    cases:
      - id: apple_fy24_total_revenue
        query: >
          What was Apple's TOTAL net sales (total revenue) for its full FISCAL year 2024
          (the fiscal year that ended in September 2024)? Reply with ONLY the number in
          billions of US dollars, as a plain decimal (e.g. 12.3) — no units, no commas.
        # $391.0B (precisely $391.035B), up from $383.3B in FY2023. Trap: Apple's fiscal
        # year ends late September, so FY2024 != calendar 2024, and the FY2023 $383.3B
        # figure is the near-miss. Source: apple.com/newsroom Q4 FY2024 results + the
        # FY2024 10-K (aapl-20240928). tol 1.0 accepts 391 / 391.0 / 391.04.
        score: { match: numeric, expected: 391, tolerance: 1.0 }
        requires_tools: [web_search, web_fetch]

      - id: ss_wage_base_2026
        query: >
          What is the Social Security taxable maximum for the year 2026 — the "wage base",
          i.e. the maximum annual earnings subject to Social Security (OASDI) tax? Reply
          with ONLY the dollar amount as a plain number, no commas and no symbols
          (e.g. 12345).
        # $184,500 for 2026 (up from $176,100 in 2025), announced by the SSA on 2025-10-24
        # — a fresh figure the model must look up. Trap: the 2025 value $176,100. Source:
        # ssa.gov/oact/cola/cbb.html + payroll.org.
        score: { match: numeric, expected: 184500, tolerance: 0 }
        requires_tools: [web_search, web_fetch]
