suite: cap_instruction_following
title: "Capability — instruction following (IFEval-style verifiable constraints)"
description: >
  Verifiable output-format / constraint compliance — the SAME competency the agent
  leans on to emit well-formed tool calls and honor system constraints. Every
  constraint here is checkable by regex (no judge). A weak score predicts tool-call
  malformation and format drift inside the agent loop (EVAL_CAPABILITY_SCORING.md §4).
defaults:
  judge: false
  timeout_ms: 120000

scenarios:
  - id: exact_format
    title: "Honor an exact output format"
    severity: normal
    tags: [capability, instruction_following]
    cases:
      - id: json_only
        query: >
          Respond with ONLY a JSON object with a single key "city" whose value is
          the capital of Japan. No prose, no markdown, no code fence.
        score: { match: regex, expected: '\{\s*"city"\s*:\s*"Tokyo"\s*\}' }
      - id: end_with_token
        query: >
          Explain in one sentence why the sky appears blue, then end your entire
          response with the exact word DONE on its own.
        score: { match: regex, expected: '(?i)\bDONE\s*$' }
      - id: all_caps
        query: >
          Reply with the phrase "ship it" — but in ALL UPPERCASE LETTERS, and
          nothing else.
        score: { match: regex, expected: '^\s*[^a-z]*SHIP IT[^a-z]*\s*$' }

  - id: content_constraints
    title: "Include / exclude required content"
    severity: normal
    tags: [capability, instruction_following]
    cases:
      - id: keyword_present
        query: >
          Write a single sentence about the ocean that includes the word
          "bioluminescence".
        score: { match: contains, expected: "bioluminescence" }
      - id: number_format
        query: >
          What is 1024 divided by 8? Reply with ONLY the result as a plain integer,
          no words, no commas.
        score: { match: regex, expected: '^\s*128\s*$' }
