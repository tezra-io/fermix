<!doctype html>
<html><head><title>Instant Quote</title></head>
<body>
  <h1>Instant Quote</h1>
  <label>Quantity: <input id="qty" type="number" placeholder="0"></label>
  <button id="go" onclick="quote()">Get Quote</button>
  <div id="result"></div>
  <script>
    function quote() {
      const qty = parseInt(document.getElementById('qty').value, 10) || 0;
      const unit = 12.50;
      let disc = 0;
      if (qty >= 100) disc = 0.20; else if (qty >= 50) disc = 0.12; else if (qty >= 10) disc = 0.05;
      const total = (qty * unit * (1 - disc)).toFixed(2);
      document.getElementById('result').textContent = 'Total: $' + total;
    }
  </script>
</body></html>
