  - id: halyard_breaking
    name: halyard-breaking
    subject: "a Halyard release or note that changes behaviour an app relies on: a breaking change, a deprecation or a changed default"
    purpose: "Halyard web framework releases that could break our app or need code changes."
    instructions:
      - "Pass only stable releases, not release candidates, betas or nightlies."
      - "Pass only the core halyard package, not plugins such as halyard-auth."
      - "Pass only if it removes, renames or deprecates something, or changes a default."
    listen_for: [Halyard, release, breaking, deprecated, deprecation, migration, removed, default, v4]
    items:
      - id: v4
        source: github-deps
        at: "2026-10-27T15:00:00Z"
        raw: {type: release,
              data: {action: published, repository: {full_name: halyard/halyard},
                     release: {tag_name: v4.0.0, name: "Halyard 4.0.0", prerelease: false,
                               body: "Breaking: the legacy router is removed. See the migration guide.",
                               html_url: "https://github.example/halyard/halyard/releases/tag/v4.0.0"}}}
        label: should_screen_through
        kind: wanted
        why: "A stable core release that removes the router."
      - id: deprecation_390
        source: github-deps
        at: "2026-10-26T11:00:00Z"
        raw: {type: release,
              data: {action: published, repository: {full_name: halyard/halyard},
                     release: {tag_name: v3.9.0, name: "Halyard 3.9.0", prerelease: false,
                               body: "Deprecates Session.fetch/2 in favour of Session.get/2; removal planned for 4.0.",
                               html_url: "https://github.example/halyard/halyard/releases/tag/v3.9.0"}}}
        label: should_screen_through
        kind: wanted
        why: "A stable core release with a deprecation."
      - id: maint_post
        source: x-ai-voices
        at: "2026-10-27T15:30:00Z"
        x: {username: halyard_maint, name: Halyard,
            text: "Halyard 4 is out. Read the migration guide before you upgrade: the old router is gone."}
        label: should_screen_through
        kind: wanted
        why: "The maintainers on the stable 4.0 release and what it removes."
      - id: default_change
        source: github-deps
        at: "2026-10-29T10:00:00Z"
        raw: {type: release,
              data: {action: published, repository: {full_name: halyard/halyard},
                     release: {tag_name: v3.8.2, name: "Halyard 3.8.2", prerelease: false,
                               body: "Fixes cookies dropped on redirect. strict_cookies now defaults to true.",
                               html_url: "https://github.example/halyard/halyard/releases/tag/v3.8.2"}}}
        label: should_screen_through
        kind: wanted_oblique
        why: "A changed default in a patch release, with no breaking or deprecation word."
      - id: rc
        source: github-deps
        at: "2026-10-31T10:00:00Z"
        raw: {type: release,
              data: {action: published, repository: {full_name: halyard/halyard},
                     release: {tag_name: v4.1.0-rc.1, name: "Halyard 4.1.0-rc.1", prerelease: true,
                               body: "Breaking: drops support for Node 18.",
                               html_url: "https://github.example/halyard/halyard/releases/tag/v4.1.0-rc.1"}}}
        label: should_screen_through
        kind: fails_condition
        why: "A breaking change in a release candidate (instruction 1)."
      - id: auth_plugin
        source: github-deps
        at: "2026-10-30T10:00:00Z"
        raw: {type: release,
              data: {action: published, repository: {full_name: halyard/halyard-auth},
                     release: {tag_name: v2.0.0, name: "halyard-auth 2.0.0", prerelease: false,
                               body: "Breaking: tokens use a new format, so existing sessions are signed out.",
                               html_url: "https://github.example/halyard/halyard-auth/releases/tag/v2.0.0"}}}
        label: should_screen_through
        kind: fails_condition
        why: "A breaking change in a plugin (instruction 2)."
      - id: docs_release
        source: github-deps
        at: "2026-10-30T16:00:00Z"
        raw: {type: release,
              data: {action: published, repository: {full_name: halyard/halyard},
                     release: {tag_name: v3.8.3, name: "Halyard 3.8.3", prerelease: false,
                               body: "Documentation fixes and CI updates. No code changes.",
                               html_url: "https://github.example/halyard/halyard/releases/tag/v3.8.3"}}}
        label: irrelevant
        kind: same_source_off_topic
        why: "A core release that changes nothing an app relies on."
      - id: perf_release
        source: github-deps
        at: "2026-10-31T16:00:00Z"
