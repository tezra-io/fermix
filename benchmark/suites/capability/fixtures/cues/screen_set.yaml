  - id: orrin_security
    name: orrin-security
    subject: "a security flaw or advisory concerning Orrin DB"
    purpose: "Security advisories for Orrin DB that affect the servers we run ourselves."
    instructions:
      - "Pass only advisories that affect Orrin DB 7.2 or 7.3."
      - "Pass only high or critical severity, or a CVSS score of 7.0 or more."
      - "Ignore issues in the Orrin Cloud managed service; we self-host."
    listen_for: [Orrin, Orrin DB, OrrinDB, CVE, ORSA, advisory, security, vulnerability, exploit, patch]
    examples:
      - label: pass
        note: "anything high or critical on 7.x"
        source: orrin-news
        at: "2026-09-21T09:00:00Z"
        feed: {title: "ORSA-2026-009: High-severity privilege escalation in Orrin DB 7.1 to 7.3",
               summary: "Fixed in 7.1.12, 7.2.8 and 7.3.3.",
               link: "https://orrindb.example/security/orsa-2026-009"}
    items:
      - id: auth_bypass
        source: orrin-news
        at: "2026-10-27T09:00:00Z"
        feed: {title: "ORSA-2026-014: Critical authentication bypass in Orrin DB 7.2.0 to 7.3.4 (CVSS 9.1)",
               summary: "An unauthenticated client can open a session as any role. Fixed in 7.2.9 and 7.3.5.",
               link: "https://orrindb.example/security/orsa-2026-014"}
        label: should_screen_through
        kind: wanted
        why: "Critical, on 7.2 and 7.3, self-hosted."
      - id: two_flaws
        source: orrin-news
        at: "2026-10-31T09:00:00Z"
        feed: {title: "Orrin DB 7.2.10 and 7.3.7 fix two high-severity flaws",
               summary: "Both are reachable by authenticated users. Upgrading is advised.",
               link: "https://orrindb.example/news/7-3-7"}
        label: should_screen_through
        kind: wanted
        why: "High severity, on both versions we run."
      - id: release_buried
        source: orrin-news
        at: "2026-10-29T09:00:00Z"
        feed: {title: "Orrin DB 7.3.6 released",
               summary: "This release fixes a replication slot leak, speeds up the planner for wide joins, and fixes a crash any authenticated user can trigger with a crafted JSON path (CVE-2026-41102, high).",
               link: "https://orrindb.example/news/7-3-6"}
        label: should_screen_through
        kind: wanted_oblique
        why: "A high-severity flaw on 7.3, buried in a release note whose title says nothing of security."
      - id: researcher_post
        source: x-sec
        at: "2026-10-30T19:10:00Z"
        x: {username: kai_secworks, name: Kai Lindgren,
            text: "Pre-auth crash in Orrin DB's wire protocol on 7.3. CVSS 7.5 by my count. Vendor patch due Tuesday."}
        label: should_screen_through
        kind: wanted_oblique
        why: "A high-severity flaw on 7.3 from a researcher, with no advisory id or wording."
      - id: medium_leak
        source: orrin-news
        at: "2026-10-28T09:00:00Z"
        feed: {title: "ORSA-2026-015: Medium-severity information leak in Orrin DB 7.3 (CVSS 5.3)",
               summary: "Error messages can reveal column names to roles without access. Fixed in 7.3.6.",
               link: "https://orrindb.example/security/orsa-2026-015"}
        label: should_screen_through
        kind: fails_condition
        why: "An advisory on 7.3, below the severity bar (instruction 2)."
      - id: old_version
        source: orrin-news
        at: "2026-10-26T09:00:00Z"
        feed: {title: "ORSA-2026-011: Critical remote code execution in Orrin DB 6.4 and earlier",
               summary: "Orrin DB 7.x is not affected. 6.4 reached end of life in June.",
               link: "https://orrindb.example/security/orsa-2026-011"}
        label: should_screen_through
        kind: fails_condition
        why: "A critical advisory, for versions we do not run (instruction 1)."
      - id: cloud_incident
        source: orrin-news
        at: "2026-10-30T11:00:00Z"
        feed: {title: "Orrin Cloud: tenant isolation flaw fixed on managed clusters",
               summary: "No action is needed by Orrin Cloud customers. Self-hosted Orrin DB is not affected.",
               link: "https://orrindb.example/cloud/incident-2026-10"}
        label: should_screen_through
        kind: fails_condition
