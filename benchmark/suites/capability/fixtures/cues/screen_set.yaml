        at: "2026-10-28T15:00:00Z"
        feed: {title: "A hardening checklist for Orrin DB 7.3 in production",
               summary: "Twelve settings to review before you expose a cluster: TLS, roles, audit logging and more.",
               link: "https://orrindb.example/blog/hardening-7-3"}
        label: irrelevant
        kind: same_source_off_topic
