# The Cues screen eval's labelled set, read by bin/run_screen_eval.py (`make
# capability-screen`). Not a capability suite: run_capability.py globs only
# suites/capability/*.yaml, and this file sits under fixtures/, so no sweep loads it.
#
# Every name, handle, product, school, place, version, price and date is invented;
# a handle or a product may echo the shape of a real one, never the thing.
set: cues_screen
title: "Cues screen: does the decision model let through what the filter model should read?"
risk: host_readonly
description: >
  Watchers written the way Fermix writes them (a one-line purpose, single-criterion
  numbered instructions, keywords drafted broadly), several with stacked conditions,
  and for each one a set of items labelled `should_screen_through` (the filter model
  should get to read it) or `irrelevant`. The runner sends each item through the
  engine's own screen request (`Cues.Filter.Decision.request/1` and
  `Providers.DecisionModel.yes_no/4`) in two question forms, A (today's) and B (no
  numbered instructions), on every decision model whose key is in the environment,
  and reports recall and the share of irrelevant items dropped at four bars.
labelling: >
  Labels were written by hand from the rule below, from each item's text alone,
  before any decision model scored the set; nothing was tuned to a model's answers.
  Each watcher carries a `subject`, written for labelling only and never sent to a
  model: the kind of event the watcher exists for, read from its purpose with every
  narrowing condition left to the numbered instructions. An item is
  `should_screen_through` when it is about that subject, whether or not it meets the
  instructions: the screen's question asks for a yes whenever an item touches the
  purpose or any instruction, and the filter model, which reads every item the screen
  lets through, is the one that applies the conditions. An item is `irrelevant` when
  it is about something else, even when it shares a keyword, an author, a source or a
  surface form with items that matter. Each pair also has a `kind`, which only splits
  the report: `wanted` (it meets every instruction as far as its text shows, so the
  owner wants it delivered and a screen drop loses it), `wanted_oblique` (the same, in
  words that carry few or none of the watcher's keywords: terse, slang, buried),
  `fails_condition` (about the subject, but an instruction excludes it, so the filter
  model, not the screen, should drop it: a screen that scores whether an item meets
  ALL the instructions drops these first); and for irrelevant items `keyword_decoy`
  (shares a keyword or a name, another subject), `same_source_off_topic` (the right
  author, feed or repository, another subject) and `off_topic`. The item the
  2026-11-01 incident turned on (a terse post saying a reset is on its way) is shared
  by two watchers, one broad and one with stacked conditions, and marked `incident`.

shared_items:
  lumen_reset_terse:
    source: x-ai-voices
    at: "2026-10-30T21:14:05Z"
    x: {username: tavi_okonkwo, name: Tavi Okonkwo, text: "lumen reset is on its way. enjoy."}
  lumen_twice_messages:
    source: x-ai-voices
    at: "2026-10-31T16:40:00Z"
    x: {username: tavi_okonkwo, name: Tavi Okonkwo,
        text: "Pro gets twice the messages next month. Details Monday."}

watchers:
  # The incident's strict watcher: three stacked conditions.
  - id: lumen_resets
    name: lumen-resets
    subject: "a reset (a refill) of Lumen Chat's usage limits"
    purpose: "Let me know when Lumen Chat's team announces a usage-limit reset that is still coming."
    instructions:
      - "Pass only posts authored by @tavi_okonkwo."
      - "Pass only an upcoming reset: one that has not happened yet."
      - "Pass announcements, not questions or speculation about a reset."
    listen_for: [reset, usage limits, limits, rate limit, quota, refill, Lumen, Lumen Chat]
    items:
      - id: reset_terse
        ref: lumen_reset_terse
        label: should_screen_through
        kind: wanted_oblique
        incident: true
        why: "The author the watcher names says a reset is still coming; terse, lowercase, no long keyword."
      - id: reset_dated
        source: x-ai-voices
        at: "2026-10-28T16:02:00Z"
        x: {username: tavi_okonkwo, name: Tavi Okonkwo,
            text: "Heads up: we're resetting usage limits for every Lumen Chat plan this Thursday, Oct 29, at 17:00 UTC. Use them up."}
        label: should_screen_through
        kind: wanted
        why: "An upcoming, dated reset announced by the named author."
      - id: refill_tonight
        source: x-ai-voices
        at: "2026-10-26T19:40:00Z"
        x: {username: tavi_okonkwo, name: Tavi Okonkwo, text: "everyone's meter gets topped back up tonight 🎉"}
        label: should_screen_through
        kind: wanted_oblique
        why: "A refill still to come from the named author, with no reset or limit word."
      - id: weekly_refill
        source: x-ai-voices
        at: "2026-11-01T09:00:00Z"
        x: {username: tavi_okonkwo, name: Tavi Okonkwo,
            text: "Starting Monday, Pro limits refill every week instead of every month. First weekly refill: Monday, Nov 9."}
        label: should_screen_through
        kind: wanted
        why: "An announced, dated refill of the limits, still ahead."
      - id: reset_done
        source: x-ai-voices
        at: "2026-10-29T17:06:00Z"
        x: {username: tavi_okonkwo, name: Tavi Okonkwo,
            text: "Reset is done ✅ everyone's limits are back to full. enjoy the weekend"}
        label: should_screen_through
        kind: fails_condition
        why: "A reset, but it already happened (instruction 2)."
      - id: reset_poll
        source: x-ai-voices
        at: "2026-10-31T10:15:00Z"
        x: {username: tavi_okonkwo, name: Tavi Okonkwo,
            text: "should we do one more limit reset before the holidays? tell me below"}
        label: should_screen_through
        kind: fails_condition
        why: "A reset, asked as a question (instruction 3)."
      - id: reset_other_author
        source: x-ai-voices
        at: "2026-10-30T08:30:00Z"
        x: {username: devon_ruiz, name: Devon Ruiz,
            text: "Lumen usage reset is rolling out tomorrow morning for all plans. Confirmed."}
        label: should_screen_through
        kind: fails_condition
        why: "An upcoming reset, from an author the watcher does not name (instruction 1)."
      - id: reset_rumour
        source: x-ai-voices
        at: "2026-10-31T14:00:00Z"
        x: {username: pax_ai_watch, name: PAX AI Watch,
            text: "hearing Lumen might reset limits next week 👀 nothing official yet"}
        label: should_screen_through
        kind: fails_condition
        why: "A reset, as speculation from another author (instructions 1 and 3)."
      - id: twice_messages
        ref: lumen_twice_messages
        label: irrelevant
        kind: same_source_off_topic
        why: "The named author on Lumen's limits, but a raise, not a reset; lumen-plan-changes wants it."
      - id: voice_mode
        source: x-ai-voices
        at: "2026-10-30T15:00:00Z"
        x: {username: tavi_okonkwo, name: Tavi Okonkwo,
            text: "Voice mode is live in Lumen Chat on Android today. Tell me what breaks."}
        label: irrelevant
        kind: same_source_off_topic
        why: "The named author on Lumen Chat, about voice mode."
      - id: bouldering
        source: x-ai-voices
        at: "2026-10-31T18:20:00Z"
        x: {username: tavi_okonkwo, name: Tavi Okonkwo,
            text: "Spent all Saturday at the bouldering gym. My forearms have resigned."}
        label: irrelevant
        kind: same_source_off_topic
        why: "The named author, about her weekend."
      - id: router_reset
        source: x-ai-voices
        at: "2026-10-29T11:00:00Z"
        x: {username: gridwise_help, name: Gridwise Support,
            text: "Router acting up? Hold the reset button for 10 seconds to restore factory settings."}
        label: irrelevant
        kind: keyword_decoy
        why: "A reset of a router."
      - id: kestrel_limits
        source: x-ai-voices
        at: "2026-10-30T12:00:00Z"
        x: {username: kestrel_cloud, name: Kestrel Cloud,
            text: "Kestrel API rate limits reset early on Nov 4 for every free account."}
        label: irrelevant
        kind: keyword_decoy
        why: "An upcoming, announced limit reset of another product."
      - id: lamp_lumens
        source: x-ai-voices
        at: "2026-10-28T09:30:00Z"
        x: {username: brightnook_shop, name: Brightnook,
            text: "Our 1,600-lumen desk lamp is back in stock. Limit two per customer."}
        label: irrelevant
        kind: keyword_decoy
        why: "Lumens of a lamp and a purchase limit."
      - id: sourdough
        source: x-ai-voices
        at: "2026-10-27T08:00:00Z"
        x: {username: marisol_bakes, name: Marisol Bakes,
            text: "Cold kitchen? Put your sourdough starter in the oven with only the light on."}
        label: irrelevant
        kind: off_topic
        why: "Baking."

  # The broad watcher the same post passed.
