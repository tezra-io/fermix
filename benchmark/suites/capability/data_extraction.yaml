suite: cap_data_extraction
risk: isolated_mutation
title: "Capability — data extraction from a seeded file (checker-scored)"
description: >
  Realistic "make sense of my messy data" tasks — the kind people paste into an
  assistant daily — but the data lives in a SEEDED workspace file the agent must READ
  (file tools) rather than inline in the prompt. That makes the answer unreachable
  without Fermix's tools, so a tool-less baseline scores 0 and the gap is measurable
  UPLIFT (the inline version measured none). Each payload keeps its planted traps so
  frontier models diverge, and is graded by a checker over the answer the agent writes.

  PRECONDITION: shell/file tools enabled + a sandbox rooted at the workspace (the
  absolute {ws} resolves in any mode). Checkers grade the written answer.txt end-state.
defaults:
  judge: false
  timeout_ms: 180000

scenarios:
  - id: file_extraction
    title: "Extract/compute the right value from a messy seeded file"
    severity: normal
    tags: [capability, data, extraction, checker]
    cases:
      - id: expense_groceries_total
        query: >
          In {ws} there's a file expenses.csv (columns Date,Category,Description,Amount).
          Treat amounts in parentheses as refunds (i.e. negative). Counting every row
          whose Category is "Groceries" — matching case- and whitespace-insensitively —
          what did I spend on groceries in total? Write ONLY the number (two decimals, no
          currency symbol) to {ws}/answer.txt.
        # gold 1419.35. Traps: refund sign, quoted thousands-separator, a duplicate
        # header row, "GROCERIES"/"groceries " case+space collisions, singular "Grocery"
        # excluded, Dining/Transport excluded.
        checker:
          script: "suites/capability/checkers/expense_total.py"
          mode: json
          seed: "suites/capability/fixtures/data/expenses"
          timeout_ms: 60000

      - id: order_email_extract
        query: >
          In {ws} there's a file order.txt — a forwarded order confirmation. Extract the
          fields and write EXACTLY one line (and nothing else) to {ws}/answer.txt in the
          format <order_id>|<total_charged>|<item_count>|<delivery_date>, where order_id
          is the bare order number, total_charged is the final amount actually charged
          (a number, no symbol), item_count is the TOTAL number of physical items (sum of
          quantities), and delivery_date is YYYY-MM-DD.
        # gold NW-48213|94.74|6|2026-03-03. Traps: total (94.74) not subtotal (80.50);
        # item_count = 2+1+3 = 6 (sum of quantities) not 3 line items; date normalization.
        checker:
          script: "suites/capability/checkers/order_extract.py"
          mode: json
          seed: "suites/capability/fixtures/data/order"
          timeout_ms: 60000
