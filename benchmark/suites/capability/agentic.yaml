suite: cap_agentic
risk: isolated_mutation
title: "Capability — complex agentic tasks (delegation, scheduling, self-modification)"
description: >
  Multi-step agentic tasks that a single-shot answer can't fake — the kind that separate a
  flagship from a mini. Each is checker-graded over the sandbox end-state AND correlated
  with the trace that produced it: an artifact alone proves nothing (a hand-written
  job_out.txt holding the expected token used to score full credit), so the cron and skill
  tasks require every named tool to have SUCCEEDED (`requires_tools_all`) and the cron
  artifact must carry THIS trial's `{token}`, written by the scheduled run rather than
  directly. EXPENSIVE: subagent fan-out spawns multiple workers; keep trials modest.

  PRECONDITION: an eval daemon with shell/file tools + subagents + jobs + skills enabled and
  a sandbox rooted at the workspace. Checkers grade the written end-state; the seeded {ws} is
  an absolute sandbox path. `{token}` is substituted per trial by the runner, so a token
  memorized from an earlier sweep is worthless.
defaults:
  judge: false
  timeout_ms: 600000

scenarios:
  - id: delegate_and_synthesize
    risk: expensive
    title: "Fan out to parallel subagents, then synthesize covering every branch"
    severity: normal
    tags: [capability, agentic, subagents, delegation]
    cases:
      - id: summarize_four_subsystems
        query: >
          There are four subsystem write-ups in {ws} (gateway.txt, memory.txt,
          scheduler.txt, sandbox.txt). Split them across a few of your sub-agents so they
          get read in parallel, then put one combined summary in {ws}/summary.txt that
          covers each subsystem's internal codename and what it does.
        # The user asks for parallel workers, so the trial is graded on whether they
        # were spawned — a single worker doing all four files did a different task.
        expect:
          min_subagent_spawns: 2
        checker:
          script: "suites/capability/checkers/subagent_synthesis.py"
          mode: json
          seed: "suites/capability/fixtures/agentic/subsystems"
          timeout_ms: 60000
        requires_tools: [subagents]

  - id: schedule_run_verify
    title: "Schedule a job, run it now, and wait for its isolated run to produce an artifact"
    severity: normal
    tags: [capability, agentic, jobs, cron]
    cases:
      # Renamed from job_writes_token when the prompt stopped explaining that a job
      # cannot see the chat: knowing that is part of what this task now measures, so its
      # scores are not comparable with the hinted version's.
      - id: one_off_job_writes_file
        query: >
          Set up a one-off job that writes {token} into {ws}/job_out.txt, kick it off now,
          and only tell me it's done once the run has actually finished.
        checker:
          script: "suites/capability/checkers/cron_job_output.py"
          mode: json
          timeout_ms: 60000
        # The job must have been scheduled; the checker proves its run completed. Not
        # run_job_now: a job due now is started by its own schedule, and run_job_now is
        # then correctly refused as a duplicate while the job does the work.
        requires_tools_all: [schedule_job]

  - id: self_modify_skill
    title: "Author a new skill for itself and confirm it registered live"
    severity: normal
    tags: [capability, agentic, skills, self-modification]
    cases:
      # Renamed from create_and_confirm_skill when the prompt stopped saying "reload
      # your skills": a created skill is only live after a reload, and knowing that is
      # now part of the task, so its scores are not comparable with the hinted version's.
      - id: new_skill_usable_now
        query: >
          Add a skill called "eval-echo" that just replies with the word ECHO, and make sure
          I can use it right away. Then save the names of the skills you have right now to
          {ws}/skills.txt, one per line, so I can check it's there.
        checker:
          script: "suites/capability/checkers/skill_created.py"
          mode: json
          timeout_ms: 60000
          # The runner restores this baseline before EVERY trial: skill_create refuses
          # "already exists" on a filesystem check, so trial 2 onward would grade the
          # leftover skill from trial 1 instead of the model.
          reset: [skills/eval-echo]
        # ALL-of: as an any-of gate this read "created OR reloaded", and half the work
        # scored full credit.
        requires_tools_all: [skill_create, skill_reload]
