suite: cap_core
title: "Capability — core ground-truth tasks"
description: >
  Objectively-scored capability tasks for cross-model ranking (NOT behavioral
  regression — that's the top-level suites/). Each case carries a `score:` block
  graded by scoring.score_answer, and instructs a STRICT final answer so
  exact/numeric scoring is fair (a prose answer would fail `exact` even when
  correct — see EVAL_CAPABILITY_SCORING.md §4). Mix of no-tools reasoning
  (knowledge/math) and tool-exercising tasks (live web), so the score reflects
  the model's capability THROUGH Fermix's toolset.

  Run: `uv run bin/run_capability.py --suite cap_core --trials 3`.
defaults:
  judge: false
  timeout_ms: 180000

scenarios:
  - id: factual_knowledge
    title: "Factual recall, strict one-line answer (no tools needed)"
    severity: normal
    tags: [capability, knowledge]
    cases:
      - id: capital_australia
        query: >
          What is the capital city of Australia? Reply with ONLY the city name,
          nothing else.
        score: { match: contains, expected: "Canberra" }
      - id: chemical_symbol_gold
        query: >
          What is the chemical symbol for gold? Reply with ONLY the element
          symbol, nothing else.
        score: { match: exact, expected: "Au" }
      - id: speed_of_light
        query: >
          What is the speed of light in a vacuum, in meters per second, to the
          nearest whole number? Reply with ONLY the number (no units, no commas).
        score: { match: numeric, expected: 299792458, tolerance: 0 }

  - id: arithmetic_reasoning
    title: "Multi-step arithmetic, strict numeric answer"
    severity: normal
    tags: [capability, math, reasoning]
    cases:
      - id: compound_discount
        query: >
          A shirt costs $80. It is discounted 25%, then another 10% off the
          reduced price. What is the final price in dollars? Reply with ONLY the
          number.
        score: { match: numeric, expected: 54, tolerance: 0.01 }
      - id: train_distance
        query: >
          A train travels at 60 mph for 2.5 hours. How many miles does it travel?
          Reply with ONLY the number.
        score: { match: numeric, expected: 150, tolerance: 0.01 }

  - id: live_web_lookup
    title: "Answer requires a live web lookup (exercises web tools)"
    severity: normal
    tags: [capability, web, tools]
    cases:
      - id: openai_ceo
        query: >
          Who is the current CEO of OpenAI? Reply with ONLY the person's full
          name, nothing else.
        score: { match: contains, expected: "Altman" }
      - id: anthropic_founders
        query: >
          What is the name of the company that makes the Claude family of AI
          models? Reply with ONLY the company name.
        score: { match: contains, expected: "Anthropic" }
