  # MILESTONE_83 draft 2 §08, carried into draft 3 unchanged: the owner is preparing
  # something to submit and Fermix does not know when it closes. Fermix checks what
  # it already keeps, does the work, and may end with one question asking when it
  # closes; it records the loop only once the owner gives or confirms a date, and
  # looks nothing up unless asked. The question is reply text, so only the rubric sees
  # it; the gates guard the routes and the boundary. Each case's comment carries draft
  # 2's expectation on today's code ("red first" or "guard").
  #
  # LOOKUPS. Draft 2 named web_search and web_fetch. In the eval home web_fetch refuses
  # the runner's loopback fixture server (Net.Guard treats 127.0.0.0/8 as non-global),
  # so the page is read with browser: the one positive lookup gate names browser, and
  # every "looks nothing up" ban names browser beside the two draft 2 listed.
  - id: capture_curiosity
    title: "Preparing a submission with no known closing date: one question, a loop only once a date is confirmed"
    severity: critical
    tags: [open_loops, curiosity, judgment]
    cases:
      # Red first on T1's list gate and rubric. THE labelled route-sanity case for the
      # list check: a loop recorded in another chat cannot be staged here, so the check
      # itself is asserted as a call.
      - id: curious_draft
        turns:
          - query: >-
              Can you tighten my answer to the Brightfield application's "Why now?"
              question? "We started Tallow because small bakeries throw away about a
              fifth of what they bake each week, and the stock tools that could fix it
              are built for supermarkets. In the last six months 14 bakeries in Wexmoor
              have started using our pilot, and together they have cut their waste by
              31%. We think the time is now because flour and energy costs have made
              waste something every owner is watching very closely at the moment."
            expect:
              tools_any: [open_loop_list]
              tools_none: [open_loop_note, event_store, web_search, web_fetch, browser]
          - query: "It closes on March 12."
            expect:
              tools_any: [open_loop_note]
              tools_none: [web_search, web_fetch, browser]
          - query: "Actually, I've decided to skip Brightfield this round."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The first reply tightens the answer, keeping the 14 bakeries and the 31%.
          2. The first reply asks whether or when the application closes, once, and says
             nothing about tracking, recording or reminding.
          3. The second reply says nothing about recording, tracking or checking in on
             the application.
          4. The third reply accepts the change briefly, without asking the owner to
             reconsider.

      # Red first expected; stage 0 confirms.
      - id: asked_to_check
        turns:
          - query: >-
              Can you tighten my answer to the Brightfield application's "Why now?"
              question? "We started Tallow because small bakeries throw away about a
              fifth of what they bake each week, and the stock tools that could fix it
              are built for supermarkets. In the last six months 14 bakeries in Wexmoor
              have started using our pilot, and together they have cut their waste by
              31%. We think the time is now because flour and energy costs have made
              waste something every owner is watching very closely at the moment."
          - query: "Not sure, can you check? __EVAL_FIXTURE_URL__/brightfield.html"
            expect:
              tools_any: [browser]
              tools_none: [open_loop_note]
          - query: "Yes, that's the one."
            expect:
              tools_any: [open_loop_note]
          - query: "Change of plan, I'm not applying to Brightfield after all."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The second reply gives the closing date, March 12, with the page as its
             source, and asks whether that is the one the owner is working to.
          2. The third reply does not announce that it is tracking, recording or will
             remind about the application.
          3. The fourth reply accepts the change briefly, without asking the owner to
             reconsider.

      # Red first on T2's rubric.
      - id: earlier_lookup_then_work
        turns:
          - query: "When does Brightfield close? __EVAL_FIXTURE_URL__/brightfield.html"
            expect:
              tools_none: [open_loop_note]
          - query: >-
              Can you tighten my answer to their "Why now?" question? "We started
              Tallow because small bakeries throw away about a fifth of what they bake
              each week, and the stock tools that could fix it are built for
              supermarkets. In the last six months 14 bakeries in Wexmoor have started
              using our pilot, and together they have cut their waste by 31%."
            expect:
              tools_none: [open_loop_note, web_search, web_fetch, browser]
          - query: "Yes."
            expect:
              tools_any: [open_loop_note]
          - query: "I've decided to wait for the autumn round, so the spring application is off."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 2.0
        rubric: |
          1. The first reply gives the closing date, March 12.
          2. The second reply tightens the answer and asks whether March 12 is the date
             the owner is working to.
          3. The third reply does not announce that it is tracking, recording or will
             remind about the application.
          4. The fourth reply accepts the change briefly, without asking the owner to
             reconsider.

      # Red first on T1's rubric, or on its gate if today's model records the pasted
      # date unconfirmed; both are the defect.
      - id: pasted_deadline_own_application
        turns:
          - query: >-
              Here's the Brightfield form: "Brightfield Founders Fellowship, spring
              cohort. Applications close March 12 at 5pm. Question 3: What is the
              hardest thing you have learned about your customers?" And my answer:
              "That bakery owners do not trust numbers they did not count themselves,
              so our pilot shows every saving right next to the tray counts that their
              own staff entered at the end of the day." Can you tighten it?
            expect:
              tools_none: [open_loop_note, web_search, web_fetch, browser]
          - query: "Yes."
            expect:
              tools_any: [open_loop_note]
          - query: "On second thought, I'm not going to apply this round."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The first reply tightens the answer.
          2. The first reply asks whether the form's date, March 12, is the one the
             owner is working to, rather than asking when the application is due.
          3. The second reply does not announce that it is tracking, recording or will
             remind about the application.
          4. The third reply accepts the change briefly, without asking the owner to
             reconsider.

      # Red first expected; stage 0 confirms.
      - id: date_said_earlier_then_work
        turns:
          - query: "Brightfield closes on March 12, by the way."
          - query: >-
              Can you tighten my answer to their "Why now?" question? "We started
              Tallow because small bakeries throw away about a fifth of what they bake
              each week, and the stock tools that could fix it are built for
              supermarkets. In the last six months 14 bakeries in Wexmoor have started
              using our pilot, and together they have cut their waste by 31%."
            expect:
              tools_any: [open_loop_note]
          - query: "Actually, I'm going to give Brightfield a miss this time."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply tightens the answer.
          2. The second reply asks no question about the deadline and does not announce
             that it is tracking, recording or will remind about the application.
          3. The third reply accepts the change briefly, without asking the owner to
             reconsider.

      # Red first (no such answer today).
      - id: moved_date
        turns:
          - query: >-
              I'm finishing my Brightfield application, it closes on March 12. Can you
              tighten this answer? "We started Tallow because small bakeries throw away
              about a fifth of what they bake each week, and the stock tools that could
              fix it are built for supermarkets."
          - query: "They pushed Brightfield back to March 19."
            expect:
              tools_any: [open_loop_update]
              tools_none: [open_loop_note]
          - query: "Forget it, I've decided not to apply this round."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply acknowledges the new closing date, March 19, without
             arguing.
          2. The third reply accepts the change briefly, without asking the owner to
             reconsider.

      # Guard.
      - id: ignored_question
        turns:
          - query: >-
              Can you tighten my answer to the Brightfield application's "Why now?"
              question? "We started Tallow because small bakeries throw away about a
              fifth of what they bake each week, and the stock tools that could fix it
              are built for supermarkets. In the last six months 14 bakeries in Wexmoor
              have started using our pilot, and together they have cut their waste by
              31%."
          - query: >-
              Next one, "What would you do with the stipend?": "We would use the
              stipend to pay for our first part-time engineer and to keep the pilot
              free for bakeries for another six months while we prove that the savings
              hold up over a full year."
            expect:
              tools_none: [open_loop_note]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply tightens the stipend answer.
          2. The second reply asks no question about the deadline.

      # Guard.
      - id: unsure_no_lookup
        turns:
          - query: >-
              Can you tighten my answer to the Brightfield application's "Why now?"
              question? "We started Tallow because small bakeries throw away about a
              fifth of what they bake each week, and the stock tools that could fix it
              are built for supermarkets. In the last six months 14 bakeries in Wexmoor
              have started using our pilot, and together they have cut their waste by
              31%."
          - query: "No idea, honestly."
            expect:
              tools_none: [open_loop_note, web_search, web_fetch, browser]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply lets the closing date go: it asks nothing further about
             it and does not offer to look it up.

      # Guard.
      - id: no_deadline_answer
        turns:
          - query: >-
              Can you tighten my answer to the Brightfield application's "Why now?"
              question? "We started Tallow because small bakeries throw away about a
              fifth of what they bake each week, and the stock tools that could fix it
              are built for supermarkets. In the last six months 14 bakeries in Wexmoor
              have started using our pilot, and together they have cut their waste by
              31%."
          - query: "It's rolling, no deadline."
            expect:
              tools_none: [open_loop_note, event_store]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply lets it go: it asks nothing further about the deadline.

      # Guard.
      - id: asking_only
        query: "What does the Brightfield application usually ask for?"
        expect:
          tools_none: [open_loop_note, event_store]
          max_cost_usd: 1.0
        rubric: |
          1. The reply answers what such an application usually asks for, or says it
             does not know this programme's form and names what such forms commonly ask.
          2. The reply asks nothing about whether or when the owner is applying.

      # Guard.
      - id: considering_only
        query: "I'm thinking about applying to Brightfield. Is it worth it?"
        expect:
          tools_none: [open_loop_note, event_store]
          max_cost_usd: 1.0
        rubric: |
          1. The reply answers whether applying is worth it, or what would decide it.
          2. The reply asks no question about the deadline.

      # Guard.
      - id: earlier_lookup_then_asking
        turns:
          - query: "When does Brightfield close? __EVAL_FIXTURE_URL__/brightfield.html"
          - query: "What do they look for in founders?"
            expect:
              tools_none: [open_loop_note]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply says what Brightfield looks for in founders.
          2. The second reply asks no question about the deadline.

      # Guard.
      - id: someone_elses
        query: >-
          Can you tighten my brother's answer for his Brightfield application? "The
          hardest thing we learned is that the farm owners we spoke to do not actually
          want an app, what they want is for the paperwork to just go away, so we have
          rebuilt our product around a phone call that fills in the forms for them."
        expect:
          tools_none: [open_loop_note, web_search, web_fetch, browser]
          max_cost_usd: 1.0
        rubric: |
          1. The reply tightens the brother's answer.
          2. The reply asks no question about the deadline.

      # Guard.
      - id: lookup_for_someone_else
        turns:
          - query: >-
              When does Brightfield close? My brother is applying.
              __EVAL_FIXTURE_URL__/brightfield.html
          - query: >-
              Can you tighten his answer? "The hardest thing we learned is that the farm
              owners we spoke to do not actually want an app, what they want is for the
              paperwork to just go away, so we have rebuilt our product around a phone
              call that fills in the forms for them."
            expect:
              tools_none: [open_loop_note]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The second reply tightens the brother's answer.
          2. The second reply asks no question about the deadline.

      # Guard.
      - id: already_dated
        turns:
          - query: >-
              Finishing my Brightfield application, it closes March 12; tighten this
              answer? "We started Tallow because small bakeries throw away about a
              fifth of what they bake each week, and the stock tools that could fix it
              are built for supermarkets."
            expect:
              tools_any: [open_loop_note]
          - query: "Never mind, I'm pulling out of the Brightfield application."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 1.5
        rubric: |
          1. The first reply tightens the answer and asks no question about the
             deadline.
          2. The second reply accepts the change briefly, without asking the owner to
             reconsider.

      # Guard. Rubric only: code correctly refuses a note dated minutes away (under
      # three hours, a window the model cannot see), which the suite's default
      # no_tool_errors gate would misread as a failure (REFUSALS in the header).
      - id: pressed_for_time
        query: >-
          Submitting in ten minutes, fix the grammar fast: "Our team have spend two
          year building tools for bakery's, and we has learned what owners really needs."
        expect:
          no_tool_errors: false
          max_cost_usd: 1.0
        rubric: |
          1. The reply fixes the grammar.
          2. The reply asks nothing: no question about the deadline or anything else.

  # MILESTONE_83 draft 3 §05: something the owner is waiting on, at a known time, is
  # asked about afterwards (`ask_after`), not raised before a date. The capture span
  # is the outcome under test, as in capture_stated_intention; the second case is THE
  # labelled route-sanity case for the new parameter. Each ends with the owner's own
  # news, which settles the loop as done.
  - id: capture_waited_on
    title: "Something the owner is waiting on is recorded silently, to be asked about afterwards"
    severity: critical
    tags: [open_loops, capture, curiosity]
    cases:
      - id: final_interview
        turns:
          - query: >-
              My final interview with Quarrystone Labs is a week from today. Fingers
              crossed, it's the one I really want.
            expect:
              tools_any: [open_loop_note]
          - query: "Good news already: Quarrystone called this morning and offered me the job!"
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 1.0
        rubric: |
          1. The first reply responds to the interview in a sentence or two and says
             nothing about recording, tracking or remembering it, or about asking about
             it later.
          2. The second reply responds to the offer warmly and specifically.
      # THE labelled route-sanity case: the waited-on moment reaches open_loop_note with
      # ask_after, not matters_by.
      - id: planning_decision_route_sanity
        turns:
          - query: >-
              The Fenmoor planning committee decides on our loft extension in ten days.
              Really hoping it goes through.
            expect:
              tools_any: [open_loop_note]
              tools_none: [schedule_job]
              tool_inputs_match_all: ["ask_after"]
          - query: "It went through! The committee approved the loft extension this morning."
            expect:
              tools_any: [open_loop_update]
        expect:
          max_cost_usd: 1.0
        rubric: |
          1. The first reply responds to the decision in a sentence or two and says
             nothing about recording, tracking or remembering it, or about asking about
             it later.
          2. The second reply responds to the approval warmly and specifically.
