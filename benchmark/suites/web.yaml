suite: web
risk: host_readonly
title: "Web research — search, fetch, and summarize"
description: >
  Exercises the assistant's web-research capability: searching the live web for
  a topic, asking for the latest on something, looking things up, and fetching a
  concrete public URL to summarize it. Gates are deliberately tolerant of the
  model's route — for an open-ended "what's the latest" or "look up" request the
  model may reach for web_search, and for a fetch-this-URL request it should reach
  for web_fetch, but either may chain the other, so tools gates use tools_any and
  reply_matches asserts a topical token rather than pinning an exact tool sequence.
  Network-bound, so budgets and timeouts are set higher than for offline lookups.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok

scenarios:
  - id: search_the_web
    title: "Searches the web for a topic on request"
    severity: normal
    tags: [web, search, core]
    cases:
      - id: mars_rovers
        query: "What are the names of all of NASA's Mars rovers? I want the current list, not a half-remembered one."
        expect:
          # Model may answer from training data (correct) or web_search — both valid.
          # Gate on accuracy: Curiosity + Perseverance must appear.
          reply_matches: "(?i)curiosity|perseverance|rover|mars"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Reports real Mars rover names (Curiosity, Perseverance, etc.) without inventing any."
      - id: nobel_physics
        query: "Who won the most recent Nobel Prize in Physics?"
        expect:
          # The most-recent laureate is knowable from training, so the model may answer
          # correctly WITHOUT searching — don't hard-gate web_search (it would falsely fail a
          # right-from-memory answer, the parametric-shortcut trap). Gate on accuracy, like
          # mars_rovers / tallest_building; latest_ai / latest_spacex cover the genuinely-
          # fresh "must search" cases.
          reply_matches: "(?i)nobel|physics|prize|laureate"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Reports a real Nobel Prize in Physics laureate without inventing one (from search or knowledge)."
      - id: tallest_building
        query: "What's the tallest building in the world right now?"
        expect:
          reply_matches: "(?i)burj khalifa|tallest|building|meter|metre|feet"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Reports the world's tallest building (Burj Khalifa) without inventing one."

  - id: whats_the_latest
    title: "Reports the latest on a current topic"
    severity: normal
    tags: [web, search, news]
    cases:
      - id: latest_ai
        query: "What's the latest on AI model releases this year? Give me a quick rundown."
        expect:
          tools_any: [web_search]
          reply_matches: "(?i)model|release|ai|launch|announce"
          max_cost_usd: 2.0
          max_duration_ms: 150000
        rubric: >
          Searches the web and summarizes recent AI model releases grounded in
          the search results, not from memory alone. The rundown also reads well
          on a chat surface: it leads with the answer rather than with method or
          preamble, its sections are short and self-contained, and it uses no
          markdown tables and no horizontal rules.
      - id: latest_spacex
        query: "What's the latest news on SpaceX launches?"
        expect:
          tools_any: [web_search]
          reply_matches: "(?i)spacex|launch|rocket|starship|falcon"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: >
          Searches the web and reports recent SpaceX launch news from the
          results. The answer also reads well on a chat surface: it leads with
          the answer rather than with method or preamble, its sections are short
          and self-contained, and it uses no markdown tables and no horizontal
          rules.

  - id: fetch_and_summarize
    title: "Fetches a concrete public URL and summarizes it"
    severity: critical
    tags: [web, fetch, core]
    cases:
      - id: fetch_example_com
        query: "Fetch https://example.com and summarize what's on the page for me."
        expect:
          tools_any: [web_fetch]
          reply_matches: "(?i)example|domain|illustrative|documentation"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Fetches example.com and summarizes its actual content (the illustrative example-domain page), without fabricating sections that aren't there."
      - id: fetch_iana_about
        query: "Please grab the page at https://www.iana.org/about and give me a short summary of what IANA does."
        expect:
          tools_any: [web_fetch]
          reply_matches: "(?i)iana|internet|number|assigned|registr|domain"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Fetches the IANA about page and summarizes IANA's role (coordinating internet number/name assignments) from the page content."
      - id: fetch_rfc_editor
        query: "Read https://www.rfc-editor.org/ and tell me in a sentence or two what that site is for."
        expect:
          tools_any: [web_fetch]
          reply_matches: "(?i)rfc|request for comments|document|internet|standard"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: "Fetches the RFC Editor homepage and explains that it publishes/hosts RFC documents, grounded in the fetched content."

  # MILESTONE_31 §9 (evidence-preserving answer contract) and §18 row "Citation
  # eval". The contract is a prompt contract, not a response rewriter, so the
  # only honest place to prove it is a real turn.
  #
  # This scenario is deliberately judge-free: both halves of its contract are
  # hard facts, so both are structural gates. "Source present" is
  # `reply_matches` (a literal URL must appear). "Source faithful" is
  # `reply_urls_in_evidence` — every reply URL checked against the complete
  # tool-evidence URL inventory (grade.evidence_urls, all spans, immune to
  # per-span truncation). Two observed judge failure modes forced this: asked
  # to verify list membership, the judge HEDGES instead of checking (grounded
  # replies floored at 0.18 with the proof in hand), and on identical
  # payloads it flip-flopped 0.18 vs 0.93 between calls. Soft research-prose
  # quality stays judged where it belongs: `whats_the_latest`.
  #
  # These live in the web suite rather than in `places.yaml` because the
  # citation contract is exercised by `web_search`/`web_fetch`, which this suite
  # already drives with the same judge config and network budgets, and because
  # `place_search` needs a Brave key that a stock development daemon does not
  # have — proving the evidence contract must not depend on that credential.
  - id: research_answers_keep_their_sources
    title: "A researched answer keeps the exact URLs its tools returned"
    severity: critical
    tags: [web, search, citations, evidence]
    cases:
      - id: recent_webb_findings
        query: >
          What has the James Webb Space Telescope turned up recently? Give me
          two or three highlights from the past few months.
        expect:
          tools_any: [web_search, web_fetch]
          reply_matches: '(?is)(?=.*(?:webb|jwst))(?=.*https?://)'
          reply_urls_in_evidence: true
          max_cost_usd: 2.0
          max_duration_ms: 150000
      - id: openssl_security_advisories
        query: >
          What are the most recent OpenSSL security advisories? Just the
          headline items and how serious they are.
        expect:
          tools_any: [web_search, web_fetch]
          reply_matches: '(?is)(?=.*(?:openssl|cve|advisor))(?=.*https?://)'
          reply_urls_in_evidence: true
          max_cost_usd: 2.0
          max_duration_ms: 150000
      - id: elixir_release_notes
        query: >
          What changed in the last couple of Elixir releases? A short summary
          and where you read it.
        expect:
          tools_any: [web_search, web_fetch]
          reply_matches: '(?is)(?=.*elixir)(?=.*https?://)'
          reply_urls_in_evidence: true
          max_cost_usd: 2.0
          max_duration_ms: 150000

  # The counterfactual control for the scenario above (§9: "ordinary
  # conversational answers are not forced to append an empty or ceremonial
  # Sources section"). Without it, a model that staples a Sources heading onto
  # everything would score perfectly on citations.
  #
  # `tools_none` is what makes the control mean anything: it establishes that no
  # research happened, so a Sources section could only be ceremony. Both queries
  # are creative asks where the word "sources" cannot plausibly open a line of
  # the answer, which is what `reply_not_matches` keys on.
  - id: no_research_no_ceremonial_sources
    title: "An answer that looked nothing up gets no Sources section"
    severity: normal
    tags: [web, citations, control]
    cases:
      - id: haiku_about_debugging
        query: "Write me a short haiku about debugging code."
        expect:
          tools_none: [web_search, web_fetch, browser]
          reply_not_matches: '(?im)^[\s>#*_-]*sources\b'
          max_cost_usd: 1.0
          max_duration_ms: 90000
        rubric: >
          Writes a haiku about debugging and nothing else. No sources, no
          citations, no references section — there was nothing to cite.
      - id: puppy_name_ideas
        query: "Give me three names for a golden retriever puppy — nothing fancy."
        expect:
          tools_none: [web_search, web_fetch, browser]
          reply_not_matches: '(?im)^[\s>#*_-]*sources\b'
          max_cost_usd: 1.0
          max_duration_ms: 90000
        rubric: >
          Offers three plain puppy names from its own head, with no sources,
          citations, or references section appended.
