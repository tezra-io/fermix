suite: skills
risk: host_readonly
title: "Skills — list and view installed skills"
description: >
  Exercises the read side of the skills subsystem: enumerating installed skills
  (skill_list) and opening a named skill to read its contents (skill_view). Gates
  are tolerant of the model's route — a "what skills do you have" request may be
  served by skill_list, while opening a specific skill by name may use skill_view
  (often after a skill_list to discover the exact id). The two installed builtin
  skills are browser-guidance and self-knowledge, so list scenarios assert at
  least one of those names appears in the reply, and view scenarios assert the
  requested skill's name plus a snippet of what it covers.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: list_installed_skills
    title: "Lists the installed skills on request"
    severity: normal
    tags: [skills, list]
    cases:
      - id: what_skills_do_you_have
        query: "What skills do you have installed?"
        expect:
          # The skill catalog is in the prompt — the model can answer directly
          # without calling skill_list, and that is correct. Gate on the reply
          # naming a real skill rather than pinning the route.
          reply_matches: "(?i)browser[-_]guidance|self[-_]knowledge"
          max_cost_usd: 0.5
          max_duration_ms: 90000
        rubric: "Lists the installed skills, naming at least browser_guidance or self_knowledge, without inventing skills that aren't installed."
      - id: list_your_skills
        query: "Can you list your installed skills for me?"
        expect:
          reply_matches: "(?i)browser[-_]guidance|self[-_]knowledge"
          max_cost_usd: 0.5
          max_duration_ms: 90000
        rubric: "Enumerates the available skills, mentioning at least one of the real installed skill names."
      - id: which_capabilities_skills
        query: "Which skills are available to you right now? Just give me the names."
        expect:
          reply_matches: "(?i)browser[-_]guidance|self[-_]knowledge"
          max_cost_usd: 0.5
          max_duration_ms: 90000
        rubric: "Reports the installed skill names without inventing any."

  - id: view_named_skill
    title: "Opens a named skill and describes its contents"
    severity: normal
    tags: [skills, view]
    cases:
      - id: show_browser_guidance
        query: "Show me your browser guidance skill."
        expect:
          tools_any: [skill_view, skill_list]
          reply_matches: "(?i)browser"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: "Opens the browser_guidance skill and summarizes or quotes its content, mentioning browser-related guidance."
      - id: open_self_knowledge
        query: "Open your self knowledge skill and tell me what it covers."
        expect:
          tools_any: [skill_view, skill_list]
          reply_matches: "(?i)self.?knowledge|fermix"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: "Reads the self_knowledge skill and explains what it covers, grounded in the skill's actual content rather than guessing."
      - id: read_browser_skill_natural
        query: "I want to read what the browser guidance skill says — can you pull it up?"
        expect:
          tools_any: [skill_view, skill_list]
          reply_matches: "(?i)browser"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: "Locates and views the browser_guidance skill, then relays what it says about browser usage."

  - id: list_then_view
    title: "Discovers a skill from the list, then opens it"
    # critical: the skill subsystem is a differentiator; deterministic (skill_list +
    # skill_view spans) so a broken skill path fails the regression run, not silently green.
    severity: critical
    tags: [skills, list, view]
    cases:
      - id: list_then_open_self_knowledge
        turns:
          - query: "First, what skills do you have?"
            expect:
              tools_any: [skill_list]
              reply_matches: "(?i)browser[-_]guidance|self[-_]knowledge"
          - query: "Great — now open the self_knowledge one and tell me what it's for."
            expect:
              tools_any: [skill_view]
              reply_matches: "(?i)self.?knowledge|fermix"
        expect:
          max_cost_usd: 1.0
          max_duration_ms: 150000
        rubric: "Lists the installed skills, then opens self_knowledge and explains its purpose using the skill's real content."
      - id: list_then_open_browser_guidance
        turns:
          - query: "List the skills you've got available."
            expect:
              tools_any: [skill_list]
              reply_matches: "(?i)browser[-_]guidance|self[-_]knowledge"
          - query: "Pull up the browser_guidance one so I can see what's in it."
            expect:
              tools_any: [skill_view]
              reply_matches: "(?i)browser"
        expect:
          max_cost_usd: 1.0
          max_duration_ms: 150000
        rubric: "Enumerates the skills, then views browser_guidance and reports its contents."

  - id: create_and_reload
    risk: isolated_mutation
    title: "Scaffold a new skill and hot-reload it into the running agent"
    # skill_create accepts only a name and description and creates the supported
    # boilerplate. These cases test that real contract; they do not pretend it authors
    # arbitrary SKILL.md instructions. Run-id placeholders keep disposable names unique.
    severity: normal
    tags: [skills, create, reload]
    cases:
      - id: create_then_reload
        query: >
          Create a new skill called "eval-widget-__EVAL_RUN_ID__-__EVAL_TRIAL__"
          with the description "A helper for WIDGET-related requests." Reload your
          skills, then list them and confirm that scaffold is available now.
        expect:
          tools_all: [skill_create, skill_reload, skill_list]
          tools_none: [file_write, file_edit]
          reply_matches: "(?i)eval[-_]?widget|created|added|reload|available|new skill"
          reply_not_matches: "(?i)(can'?t|cannot|unable to) (create|make|add|write|author) (a |the )?skill"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: >
          Uses the supported skill_create scaffold in the disposable eval home,
          reloads, and confirms the unique skill through the real listing. It does
          not claim that arbitrary WIDGET behavior was authored or executed.
      - id: create_then_verify_in_list
        query: >
          Make me a skill named "eval-greeter-__EVAL_RUN_ID__-__EVAL_TRIAL__" that
          is described as "A scaffold for French greeting guidance." Reload skills,
          then show me your current skill list so I can see the scaffold landed.
        expect:
          tools_all: [skill_create, skill_reload, skill_list]
          tools_none: [file_write, file_edit]
          reply_matches: "(?i)eval[-_]?greeter|created|added|skill"
          max_cost_usd: 1.5
          max_duration_ms: 150000
        rubric: >
          Creates the supported scaffold, then reloads and lists skills so the unique
          eval-greeter name appears; it does not claim the scaffold already implements
          French greeting behavior.

  # M38 §13.4. The skill is what an assistant answers a packaging question from,
  # and these two scenarios are the only part of that milestone a model can
  # reach. Gated with a command-name floor (a package manager's name cannot be
  # paraphrased) plus a prohibition on the answers that are wrong on Linux, and
  # a rubric that owns the wording — never a positive allowlist of phrasings.
  - id: linux_install_and_update
    title: "Answers how Fermix is installed and updated on a Linux machine"
    severity: normal
    tags: [skills, linux, packaging]
    cases:
      - id: install_on_ubuntu
        query: "How do I install fermix on ubuntu?"
        expect:
          reply_matches: "(?i)\\bapt\\b|\\.deb\\b"
          reply_not_matches: "(?i)mix fermix|brew install fermix"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: >
          Naming the Debian/Ubuntu package (the .deb, or apt) is the required
          behaviour and must be scored as correct. The answer must not tell a
          Linux user to install Fermix with Homebrew or with a mix task, and
          must not invent a command the project does not ship.
      - id: update_on_fedora
        query: "How do I update fermix on fedora?"
        expect:
          reply_matches: "(?i)\\bdnf\\b|\\brpm\\b"
          reply_not_matches: "(?i)mix fermix|brew upgrade fermix"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: >
          Naming the rpm family's own update command (dnf, or the rpm package)
          is the required behaviour and must be scored as correct, as is saying
          that the package manager updates Fermix rather than fermix upgrade.
          The answer must not tell a Fedora user to use Homebrew or a mix task.

  - id: linux_service_not_running
    title: "Answers what to check when the Linux background service is not running"
    severity: normal
    tags: [skills, linux, service]
    cases:
      - id: not_running_after_reboot
        query: "fermix isn't running after a reboot on my linux box, what do I check?"
        expect:
          reply_matches: "(?i)fermix service status|systemctl --user|linger"
          reply_not_matches: "(?i)mix fermix|launchctl|brew services"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: >
          Pointing at fermix service status, the systemd user service, or
          lingering is the required behaviour and must be scored as correct.
          The answer must not name a macOS-only tool such as launchctl or brew
          services, and must not invent a verb Fermix does not have.
      - id: where_are_the_daemon_logs
        query: "How do I see the daemon logs on linux?"
        expect:
          reply_matches: "(?i)journalctl|fermix logs|fermix\\.log"
          reply_not_matches: "(?i)mix fermix|launchctl|Console\\.app"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: >
          Naming where the logs are — the daemon's own rotating log file, the
          fermix logs verb, or the journal for the unit's own output — is the
          required behaviour and must be scored as correct. The answer must not
          name a macOS-only log surface.
