suite: skills
risk: host_readonly
title: "Skills — list, view, create, and answer from a skill"
description: >
  Exercises the skills subsystem the way a person reaches it: asking what skills
  are installed, asking to see what a named skill says, having a new skill
  scaffolded, and asking a question whose answer lives in a skill. The skill
  catalog (names only) is in the system prompt, so a list question is correctly
  answered without any tool and nothing gates on skill_list; reading a skill's
  CONTENT needs skill_view, and the content floors below are phrases from the
  real SKILL.md files, which the catalog does not carry. The two installed
  builtin skills are browser-guidance and self-knowledge.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: list_installed_skills
    title: "Lists the installed skills on request"
    severity: normal
    tags: [skills, list]
    cases:
      - id: what_skills_do_you_have
        query: "What skills do you have installed?"
        expect:
          # The skill catalog is in the prompt — the model can answer directly
          # without calling skill_list, and that is correct. Gate on the reply
          # naming a real skill rather than pinning the route.
          reply_matches: "(?i)browser[-_]guidance|self[-_]knowledge"
          max_cost_usd: 0.5
          max_duration_ms: 90000
        rubric: "Lists the installed skills, naming at least browser-guidance or self-knowledge, without inventing skills that aren't installed."
      - id: list_your_skills
        query: "Can you list your installed skills for me?"
        expect:
          reply_matches: "(?i)browser[-_]guidance|self[-_]knowledge"
          max_cost_usd: 0.5
          max_duration_ms: 90000
        rubric: "Enumerates the available skills, mentioning at least one of the real installed skill names and no invented ones."

  - id: view_named_skill
    title: "Opens a named skill and describes its contents"
    # critical: reading a skill is the deterministic half of the subsystem (the
    # catalog is prompt-side); the content floors can only be met by a turn that
    # opened the file, so a broken skill_view path fails the run.
    severity: critical
    tags: [skills, view]
    cases:
      # SANITY CASE — the one route pin in this suite; content is only
      # reachable through skill_view, and the floor is a term from the file
      # (snapshot/refs/webmcp/fill_form), not the word "browser" from the ask.
      - id: show_browser_guidance
        query: "Show me your browser guidance skill."
        expect:
          tools_any: [skill_view]
          reply_matches: "(?i)snapshot|\\brefs?\\b|webmcp|fill_form"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: "Opens the browser-guidance skill and summarizes or quotes its actual content (tool routing between web_search/web_fetch/browser, the snapshot-then-act loop), not a generic description of browsing."
      - id: open_self_knowledge
        query: "Open your self knowledge skill and tell me what it covers."
        expect:
          reply_matches: "(?is)(?=.*(provider|channel|install))(?=.*(memory|sandbox|jobs?\\b|plugin|skill_view|reference))"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: "Reads the self-knowledge skill and explains what it covers — the runtime shape, providers, channels, install types, built-ins, skills, plugins and the reference files it points to — grounded in the skill's actual content rather than guessing."

  - id: create_and_reload
    risk: isolated_mutation
    title: "Scaffold a new skill and have it show up in the live list"
    # skill_create accepts only a name and description and creates the supported
    # boilerplate. These cases test that real contract; they do not pretend it
    # authors arbitrary SKILL.md instructions. Run-id placeholders keep
    # disposable names unique, and the second turn is the outcome: the new name
    # is in the list the agent reports, however it refreshed it (reload is the
    # model's call, not the prompt's). file_write/file_edit/shell are banned so
    # a hand-written skill directory cannot stand in for the supported path.
    severity: normal
    tags: [skills, create, reload]
    cases:
      - id: create_then_reload
        turns:
          - query: >
              Make me a new skill called "eval-widget-__EVAL_RUN_ID__-__EVAL_TRIAL__"
              described as "A helper for WIDGET-related requests."
            expect:
              tools_any: [skill_create]
              tools_none: [file_write, file_edit, shell]
              reply_not_matches: "(?i)(can'?t|cannot|unable to) (create|make|add|write|author) (a |the )?skill"
          - query: "Is it showing up in your skill list now?"
            expect:
              tools_none: [file_write, file_edit, shell]
              reply_matches: "(?i)eval-widget-__EVAL_RUN_ID__-__EVAL_TRIAL__"
              reply_not_matches: "(?i)\\b(not|isn'?t|is not) (showing|listed|there|available|in the list)\\b"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 200000
        rubric: >
          Uses the supported skill_create scaffold in the disposable eval home,
          and on the follow-up confirms the unique skill name from the real
          listing (reloading first if that is what it takes). It does not claim
          that arbitrary WIDGET behavior was authored or executed.
      - id: create_then_verify_in_list
        turns:
          - query: >
              Set up a skill named "eval-greeter-__EVAL_RUN_ID__-__EVAL_TRIAL__"
              with the description "A scaffold for French greeting guidance."
            expect:
              tools_any: [skill_create]
              tools_none: [file_write, file_edit, shell]
              reply_not_matches: "(?i)(can'?t|cannot|unable to) (create|make|add|write|author) (a |the )?skill"
          - query: "Show me your current skill list so I can see it landed."
            expect:
              tools_none: [file_write, file_edit, shell]
              reply_matches: "(?i)eval-greeter-__EVAL_RUN_ID__-__EVAL_TRIAL__"
              reply_not_matches: "(?i)\\b(not|isn'?t|is not) (showing|listed|there|available|in the list)\\b"
        expect:
          max_cost_usd: 1.5
          max_duration_ms: 200000
        rubric: >
          Creates the supported scaffold, then shows a skill list in which the
          unique eval-greeter name appears; it does not claim the scaffold
          already implements French greeting behavior.

  # M38 §13.4. Gated with a command-name floor (a command cannot be paraphrased)
  # plus a prohibition on the answers that are wrong on Linux, and a rubric that
  # owns the wording — never a positive allowlist of phrasings. Install and
  # update questions live in linux_packages.yaml, which gates them on the
  # installer's address; the apt/dnf vocabulary cases that used to sit here
  # contradicted it (a packaged install does not update through dnf).
  - id: linux_service_not_running
    title: "Answers what to check when the Linux background service is not running"
    severity: normal
    tags: [skills, linux, service]
    cases:
      - id: not_running_after_reboot
        query: "fermix isn't running after a reboot on my linux box, what do I check?"
        expect:
          reply_matches: "(?i)fermix service status|systemctl --user|linger"
          reply_not_matches: "(?i)mix fermix|launchctl|brew services"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: >
          Pointing at fermix service status, the systemd user service, or
          lingering is the required behaviour and must be scored as correct.
          The answer must not name a macOS-only tool such as launchctl or brew
          services, and must not invent a verb Fermix does not have.
      - id: where_are_the_daemon_logs
        query: "How do I see the daemon logs on linux?"
        expect:
          reply_matches: "(?i)journalctl|fermix logs|fermix\\.log"
          reply_not_matches: "(?i)mix fermix|launchctl|Console\\.app"
          max_cost_usd: 0.6
          max_duration_ms: 120000
        rubric: >
          Naming where the logs are — the daemon's own rotating log file, the
          fermix logs verb, or the journal for the unit's own output — is the
          required behaviour and must be scored as correct. The answer must not
          name a macOS-only log surface.
