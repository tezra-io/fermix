# Moving Fermix to an always-on machine (M75 stage 1), graded through the real
# agent path.
#
# WHAT ROTS HERE. How a home moves to another host, and what the old machine
# does afterwards, is written in the `self-knowledge` skill's `home` reference:
# a stopped home is exported into one archive under a passphrase and imported
# into an empty directory on the new host, the old home is marked moved so it
# never starts as the primary again, and the old Mac may run on in the device
# role for its desktop app. General knowledge says "copy the folder over". ExUnit
# proves the sentences are in the file; this suite proves an owner who asks in
# their own words gets them.
#
# WHY BEHAVIORAL. There is no end state to check: the answer is advice.
#
# GATES. One labelled sanity case pins that the answer comes from the skill
# (`skill_view`); every other gate is a floor any correct answer meets (one of
# the two ways a home moves, Always On or the archive by hand; the primary the
# device-role Mac points at; WhatsApp, which the owner named, in the answer
# about what stops). The rubric owns the wording. The one `reply_not_matches`
# is the verbs Fermix removed (`fermix home move`, `--retire`, `fermix home
# enroll-code`), which no correct answer names in either polarity; the wrong
# move (copying the home folder by hand) is something a correct answer may
# well warn against, and a pattern cannot tell the two polarities apart, so
# the rubric holds it.
#
# NO NEW CONSENT GATE. Nothing here is gated on a human decision, so
# `bin/seed_capability_home.py` needs no pre-grant (these are `host_readonly`,
# and no case runs a command).
suite: home_move
risk: host_readonly
title: "Moving Fermix to a VM — the export, the import, and the device role"
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: move_to_an_always_on_host
    title: "Moving the home to a VM, and what the old Mac does afterwards"
    severity: normal
    risk: host_readonly
    tags: [home, always-on, self-knowledge]
    cases:
      # SANITY CASE — the one route assertion in this suite. The move's verbs and
      # their order are not general knowledge; they are in the skill's `home`
      # reference, so this case pins that the model opened it. A rented VM is
      # a server of the owner's own, so Always On's own-server path is a
      # correct answer as much as the archive by hand, and neither is
      # penalized.
      - id: move_to_vm_sanity
        query: >
          I've rented a small Linux VM so Fermix can keep running when my Mac
          is asleep. How do I move my Fermix over to it without losing my
          memory and settings, and what will I have to redo on the VM?
        expect:
          tools_any: [skill_view]
          reply_matches: '(?is)\balways[\s-]on\b|\benroll|\bexport\b.*\bimport\b|\bimport\b.*\bexport\b'
          reply_not_matches: '(?i)\bfermix\s+home\s+move\b|--retire\b|\benroll-code\b'
          max_tool_calls: 8
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Gives a way that moves the whole home, memory and settings
             included, either one being correct: Always On onto a server of
             the owner's own (Use my own Linux server, or `fermix always-on
             own-server`: an enrollment code, the installer run on the VM that
             asks for it, then Move now with a recovery passphrase), or the
             archive by hand (`fermix home export` with Fermix stopped on the
             Mac, under a passphrase the owner keeps, then `fermix home import`
             into an empty directory on the VM).
          2. Says the Mac no longer runs as the primary once the home moved:
             after Always On's move it stays a desktop of the VM, and by hand
             its home is marked moved (`--mark-moved` on the export, or
             `fermix home mark-moved`).
          3. Names at least two things that do not travel and are redone on the
             VM: secrets kept in the operating system's keyring, browser
             sign-ins (browser profiles stay with the Mac), coding-agent
             consent, settings that point at paths outside the old home, or
             plugins built for macOS.
          4. Does not present copying or syncing the Fermix home folder by hand
             as the way to move it.
      - id: device_role_after_the_move
        query: >
          Once Fermix lives on my VM, what does my Mac's Fermix do? Someone
          mentioned a "device role" for the old machine. What is that, and does
          the Mac still answer my messages?
        expect:
          reply_matches: '(?i)\bprimary\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Explains the device role as the Mac's engine setting after the
             move (`role = "device"` under `[fermix_core.engine]` in its
             config), which keeps an engine on the Mac for the desktop app
             there.
          2. Says a device-role engine does not answer messages: it refuses
             every turn and points at the primary (the VM), starts no chat
             channels and no schedulers, and makes no provider calls or
             sign-ins.
          3. Says the VM is now the primary, the one copy that runs the agent
             and writes long-term memory, and that a home marked moved can no
             longer start as the primary.
      # The move's review (M75): what stops on a server with no inbound
      # address, what Fermix does for the plugins by itself, and the approval
      # a move withdraws, as the skill's `home` reference says them.
      - id: what_stops_after_an_always_on_move
        query: >
          I'm about to move Fermix from my Mac to my own server with Always On.
          I use WhatsApp and Slack with it, a few plugins, and I let Codex work
          as a coding agent. What will stop working or need redoing once it
          runs on the server?
        expect:
          reply_matches: '(?i)\bwhatsapp\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says WhatsApp stops after the move until the owner runs the
             Tailscale Funnel command Always On shows for the server and
             points Meta at the address it prints.
          2. Says Slack keeps working on the server only over Socket Mode:
             set up the other way (events sent to an address) it stops unless
             it is switched to Socket Mode first.
          3. Says the server installs the plugins again by itself right after
             the move, and that only plugins with no build for the server stop
             (the move's review names them).
          4. Says coding agents such as Codex ask for the owner's approval
             again on the server.
          5. Does not tell the owner to install every plugin again by hand.

  # How an Always On server keeps itself current, from the skill's `home`
  # reference: Fermix's package comes from release files, so general knowledge
  # ("apt upgrade", or `fermix upgrade`) is wrong there. The floor is how soon
  # the server follows its computers (minutes), or the reboot the owner asked
  # about; the rubric owns the rest.
  - id: always_on_server_keeps_itself_current
    title: "An Always On server updates Fermix and Debian by itself"
    severity: normal
    risk: host_readonly
    tags: [home, always-on, updates, self-knowledge]
    cases:
      - id: new_fermix_release_on_the_server
        query: >
          Fermix runs on my Always On server now and I never log in to it.
          When a new Fermix release comes out, does the server pick it up on
          its own, or do I have to update it by hand?
        expect:
          reply_matches: '(?i)\bminutes?\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says the server updates Fermix by itself, within a few minutes (it
             checks every five), by running Fermix's installer again.
          2. Says the server takes a new release only once the computers linked
             to it run it (the oldest release among them), not when the release
             first comes out, and never runs ahead of the Mac.
          3. Does not tell the owner to log in and run `apt upgrade` or
             `fermix upgrade` on the server as the way to keep it current.
      - id: security_patches_and_reboots_on_the_server
        query: >
          Who installs the Debian security patches on my Always On server, and
          does it ever reboot itself? I don't want to babysit it.
        expect:
          reply_matches: '(?i)reboot'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says Debian's security updates install themselves every day
             (unattended-upgrades), with no one logging in.
          2. Says the server reboots by itself when an installed update asks
             for it, during Fermix's nightly update at 04:00 UTC.
          3. Does not tell the owner to log in to install security updates or
             to reboot the server by hand.

  # Always On runs on a Linux server the owner sets up; Fermix creates,
  # powers, replaces and deletes none. What rots is the self-knowledge `home`
  # and `move_back` references: the code and the command for the owner's
  # server, the move back, Restore here and what it asks of the owner, and
  # changing servers by moving back first. General knowledge says "Fermix can
  # rent the VPS for you" or "copy the folder over", and an older reference
  # said Fermix made and deleted the server itself. Each floor is
  # phrasing-free (the answer names the server, or the backup the owner
  # asked about); the rubric owns the facts.
  - id: always_on_on_an_owners_server
    title: "Always On on the owner's own Linux server: setting up, moving back, restoring"
    severity: normal
    risk: host_readonly
    tags: [home, always-on, self-knowledge]
    cases:
      - id: own_server_for_always_on
        query: >
          I'd like Fermix to keep running when my Mac is closed. I already
          rent a small Debian server. How do I get my Fermix onto it, and
          could Fermix just order a server from a cloud company for me
          instead?
        # Until the release gate (Home.AlwaysOnRelease) is deleted, this case also accepts "Always On is not in this release of Fermix yet"; narrow it back then.
        expect:
          reply_matches: '(?i)\bserver\b|\breleas(?:e|ed|es)\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says Always On moves Fermix to a Linux server of the owner's
             own: Use my own Linux server in Always On (the Fermix app's
             Always On pane, the setup page's Always On tab, or
             `fermix always-on` in a terminal) gives a one-time enrollment
             code and a command to run on the server, which asks for the
             code without showing it; or says Always On is not in this
             release of Fermix yet (a release build has none). Either is
             correct while release builds have no Always On.
          2. Where it describes the setup, says the owner then reviews the
             move and starts it with Move now and a recovery passphrase, and
             the home (memory, settings, secrets) moves with it.
          3. Says Fermix does not order or create a server with a cloud
             company: the owner sets the server up themselves (Debian 12,
             Debian 13 or Ubuntu 24.04), or says Always On is not in this
             release of Fermix yet.
          4. Does not tell the owner to give Fermix a cloud provider's API
             token, or to copy the Fermix home folder onto the server by
             hand.
      - id: deleting_the_server_the_home_moved_to
        query: >
          My Fermix runs on my own server now, but it costs more than I
          thought and I want to cancel it with the hosting company. Can I just
          delete the server? What happens to my Fermix?
        expect:
          reply_matches: '(?i)\bserver\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says to move Fermix back to the Mac first (Always On's way back,
             with the recovery passphrase) and to turn off or delete the
             server only afterwards, since the server holds the home now;
             Fermix itself deletes no server.
          2. Says that a server deleted first leaves only the Mac's copy of
             its backups: Always On can restore Fermix on the Mac from that
             copy once the owner confirms the server is deleted or stopped,
             and what changed since that backup is lost.
          3. Does not claim deleting the server moves Fermix back to the Mac
             by itself.
      # Always On's move back (design §10): an owner back at their desk wants
      # Fermix on the Mac again and to stop paying for the server. What rots
      # is the self-knowledge `home` reference's *Moving back*; general
      # knowledge (and the old docs) says there is no way back. The floor is
      # phrasing-free; the one not-matches is that old claim, which no
      # correct answer makes in either polarity; the rubric owns the facts
      # and never asks for the action's label word for word.
      - id: moving_back_to_the_mac
        query: >
          A month ago I moved my Fermix to my own Linux server. I'm back at my
          desk for good now. Can I bring Fermix back onto my Mac and stop
          paying for that server? What would I get back, and what happens to
          the server?
        expect:
          reply_matches: '(?i)\bserver\b'
          reply_not_matches: '(?i)\bno\s+way\s+back\s+(?:(?:to|onto)\s+(?:your|the|this)\s+(?:mac|computer)|in\s+this\s+version)\b|\bcan(?:no|''|’)t\s+(?:be\s+)?(?:moved|brought|move|bring)\s+(?:it\s+|fermix\s+)?back\b|\b(?:moving|move)\s+back\s+is\s+not\s+possible\b|\bnot\s+possible\s+to\s+(?:move|bring)\s+(?:it\s+|fermix\s+)?back\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says Fermix can come back to the Mac: Always On offers a way
             back (in the Fermix app's Always On pane, the setup page's
             Always On tab, or `fermix always-on` in a terminal) that moves
             the home from the server back onto this Mac, its memory,
             settings, secrets and chats with it.
          2. Says it asks for the recovery passphrase to start the move
             back.
          3. Says the server is the owner's to turn off or delete after the
             move back, once the Mac runs Fermix again, not as part of the
             move or before it; Fermix deletes no server.
          4. Says what comes back on the Mac, at least one of: iMessage,
             voice calls or meetings running there again as before the
             move; the Mac's own files and keychain kept; the phones
             following.
          5. Does not say the server should be deleted first, does not send
             the owner to export and import the home by hand, and does not
             say Fermix cannot be moved back.
      - id: what_the_always_on_pane_says
        query: >
          The Always On pane on my Mac says "Fermix cannot reach your server.
          Your messages wait until it is back.", and yesterday my phone told
          me my last backup is 8 days old. What can I do about the server from
          the pane, and why would my backup be old?
        expect:
          reply_matches: '(?i)\bbackup'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says the pane says so once the server gave no answer for 10
             minutes while the Mac was awake, that the server is the owner's
             own to check with whoever hosts it (is it on, is it online), and
             that Fermix reconnects by itself and the waiting messages
             arrive once it answers.
          2. Says the pane can restore Fermix on the Mac from the Mac's copy
             of the server's backups, but only once the owner deleted or
             stopped the server, since two copies would answer the same
             channels, and that what changed since that backup is lost.
          3. Says the server keeps copies of its backups on the Mac while the
             Mac is online (and in an S3 bucket when one is set), so a server
             the Mac cannot reach, or a Mac that was asleep or away, leaves
             the last backup old, that Back up now takes one once the server
             answers, and that the phones are told once when the newest
             backup is a week old.
          4. Does not say Fermix can turn the server on or restart it
             itself.
      - id: swapping_for_a_bigger_server
        query: >
          My Fermix has been living on my own Linux server for a month, and I
          want to switch to a bigger one. How do I swap it without losing my
          chats and settings, and what do I do with the old server?
        expect:
          reply_matches: '(?i)\bserver\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says to move Fermix back to the Mac first (Always On's way back,
             with the recovery passphrase), then set up the new server from
             Always On as the first time (its enrollment code and the command
             to run there) and move to it, the home (memory, settings,
             secrets) moving each time. Restoring the newest snapshot onto
             the new server (the installer's restore mode, then `fermix home
             import`) once the old one is stopped is also correct.
          2. Says the old server is the owner's to turn off or delete once
             the home is off it; Fermix deletes no server.
          3. Does not tell the owner to delete the old server while the home
             still lives on it, or to copy the Fermix home folder over by
             hand.
      # M99 §10.1: after a move a reminder set to ring on "this computer"
      # comes due on the server, which has no notification centre, and the
      # server asks the owner's computers that are awake to show it. What
      # rots is the self-knowledge `events_reminders` reference's *This
      # computer*; general knowledge says a notification needs the app's own
      # engine on the Mac. The floor names the Mac, which every answer does;
      # the rubric owns the facts. No route assertion: whether the model
      # opens the skill is its own call.
      - id: mac_reminders_after_moving_to_a_server
        query: >
          I moved my Fermix to my own Linux server with Always On last week.
          Before that I had a few reminders set to pop up on my Mac, like the
          one before my three o'clock call on Thursdays. Will those still
          show up on my Mac now, or did that stop when Fermix left it?
        expect:
          reply_matches: '(?i)\bmac\b'
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says the reminders still ring on the Mac: when one comes due the
             server, which shows no notification itself, asks the owner's
             computers that are awake to show it, and the Mac shows it as a
             notification from the Fermix app there, as before, its Snooze 10
             minutes included.
          2. Says it needs the Mac awake, with its Fermix linked to the
             server and its switch "Fermix on your server may use this
             computer" on, and the notification permission granted; one due
             while the Mac is asleep or offline is tried again while the
             reminder is still valid, so it rings if the Mac is back in time.
          3. Does not say the reminder shows on the server, that the
             reminders stopped or must be set again, that they must move to a
             chat channel, or that a separate notifications switch must be
             turned on.

  # Always On setup §8.2: an install with no Fermix app sets Always On up
  # with `fermix always-on` in a terminal, or on the setup page's Always On
  # tab. What rots is the `self-knowledge` skill's CLI bullet and the `home`
  # reference; older docs and general knowledge put Always On in the Mac app
  # alone. The floor is either way in, by name; the not-matches gate catches
  # an answer that sends the owner to install the app first, and its
  # lookbehinds spare one that says the app is not needed. The rubric owns
  # the rest. Tagged `host-safe-core`, so it runs on every `make regression`:
  # a question and an answer, read-only on the host, with no consent gate for
  # an eval home to pre-grant. The suite's other scenarios stay out of it.
  # Until the release gate (Home.AlwaysOnRelease) is deleted, both cases also accept "Always On is not in this release of Fermix yet"; narrow them back then.
  - id: always_on_without_the_app
    title: "Setting up Always On on an install with no Fermix app"
    severity: normal
    risk: host_readonly
    tags: [home, always-on, cli, self-knowledge, host-readonly, host-safe-core]
    cases:
      - id: homebrew_owner_keeps_fermix_running
        query: >
          I installed Fermix with Homebrew and I don't use the Fermix Mac app.
          How do I keep Fermix running when my MacBook is closed?
        expect:
          reply_matches: "(?i)(fermix\\s+always-on|setup\\s+page|\\breleas(?:e|ed|es)\\b)"
          reply_not_matches: "(?i)(?<!n't need to )(?<!not need to )(?<!no need to )(?<!n't have to )(?<!rather than )(?<!without )\\b(?:install|download)\\s+(?:the\\s+)?(?:fermix\\s+)?(?:mac(?:os)?\\s+)?app\\b"
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says Always On keeps Fermix running with the Mac closed by moving
             it to a Linux server of the owner's own; or says
             Always On is not in this release of Fermix yet (a release build,
             as Homebrew installs, has none). Either is correct while release
             builds have no Always On.
          2. Where it describes the setup, says it is set up without the
             Fermix app: with `fermix always-on` in a terminal, which walks
             through each step, or on the setup page's Always On tab.
          3. Does not say the Fermix Mac app must be installed to set up
             Always On.
      - id: linux_package_owner_sets_up_always_on
        query: >
          My Fermix runs from the Linux package on my desktop, with no app on
          top of it. I'd like it to stay up while this machine is switched
          off. How do I set that up?
        expect:
          reply_matches: "(?i)(fermix\\s+always-on|setup\\s+page|\\breleas(?:e|ed|es)\\b)"
          reply_not_matches: "(?i)(?<!n't need to )(?<!not need to )(?<!no need to )(?<!n't have to )(?<!rather than )(?<!without )\\b(?:install|download)\\s+(?:the\\s+)?(?:fermix\\s+)?(?:mac(?:os)?\\s+|linux\\s+)?app\\b"
          max_cost_usd: 1.2
          max_duration_ms: 160000
        rubric: |
          1. Says Always On moves Fermix to a Linux server of the owner's
             own, so it keeps running while this machine is off; or says Always On is not
             in this release of Fermix yet (a release build, as the Linux
             package installs, has none). Either is correct while release
             builds have no Always On.
          2. Where it describes the setup, says it is set up from this install
             with no app: with `fermix always-on` in a terminal, or on the
             setup page's Always On tab.
          3. Does not say a Fermix app must be installed to set up Always On.
