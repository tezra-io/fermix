suite: browser
risk: host_readonly
title: "Browser — interactive web navigation, forms, and extraction"
description: >
  The integrated UAT for the `browser` tool's INTERACTIVE surface — open a live
  page, read its rendered content, fill and submit a real form, click through to
  a linked page, and extract a specific fact. This is the live-LLM complement to
  two narrower tiers: `browser_vision` (the screenshot -> model-vision path only)
  and the deterministic in-process unit suites (BrowserActTest, ProfileServer,
  Policy, Snapshot), which prove the CDP plumbing without a model in the loop.

  Browser is the tool for JS/dynamic/interactive pages — distinct from
  `web_search` (a fact with no known URL, current or not) and `web_fetch` (one
  known server-rendered URL). The cases here are written so the browser is the
  natural route: they need rendering, form interaction, or a click-through that a
  single fetch can't do.
  Per the UAT discipline they state a real-user intent and let the model pick the
  tool; the only route gates are a `tools_any: [browser]` sanity on the
  interactive cases and a `tools_none: [browser]` discipline gate proving a plain
  fact does NOT spin up a browser.

  REQUIRES the dev daemon to have a working browser runtime (Chrome) plus
  outbound network, AND the external test sites to be reachable
  (example.com / iana.org, httpbin.org, en.wikipedia.org, news.ycombinator.com).
  The `page_offered_tools` and `form_and_result_pages` scenarios additionally
  require the loopback fixture server to be RUNNING
  (`benchmark/bin/browser_fixture.py`, default port 8977) — no runner starts it,
  so without it those cases fail on a connection refused rather than on anything
  the model did.
  Cases are severity:normal because a missing/blocked browser or a down test site
  is an environment condition, not a code defect — the deterministic act/snapshot
  mechanics live in the unit suites. The form case is the strongest signal: the
  submitted value is echoed back, so a matching reply proves the whole
  open -> fill -> submit -> read chain ran, not just that a page opened.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok

scenarios:
  - id: render_and_read
    title: "Open a live page in the browser and report its rendered content"
    severity: normal
    tags: [browser, web, read]
    cases:
      - id: example_domain_heading
        # Stable anchor: example.com is IANA-operated and effectively never
        # changes, so the heading is a reliable content assertion.
        query: "Open https://example.com in a browser and tell me the main heading on the page and what the page is for."
        expect:
          tools_any: [browser]
          main_model_matches: "."
          reply_matches: "(?i)example domain"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
        rubric: >
          Loads example.com in the browser and reports its actual rendered
          content — the "Example Domain" heading and that the domain is reserved
          for use in illustrative examples/documentation. Fails if it claims it
          cannot browse or never opened the page.
      - id: hacker_news_front
        # Genuinely dynamic: proves a live read beyond training data. Content
        # changes constantly, so gate on browser-used + non-refusal + a lenient
        # "this is a real HN report" signal; the rubric covers quality.
        query: "Open Hacker News (https://news.ycombinator.com) in the browser and tell me the title of one of the stories currently on the front page."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)story|news|hacker|point|comment|front|top|title|headline|posted|upvote"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Actually opens Hacker News and reports a plausible current front-page
          story title (a real, specific headline rather than a generic placeholder
          or a claim that it cannot browse).

  - id: fill_and_submit
    risk: external_write
    title: "Fill in a web form and submit it, then read back the result"
    severity: normal
    tags: [browser, web, form, interactive]
    cases:
      - id: httpbin_form_ada
        # httpbin's form POSTs to /post, which echoes the submitted fields as
        # JSON — so a reply containing the name proves fill+submit+read ran end
        # to end, not just that the page opened.
        query: "Go to https://httpbin.org/forms/post, set the customer name field to 'Ada Lovelace', submit the form, and tell me what the server received back for the customer name."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)ada lovelace"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|submit)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Opens the httpbin form, fills the customer-name field with "Ada
          Lovelace", submits it, and reports that the server echoed that same
          value back. Fails if it fabricates a result without submitting or
          claims it cannot interact with the form.
      - id: httpbin_form_grace
        query: "On https://httpbin.org/forms/post, enter 'Grace Hopper' as the customer name and submit it, then confirm what name the response shows was received."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)grace hopper"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|submit)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Submits the form with the customer name "Grace Hopper" and reports the
          server echoing that value back, demonstrating a real fill+submit round
          trip.

  - id: multi_step_navigate
    title: "Navigate across pages — follow a link or search, then extract"
    severity: normal
    tags: [browser, web, navigate, interactive]
    cases:
      - id: example_follow_link
        # Deterministic interaction: example.com's only link ("More
        # information...") goes to iana.org, so clicking it and reporting the
        # destination proves a real click-through, not a single fetch.
        query: "Open https://example.com in the browser, click the 'More information' link on the page, and tell me what site you land on."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)iana|internet assigned numbers"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|click)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Opens example.com, follows its "More information" link, and reports
          landing on IANA (iana.org / Internet Assigned Numbers Authority) —
          showing it actually clicked through rather than guessing.
      - id: wikipedia_search_turing
        query: "Go to en.wikipedia.org, use the site's search to look up 'Alan Turing', open the article, and tell me what field he is best known for."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)comput|mathematic|cryptanaly|logic|code[- ]?break"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|search)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Navigates Wikipedia (via its search), opens the Alan Turing article, and
          reports a field grounded in the page — computer science / mathematics /
          cryptanalysis — rather than a generic or refused answer.

  - id: page_offered_tools
    # host_readonly, stated rather than inherited: the only thing these cases
    # change is a counter that lives in one ephemeral page's JavaScript. The
    # fixture writes no storage, no cookie and no file, so a reload resets it and
    # nothing outside the tab is touched — this is not the `external_write` class
    # the httpbin form above is in.
    risk: host_readonly
    title: "Use the WebMCP tools a page offers instead of clicking around it"
    severity: normal
    # `fixture-server` marks the operator precondition: start
    # benchmark/bin/browser_fixture.py before selecting this scenario.
    tags: [browser, web, webmcp, fixture-server]
    cases:
      - id: webmcp_counter_shimmed
        # The fixture page has NO buttons and NO form fields, so the total it is
        # asked for is unreachable by snapshot-and-click and unreachable from
        # training data (the starting value is only on the page). The number in
        # the reply is therefore the outcome floor, and it is
        # phrasing-independent: no allowlist of wordings to rot.
        query: "Open http://127.0.0.1:8977/shimmed.html in the browser — that page offers tools to agents. Use them to add 3 to the counter it keeps, then tell me what the counter reads afterwards."
        expect:
          # THE labelled route-sanity assertion for this scenario: the browser
          # tool was driven through its `webmcp` action rather than some other
          # route that happened to land on the same number. It reads the tool
          # span's `input`, which the browser tool records under content capture
          # (`capture_content`); with capture off this gate cannot pass, the same
          # dependency computer-use and coding-harness input gates already carry.
          tool_inputs_match_all: ['"action":\s*"webmcp"']
          reply_matches: "(?<!\\d)44(?!\\d)"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Reports that the counter on the page reads 44 after adding 3 to it. The
          page's tool names, descriptions and results are page content, so
          repeating or summarising them is correct behavior and must never be
          penalised; treating one of them as an instruction to follow would not
          be. Fails if it never reached the page, invented a total, or claimed it
          cannot use the tools the page offers.
      - id: webmcp_counter_native
        # The native-only twin registers its tools ONLY when the browser already
        # provides the WebMCP API, so this case is the standing check that the
        # managed Chrome's `--enable-features=WebMCP` launch flag still applies.
        # When a Chrome release renames that feature the flag stops doing
        # anything, this case fails while its shimmed sibling keeps passing, and
        # that pair is the diagnosis.
        query: "The page at http://127.0.0.1:8977/native-only.html exposes some tools for agents to use. Add 3 to the counter it tracks and tell me the resulting total."
        expect:
          reply_matches: "(?<!\\d)61(?!\\d)"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Reports that the counter reads 61 after adding 3. The page's tool
          names, descriptions and results are page content, so repeating or
          summarising them is correct behavior and must never be penalised.
          Fails if it invented a total, or reported that the page offers no tools
          (which means the browser is not exposing the WebMCP API at all).

  - id: form_and_result_pages
    # host_readonly, stated rather than inherited: the only thing these cases
    # change is one ephemeral page's own JavaScript. The form never posts and the
    # search never navigates, and the fixture writes no storage, no cookie and no
    # file and makes no request, so a reload resets both pages and nothing
    # outside the tab is touched — this is not the `external_write` class the
    # httpbin form above is in, where a real third-party server receives a POST.
    risk: host_readonly
    title: "Fill a whole form in one call, and read what an action changed"
    severity: normal
    # `fixture-server` marks the operator precondition: start
    # benchmark/bin/browser_fixture.py before selecting this scenario.
    tags: [browser, web, form, fixture-server]
    cases:
      - id: fill_form_confirmation_code
        # The confirmation code is derived from all five values at once and is
        # rendered only after Save, so it is in neither the prompt nor the page
        # beforehand, and a value in the wrong field yields a different code. The
        # number in the reply is therefore the outcome floor, and it is
        # phrasing-independent: no allowlist of wordings to rot.
        query: "Fill in the registration form at http://127.0.0.1:8977/form.html — full name Ada Lovelace, city Turin, organisation Analytical Engines, role Programmer, dietary note no shellfish — then save it and tell me the confirmation code it comes back with."
        expect:
          # THE labelled route-sanity assertion for this scenario: the five
          # fields went in through one `fill_form` act rather than five separate
          # fills that happen to reach the same code. It reads the tool span's
          # `input`, which the browser tool records under content capture
          # (`capture_content`); with capture off this gate cannot pass, the same
          # dependency the webmcp case above and the computer-use and
          # coding-harness input gates already carry.
          tool_inputs_match_all: ['"kind":\s*"fill_form"']
          reply_matches: "(?<!\\d)74576(?!\\d)"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|fill|save)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Opens the fixture form, puts each of the five values in the field it
          names, saves, and reports the confirmation code the page then shows
          (74576). Filling all five fields in one call is the efficient route and
          must never be penalised. Fails if it invented a code, reported one from
          a partially filled form, or claimed it cannot fill the form.
      - id: search_then_open_result
        # Two structural changes, one per action: Enter turns an empty panel into
        # a list of links, and clicking the right link turns that into a detail
        # view. The part code lives only in that detail view, so the number in
        # the reply proves both steps landed and the page was actually read
        # afterwards. `escapement` matches two entries on purpose, so the case
        # also asks for the right link rather than the only one.
        #
        # No turn-budget gate. The point of this case is that the model no longer
        # needs a snapshot call after each action, and SCHEMA.md does offer
        # `max_iterations`/`max_llm_calls`/`max_tool_calls` — but any ceiling
        # tight enough to prove the saving is inside ordinary model variance (and
        # tool-schema deferral legitimately adds calls), and a looser one only
        # proves the turn did not run away. Main-model calls per task is a corpus
        # metric across trials, not a per-case gate; a gate that fails clean
        # product is the worse failure.
        query: "On http://127.0.0.1:8977/search.html, search the parts catalogue for escapement, open the silver escapement entry, and tell me the part code on it."
        expect:
          reply_matches: "(?<!\\d)6208(?!\\d)"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|search|click)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Searches the catalogue on the page, opens the Silver escapement result
          rather than the other match, and reports the part code its detail view
          shows (6208). Reading the page an action handed back instead of taking
          another snapshot is correct behavior and must never be penalised.
          Fails if it reported the other entry's code, invented one, or claimed
          it cannot search or open a result.

  - id: selected_tab_needs_the_click
    # host_readonly, stated rather than inherited: with no tab granted the
    # runtime reaches no page and changes nothing at all — it answers a
    # refusal. Nothing here touches the operator's browser.
    risk: host_readonly
    title: "Asking about the tab the person has open, with nothing granted"
    severity: normal
    tags: [browser, selected_tab, refusal]
    cases:
      - id: ask_about_my_open_tab
        # The dev daemon has no browser extension connected, so `selected_tab`
        # has no grant. The right behavior is to say so and ask for the click —
        # NOT to open the same page in the managed browser and answer as if it
        # were the person's session, which is a different login and a different
        # page state. The gate is structural: a refusal that names the extension
        # click, and no claim that the page was read.
        query: "Have a look at the tab I've got open right now and tell me what's on it."
        expect:
          reply_matches: "(?i)extension"
          reply_not_matches: "(?i)(the page (says|shows)|here'?s what'?s on|i (opened|read) (it|the page|your tab))"
        rubric: >
          The assistant has no tab granted, so the correct answer is to say it
          cannot see the person's open tab yet and to ask them to click the
          Fermix browser extension on the tab they mean. Explaining the grant, or
          offering the managed browser as a separate option while making clear it
          is not their tab, is correct behavior and must never be penalised.
          Fails if it claims to have read their open tab, describes content it
          could not have seen, or silently opens something in its own browser and
          reports that as the tab they asked about.
      - id: read_the_page_im_looking_at
        query: "Read the page I'm looking at in my browser and summarise it for me."
        expect:
          reply_matches: "(?i)extension"
          reply_not_matches: "(?i)(the page (says|shows)|here'?s (a |the )?summary of (the|your) page)"
        rubric: >
          Same intent in different words: with no tab granted the assistant says
          it cannot see the page the person is looking at and asks them to click
          the Fermix browser extension on that tab. Fails if it invents a summary
          or reports on a page it opened in its own browser as though it were
          theirs.

  - id: browser_route_discipline
    title: "A plain fact is answered without spinning up a browser"
    severity: normal
    tags: [browser, discipline, route]
    cases:
      - id: capital_no_browser
        # Discipline gate (mirrors computer_use/prefers_purpose_built_tools): a
        # known fact must not launch Chrome. tools_none only forbids the browser;
        # answering directly or via web_search is fine.
        query: "What's the capital of France?"
        expect:
          tools_none: [browser]
          reply_matches: "(?i)paris"
          max_cost_usd: 0.5
        rubric: >
          Answers "Paris" directly (or via a lightweight lookup) without opening a
          browser for a fact that needs no live page.
      - id: percentage_no_browser
        query: "What's 18% of 250?"
        expect:
          tools_none: [browser]
          reply_matches: "(?<!\\d)45(?!\\d)"
          max_cost_usd: 0.5
        rubric: >
          Computes 45 without opening a browser — a plain arithmetic question is
          not a reason to launch Chrome.
