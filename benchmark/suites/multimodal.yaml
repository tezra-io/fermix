suite: multimodal
risk: host_readonly
title: "Inbound multimodal — attachments reach and are understood by the model"
description: >
  Verifies an inbound attachment is rendered at the gateway, encoded as a
  provider content part (or inlined), and actually understood by the model (M14,
  M67): pictures, a GIF file and a video read from their frames where the eval
  machine has ffmpeg (a GIF from its first frame, a video named for ffmpeg,
  where it does not), a PDF, a text file, and a file Fermix cannot read, which
  must be named, never called empty. The risk stays host_readonly: each turn
  also keeps its attachment under the development home's own workspace
  (media/inbound, pruned at 14 days and 1 GB), engine state written the way a
  history row is, not a scenario's intent; the follow-up scenario reopens one
  such file in a later turn. Most
  cases inject bundled fixtures through `fermix ask --attach`; only the channel-
  specific scenarios use drive: telegram_operator with --operator. For those, the
  runner prints an exact fixture path to attach to the dedicated eval Telegram bot
  with the marked prompt as its caption. Known fixtures make channel-image answers
  objectively gradeable; arbitrary private photos are intentionally excluded. The
  non-vision-route fail-loud boundary
  is covered by deterministic unit tests (ModelCatalog.vision?/RouteResolver),
  not here, because the eval daemon runs a vision-capable model.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true
scenarios:
  # Automated (no operator): a bundled known-content image is injected through
  # `fermix ask --attach`, which carries it via the same gateway → turn_runner →
  # provider-encoder spine a channel image would. The fixture is a solid red
  # square, so the model must say "red".
  - id: image_described_auto
    title: "A bundled sample image is read via `fermix ask --attach`"
    severity: critical
    tags: [multimodal, vision, automated]
    cases:
      - id: red_square_colour
        image: fixtures/red_square.png
        query: "What is the dominant colour of this image? Answer with the colour name."
        expect:
          main_model_matches: "."
          reply_matches: "(?i)\\bred\\b"
          reply_not_matches: "(?i)(can't|cannot|don't|do not|unable to) (see|view|access|open)"
        rubric: "Identifies the image as predominantly red."
      - id: red_square_describe
        image: fixtures/red_square.png
        query: "Describe this image in a few words."
        expect:
          reply_matches: "(?i)(red|square|colou?r)"
          reply_not_matches: "(?i)(can't|cannot|unable to) (see|view)"
        rubric: "Describes a solid red square / red image."
      # Replaces a three-way multiple choice a blind guess passed one time in
      # three: colour AND shape together cannot be guessed from the question.
      - id: red_square_colour_and_shape
        image: fixtures/red_square.png
        query: "What colour is this, and roughly what shape?"
        expect:
          reply_matches: "(?is)(?=.*\\bred\\b)(?=.*\\b(square|rectang|block)\\w*)"
          reply_not_matches: "(?i)(can't|cannot|unable to) (see|view)"
        rubric: "Says the image is red and square (or a red rectangular block)."

  # OCR: a bundled image with rendered text ("ALPHA 42"). The model must read it
  # back, so the assertion is exact-string, not a fuzzy description.
  - id: image_text_auto
    title: "A bundled text image is read back via `fermix ask --attach`"
    severity: critical
    tags: [multimodal, vision, ocr, automated]
    cases:
      - id: read_text_alpha
        image: fixtures/text_alpha.png
        query: "Read the text shown in this image and quote it exactly."
        expect:
          main_model_matches: "."
          reply_matches: "(?i)alpha"
          reply_not_matches: "(?i)(can't|cannot|don't|do not|unable to) (see|view|read|open)"
        rubric: "Reads back the text ALPHA 42 (at least the word ALPHA) from the image."
      - id: read_text_bravo
        image: fixtures/text_bravo.png
        query: "Read the text shown in this image and quote it exactly."
        expect:
          reply_matches: "(?i)bravo"
          reply_not_matches: "(?i)(can't|cannot|don't|do not|unable to) (see|view|read|open)"
        rubric: "Reads back the text BRAVO 73 (at least the word BRAVO) from the image."

  # Multi-image / album: TWO bundled images in one turn must BOTH reach the model
  # (the bug class behind album coalescing — "2 images, sees only 1"). Each image
  # carries a distinct token, so the reply must mention BOTH ALPHA and BRAVO.
  - id: images_multi_auto
    title: "Two images attached in one turn are BOTH understood"
    severity: critical
    tags: [multimodal, vision, multi-image, automated]
    cases:
      - id: read_both_labels
        images:
          - fixtures/text_alpha.png
          - fixtures/text_bravo.png
        query: "There are two images here. Read the text in each one and list both."
        expect:
          main_model_matches: "."
          # A single regex requiring BOTH tokens (grader uses re.search, no
          # DOTALL → match across newlines with [\\s\\S]).
          reply_matches: "(?i)(?=[\\s\\S]*\\balpha\\b)(?=[\\s\\S]*\\bbravo\\b)"
          reply_not_matches: "(?i)(only|just) (one|a single|1) image"
        rubric: >
          Reads BOTH images — mentions ALPHA (42) and BRAVO (73). Fails if it sees
          only one image or omits either label.
      - id: read_both_numbers
        images:
          - fixtures/text_alpha.png
          - fixtures/text_bravo.png
        query: "List every number you can see across these images."
        expect:
          # Both numbers (42 and 73) present → both images were read, not just one.
          reply_matches: "(?i)(?=[\\s\\S]*\\b42\\b)(?=[\\s\\S]*\\b73\\b)"
        rubric: "Reports both numbers 42 and 73 — proof both images reached the model."

  # M67: attachments beyond pictures, through the same `fermix ask --attach`
  # path into the one gateway pipeline a channel attachment takes. Each answer
  # is a token only the attachment holds (the outcome floor); the negatives
  # catch the old failure, an attachment called empty or missing. A message
  # with no text whose attachments are all unreadable is answered at the
  # gateway with no turn, so it has no trace to grade here: ExUnit proves that
  # reply (`FermixChannels.CLITest`), and these cases carry a question.
  - id: gif_file_auto
    title: "A GIF file reaches the model, as frames or as its first frame"
    severity: critical
    tags: [multimodal, attachments, animation, automated]
    cases:
      - id: spinner_gif_words
        image: fixtures/attachments/spinner_gamma.gif
        query: "What does this little animation say?"
        expect:
          main_model_matches: "."
          reply_matches: "(?i)gamma"
          reply_not_matches: "(?i)(looks|is) empty|no (gif|image|file|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: >
          Reads the words GAMMA 19 from the attached GIF. It may say it saw one
          frame or several; it must not claim the attachment is empty or missing.
      - id: spinner_gif_number
        image: fixtures/attachments/spinner_gamma.gif
        query: "There's a number in this gif somewhere, what is it?"
        expect:
          reply_matches: "\\b19\\b"
          reply_not_matches: "(?i)(looks|is) empty|no (gif|image|file|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: "Gives the number 19 shown in the GIF."

  # M67 D3: a video reaches the model as frames where the eval machine has
  # ffmpeg, and is named with the install command where it does not. The
  # fixture is silent, so its sound adds at most a note (D5). The floor holds on
  # both machines and keys on no wording: the turn ran on the main model, and
  # the reply never calls the clip empty or missing. The rubric owns which of
  # the two outcomes the machine allows.
  - id: video_clip_auto
    title: "A video is read from its frames, or ffmpeg is named"
    severity: critical
    tags: [multimodal, attachments, video, automated]
    cases:
      - id: clip_captions
        image: fixtures/attachments/clip_kappa.mp4
        query: "What words come up in this clip?"
        expect:
          main_model_matches: "."
          reply_not_matches: "(?i)(looks|is) empty|no (video|clip|file|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: >
          Passes if the reply does one of two things: (1) it reports the words
          the clip shows, KAPPA 64 and SIGMA 27 (at least one of KAPPA or
          SIGMA); or (2) it tells the user the video could not be watched because
          ffmpeg is not installed, and says how to install it. It fails if it
          states words the clip does not show, or says the clip is empty or
          missing. A remark that the clip has no speech, or that its sound could
          not be transcribed, is neither required nor penalised.
      - id: clip_caption_order
        image: fixtures/attachments/clip_kappa.mp4
        query: "Two captions flash up in this video. Which one comes first?"
        expect:
          main_model_matches: "."
          reply_not_matches: "(?i)(looks|is) empty|no (video|clip|file|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: >
          Passes if the reply either says KAPPA 64 comes first and SIGMA 27
          after it, or tells the user the video could not be watched because
          ffmpeg is not installed and says how to install it. It fails if it
          puts SIGMA 27 first, states captions the clip does not show, or says
          the clip is empty or missing.

  # M67 D1: an owner's attachment is kept in the workspace and the attachment
  # list names where, so a later turn can open it again once the picture itself
  # has left the conversation (pictures ride only the turn they arrive in).
  # Turn one hands the picture over and asks for nothing about it; turn two asks
  # what it shows, which only reopening the saved file answers. `tools_any:
  # [view_image]` is this suite's one labelled sanity route assertion: it is the
  # only way to see a local picture, so its span is the proof the model reopened
  # the file instead of recalling it. The token floor is the picture's own text.
  - id: saved_attachment_reopened_auto
    title: "A picture sent earlier is reopened from the workspace in a later turn"
    severity: critical
    risk: host_readonly
    tags: [multimodal, attachments, workspace, automated]
    cases:
      - id: sign_read_later
        image: fixtures/text_alpha.png
        turns:
          - query: "Here's a photo of a sign I'll need in a minute. Don't read it out yet, just say OK."
          - query: "Right, now tell me exactly what the sign in that photo says."
            expect:
              main_model_matches: "."
              tools_any: [view_image]
              reply_matches: "(?i)alpha"
              reply_not_matches: "(?i)re-?send|send (it|the (photo|picture|image|sign)) again|(no longer|don't|do not) have (it|the (photo|picture|image))"
        rubric: >
          Passes only if the final reply reads the sign in the photo from the
          first message as ALPHA 42 (at least ALPHA). It fails if it asks for the
          photo to be sent again, says it can no longer see or open it, or states
          text the sign does not show.
      - id: number_read_later
        image: fixtures/text_bravo.png
        turns:
          - query: "Keep hold of this image for me, I'll come back to it shortly. Nothing to do with it yet."
          - query: "OK, what number is on the image I sent you a moment ago?"
            expect:
              main_model_matches: "."
              tools_any: [view_image]
              reply_matches: "\\b73\\b"
              reply_not_matches: "(?i)re-?send|send (it|the (photo|picture|image)) again|(no longer|don't|do not) have (it|the (photo|picture|image))"
        rubric: >
          Passes only if the final reply gives 73, the number on the image sent
          in the first message. It fails if it asks for the image to be sent
          again, says it can no longer see or open it, or gives a different
          number.

  - id: pdf_read_auto
    title: "A PDF reaches the model as a document"
    severity: critical
    tags: [multimodal, attachments, document, automated]
    cases:
      - id: lease_number
        image: fixtures/attachments/lease_7731.pdf
        query: "What's the lease number on this?"
        expect:
          main_model_matches: "."
          reply_matches: "7731"
          reply_not_matches: "(?i)(looks|is) empty|no (pdf|document|file|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: "Gives lease number 7731, read from the attached PDF."
      - id: lease_tenant
        image: fixtures/attachments/lease_7731.pdf
        query: "Who's the tenant here, and which property is it for?"
        expect:
          reply_matches: "(?i)orla"
        rubric: >
          Names Orla Venn as the tenant and 14 Harrow Lane, Kestrel Bay as the
          property, both read from the attached PDF.

  - id: text_file_inlined_auto
    title: "A text file is read inline"
    severity: normal
    tags: [multimodal, attachments, text, automated]
    cases:
      - id: barrier_code
        image: fixtures/attachments/notes_delta.txt
        query: "What's the car park barrier code in my picnic notes?"
        expect:
          main_model_matches: "."
          reply_matches: "\\b55\\b"
          reply_not_matches: "(?i)(looks|is) empty|no (file|note|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: "Gives the barrier code DELTA 55 from the attached notes."
      - id: bakery_name
        image: fixtures/attachments/notes_delta.txt
        query: "Which bakery is the cake from, according to this list?"
        expect:
          reply_matches: "(?i)hollis"
          reply_not_matches: "(?i)(looks|is) empty|no (file|note|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: "Names Hollis Bakery, from the attached list."

  - id: unreadable_named_auto
    title: "A file Fermix cannot read is named, never called empty"
    severity: critical
    tags: [multimodal, attachments, unreadable, automated]
    cases:
      - id: binary_file
        image: fixtures/attachments/payload.bin
        query: "Can you go through this file for me?"
        # No wording gate: the floor is that the turn ran on the main model,
        # the negative catches the old "looks empty" failure, and the rubric
        # owns the rest.
        expect:
          main_model_matches: "."
          reply_not_matches: "(?i)(looks|is) empty|no (file|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: >
          Passes only if the reply does both: (1) it tells the user that the
          attached file payload.bin could not be read or opened, and (2) it
          states no contents of that file. It fails if it describes what the file
          contains, or says the message or the attachment is empty or missing.
      - id: binary_file_reworded
        image: fixtures/attachments/payload.bin
        query: "What's in this attachment?"
        expect:
          reply_not_matches: "(?i)(looks|is) empty|no (file|attachment)s? (was |were )?(attached|included|received|sent)"
        rubric: >
          Passes only if the reply tells the user the attached file payload.bin
          could not be opened and describes none of its contents. It fails if it
          states what the file contains, or calls the attachment empty or missing.

  - id: image_described
    risk: external_write
    title: "A photo with a caption is read and described"
    severity: critical
    tags: [multimodal, vision, core]
    cases:
      - id: photo_describe
        drive: telegram_operator
        image: fixtures/red_square.png
        query: "Describe what is in this image in one sentence."
        expect:
          # A main model turn served the reply (sanity: the turn actually ran).
          main_model_matches: "."
          # The model must say something concrete about the picture — NOT claim it
          # cannot see an image (the pre-M14 failure mode).
          reply_not_matches: "(?i)(can't|cannot|don't|do not|unable to) (see|view|access|open).{0,20}(image|picture|photo|attach)"
          # "red" alone, as the automated twin accepts: a one-sentence description
          # may say block or rectangle, and the shape was never the point.
          reply_matches: "(?i)\\bred\\b"
      - id: photo_read_text
        drive: telegram_operator
        image: fixtures/text_alpha.png
        query: "Read any text shown in this image and quote it back."
        expect:
          reply_not_matches: "(?i)(can't|cannot|don't|do not|unable to) (see|view|access|open).{0,20}(image|picture|photo|attach)"
          reply_matches: "(?is)(?=.*\\bALPHA\\b)(?=.*\\b42\\b)"
  - id: image_plus_question
    risk: external_write
    title: "A photo plus a specific question about it"
    severity: normal
    tags: [multimodal, vision]
    cases:
      - id: photo_count
        drive: telegram_operator
        image: fixtures/red_square.png
        query: "How many coloured shapes are shown in this image? Give a number."
        expect:
          reply_matches: "(?i)\\b(one|1)\\b"
      - id: photo_colour
        drive: telegram_operator
        image: fixtures/red_square.png
        query: "What is the dominant colour in this image?"
        expect:
          reply_matches: "(?i)\\bred\\b"
