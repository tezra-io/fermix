suite: conversation
risk: host_readonly
title: "Conversation routing — a fresh turn is handled on its own, not as a continuation"
description: >
  Exercises multi-turn conversational routing: after a substantive turn has
  FULLY completed, the next short turn (a greeting, a thank-you, or an unrelated
  question) must be answered on its own merits — Fermix must not silently
  continue or re-answer the previous question. The regression this guards against
  is a fresh turn ballooning back into the prior topic (the model treating a new
  message as if it were a continuation). Each case grades the SECOND turn: the
  reply must address the new message, must not re-emit the prior topic, and the
  turn must stay cheap/shallow (a greeting is one model call, not a re-run of the
  earlier work — caught by max_iterations / max_tool_calls).

  NOTE: this is normal multi-turn context handling, NOT the `/stop` work-control
  command. A true mid-turn `/stop` (the gateway killing an in-flight turn and
  leaving an orphaned user message) cannot be reproduced by this serialized
  `fermix ask` harness — every turn runs to completion before the next is sent —
  and is covered deterministically by the in-process ExUnit suite instead.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: fresh_turn_not_continuation
    title: "A new short message is answered itself, not as a continuation of the prior turn"
    # critical: conversation-turn routing is core; deterministic (reply_not_matches on the
    # prior topic) so a regression to treating every turn as a continuation fails the run.
    severity: critical
    tags: [conversation, routing, context, host-safe-core]
    cases:
      - id: greeting_after_fact
        turns:
          - query: "In one sentence: what is the capital of France?"
            expect:
              reply_matches: "(?i)paris"
          - query: "Hey!"
            expect:
              reply_matches: "(?i)\\b(hi|hey|hello|hiya|how can i help|how'?s it going|what'?s up)\\b|👋"
              reply_not_matches: "(?i)paris|capital of france"
              max_tool_calls: 1
              max_iterations: 2
        expect:
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: >
          The second reply greets back / engages with the greeting itself. It
          does NOT re-answer or continue the earlier question about France.
      - id: thanks_after_fact
        turns:
          - query: "In one sentence, how does photosynthesis work?"
            expect:
              reply_matches: "(?i)photosynthesis|light|sunlight|glucose|energy"
          - query: "Thanks!"
            expect:
              reply_matches: "(?i)welcome|anytime|glad|no problem|sure|happy to|of course|👍|🙏"
              reply_not_matches: "(?i)photosynthesis|chlorophyll|glucose"
              max_tool_calls: 1
              max_iterations: 2
        expect:
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: >
          The second reply acknowledges the thanks briefly. It does NOT launch
          back into re-explaining photosynthesis.
      - id: new_question_after_fact
        turns:
          - query: "Briefly, what causes ocean tides?"
            expect:
              reply_matches: "(?i)moon|gravit|tide"
          - query: "Different question — what is 2 + 2?"
            expect:
              reply_matches: "(?i)\\b(4|four)\\b"
              reply_not_matches: "(?i)tide|moon|gravit"
              max_tool_calls: 1
              max_iterations: 2
        expect:
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: >
          The second reply answers the new arithmetic question (4). It does NOT
          continue or re-answer the earlier tides question.
