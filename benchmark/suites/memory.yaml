              reply_matches: "(?i)vegetarian|noted|got it|remember|keep that in mind|understood"
          - query: "I'm hungry — suggest one quick dinner I could throw together tonight."
            expect:
              reply_matches: "(?i)veg|tofu|paneer|lentil|chickpea|bean|pasta|stir[- ]?fry|salad|omelet|egg|cheese|vegetable"
