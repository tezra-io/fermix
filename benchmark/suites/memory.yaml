            expect:
              reply_matches: "(?i)you (told|mentioned|said|just|shared|named)|earlier|this (conversation|chat|message)|a (moment|second|minute) ago|just (now|said|told)|from (you|this)|in our (chat|conversation)|right here"
              reply_not_matches: "(?i)(?:retrieved|pulled|read|found|got|checked|fetched|saw|accessed)\\b(?: it| that| this| up)? (?:from |in |on )?(?:your |my |the |a |an )?(?:user |connected )?(?:google |notion |apple )?(?:profile|database|account|dossier|records?|stored (?:file|document)|service|crm)|looked (?:it|that) up|web ?search(?:ed|ing)?|searched (?:the )?(?:web|internet|online)|(?:on|from|across) the (?:internet|web)|(?:its|it is) (?:in |stored in )(?:my |your |the )?(?:database|account|profile|records?|dossier)"
