suite: memory
title: "Memory — capture, recall, supersession, and no-confabulation"
description: >
  Exercises the assistant's long-term and conversational memory end to end:
  capturing facts across every memory category (identity, preference, interest,
  goal, project context, standing directive) both on explicit request and from a
  passive mention; recalling them in-conversation, selectively among many, and
  through paraphrased questions; reporting what it knows and admitting an empty
  memory honestly; letting a durable fact shape a later unrelated answer;
  superseding corrected facts (latest-wins, current-over-stale, self-correction,
  and propagation into derived reasoning); and refusing to confabulate — admitting
  unknowns, surfacing conflicts instead of guessing, attributing provenance
  honestly, and handling a withdrawal without over-claiming a hard delete it
  cannot do. Gates are deliberately tolerant of the model's route: memory_store
  and memory_recall emit no telemetry span on the CLI eval path, and a
  same-conversation follow-up may be answered directly from context, so scenarios
  assert reply content (reply_matches / reply_not_matches), never a specific tool
  call. The no-confabulation negative gates are the load-bearing checks.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: store_request_echoes_fact
    title: "An explicit remember request lands the actual fact, not a bare ack"
    severity: critical
    tags: [memory, core, store]
    cases:
      - id: favourite_team_echoed
        query: "Hang on to this for me going forward — my favourite football team is Arsenal."
        expect:
          # memory_store emits no telemetry span on the CLI eval path, so gate purely
          # on the reply. A correct store ECHOES the fact (Arsenal); a content-free
          # "noted." with no fact, or the wrong team, must fail.
          reply_matches: "(?i)arsenal"
          reply_not_matches: "(?i)chelsea|tottenham|liverpool|man(chester)? (utd|united|city)"
          max_cost_usd: 1.0
        rubric: "Acknowledges the request AND confirms the stored fact by naming Arsenal as the favourite team; a generic acknowledgement that never restates the team is a fail."
      - id: dietary_pref_echoed
        query: "Please keep in mind from now on: I'm vegetarian and I don't eat seafood."
        expect:
          reply_matches: "(?i)vegetarian|plant[- ]?based|no (meat|seafood|fish)|don'?t eat (meat|seafood|fish)|avoid(s|ing)? (meat|seafood|fish)|won'?t eat (meat|seafood|fish)"
          reply_not_matches: "(?i)\\b(carnivore|omnivore|pescatarian|meat[- ]?eater)\\b|you eat (meat|seafood|fish)"
          max_cost_usd: 1.0
        rubric: "Confirms it has stored that the user is vegetarian and avoids seafood, restating the dietary fact (vegetarian / no meat / no seafood) rather than only saying 'noted'; inverting the preference (e.g. omnivore/pescatarian/eats seafood) is a fail."
      - id: work_schedule_echoed
        query: "For the record, I'd like you to remember that I work night shifts Tuesday through Saturday."
        expect:
          reply_matches: "(?i)night shift"
          reply_not_matches: "(?i)day shift|monday through friday|9 ?to ?5|weekends? off"
          max_cost_usd: 1.0
        rubric: "Stores and restates that the user works night shifts Tuesday through Saturday; a bare ack with no shift detail, or a wrong/day-shift schedule, is a fail."

  - id: capture_identity_durably
    title: "Durably captures identity facts when asked to remember them"
    severity: normal
    tags: [memory, identity, capture]
    cases:
      - id: name_and_role
        query: "Keep this in mind from now on: I'm Diego and I work as a backend engineer."
        expect:
          # memory_store emits no telemetry span in the CLI eval path; gate on the
          # reply both acknowledging a durable save AND echoing the identity value.
          reply_matches: "(?is)(?=.*\\bdiego\\b)(?=.*back[ -]?end).*(remember|noted|saved|stored|got it|keep .* in mind|from now on|will (do|keep|remember))"
          # Failure mode for durable capture: denying it can/will remember.
          reply_not_matches: "(?is)\\b(can'?t|cannot|won'?t|unable to|don'?t|do not) (remember|store|save|retain|keep)\\b|no (persistent |long[- ]?term )?memory"
          max_cost_usd: 1.0
        rubric: "Acknowledges it will remember that the user's name is Diego and that he works as a backend engineer; echoes both the name and the role without inventing other details."
      - id: location_and_language
        query: "For the future, hang on to this: I'm based in Lisbon, and I'd rather we talk in plain English even though Portuguese is my first language."
        expect:
          reply_matches: "(?is)(?=.*lisbon)(?=.*english).*(remember|noted|saved|stored|got it|keep .* in mind|hang on to|from now on|will (do|keep|remember))"
          reply_not_matches: "(?is)\\b(can'?t|cannot|won'?t|unable to|don'?t|do not) (remember|store|save|retain|keep)\\b|no (persistent |long[- ]?term )?memory"
          max_cost_usd: 1.0
        rubric: "Acknowledges it will remember that the user is based in Lisbon and prefers communicating in English (Portuguese being their first language); echoes the location and language preference without inventing other details."

  - id: capture_work_preference
    title: "Captures an explicit how-I-like-work preference and reflects it back"
    severity: normal
    tags: [memory, preference, capture]
    cases:
      - id: output_format_bullets
        turns:
          - query: "Going forward, always give me answers as short bullet points and skip the long preamble — lock that in as how I like things."
            expect:
              reply_matches: "(?i)bullet|got it|noted|saved|stored|remember|from now on|going forward"
          - query: "How are you going to format your answers for me from now on?"
            expect:
              reply_matches: "(?i)bullet|short|concise|no (long )?preamble|skip(ping)? the (long )?preamble"
              reply_not_matches: "(?i)\\b(paragraph|prose|essay)s?\\b"
        expect:
          reply_matches: "(?i)bullet|short|concise|no (long )?preamble"
          reply_not_matches: "(?i)\\b(paragraph|prose|essay)s?\\b"
          max_cost_usd: 1.5
        rubric: "Acknowledges storing the preference, then reflects it back: short bullet points with no long preamble. Does not invent an unrelated formatting preference or revert to long prose."
      - id: tone_verbosity_blunt
        turns:
          - query: "Quick preference to keep on file: be blunt and direct with me, no hedging or filler — save that as my default."
            expect:
              reply_matches: "(?i)blunt|direct|got it|noted|saved|stored|remember|will do|default"
          - query: "What tone are you supposed to use when you reply to me?"
            expect:
              reply_matches: "(?i)blunt|direct|straight|no (hedg|filler)|to the point"
              reply_not_matches: "(?i)\\b(verbose|wordy|long-?winded|diplomatic)\\b"
        expect:
          reply_matches: "(?i)blunt|direct|straight|to the point"
          reply_not_matches: "(?i)\\b(verbose|wordy|long-?winded|diplomatic)\\b"
          max_cost_usd: 1.5
        rubric: "Acknowledges storing the tone preference, then reflects it back: blunt and direct, no hedging or filler. Does not contradict it by promising a softer, more diplomatic, or more verbose style."

  - id: explicit_capture_interest
    title: "Captures an explicitly stated interest and names the topic back"
    severity: normal
    tags: [memory, interest, capture]
    cases:
      - id: f1_strategy_interest
        query: "For future reference, I'm really into Formula 1 race strategy and tire-degradation analysis — that's a topic I genuinely care about, so keep it in mind."
        expect:
          # memory_store emits no telemetry spans in the CLI eval path;
          # gate on the reply confirming the interest AND naming the topic.
          reply_matches: "(?i)(formula\\s?1|\\bf1\\b|race strateg|tire|tyre).*(remember|noted|got it|saved|stored|keep|note|track)|(remember|noted|got it|saved|stored|keep|note|track).*(formula\\s?1|\\bf1\\b|race strateg|tire|tyre)"
          max_cost_usd: 1.0
        rubric: "Confirms it has noted the user's interest and explicitly names Formula 1 strategy / tire-degradation as the topic, rather than a bare 'noted' with no topic."
      - id: renaissance_art_interest
        query: "Something to file away about me: I'm fascinated by Italian Renaissance art, especially fresco techniques. I'd love for you to know that's an interest of mine."
        expect:
          reply_matches: "(?i)(renaissance|fresco|italian art).*(remember|noted|got it|saved|stored|keep|note|track|interest)|(remember|noted|got it|saved|stored|keep|note|track|interest).*(renaissance|fresco|italian art)"
          max_cost_usd: 1.0
        rubric: "Acknowledges and records the user's interest in Italian Renaissance art / fresco techniques, naming the topic back."
      - id: distributed_systems_interest_then_list
        turns:
          - query: "Heads up for the future — a subject I'm really passionate about is distributed systems, particularly consensus algorithms like Raft and Paxos. Hold onto that."
            expect:
              reply_matches: "(?i)(distributed systems|consensus|raft|paxos).*(remember|noted|got it|saved|stored|keep|note|track)|(remember|noted|got it|saved|stored|keep|note|track).*(distributed systems|consensus|raft|paxos)"
          - query: "Out of curiosity, what topics or subjects do you know I'm interested in?"
            expect:
              reply_matches: "(?i)distributed systems|consensus|raft|paxos"
              reply_not_matches: "(?i)\\b(cooking|gardening|astronomy|knitting|football|soccer|basketball|painting)\\b"
        expect:
          max_cost_usd: 1.5
        rubric: "On the follow-up, reports distributed systems / consensus algorithms as a known interest and does not invent an unrelated interest the user never mentioned."

  - id: explicit_capture_goal
    title: "Captures and restates an explicitly stated goal"
    severity: normal
    tags: [memory, goal, capture]
    cases:
      - id: certification_goal
        turns:
          - query: "Hold onto this: my main goal this quarter is to pass the AWS Solutions Architect exam, so keep it in the back of your mind."
            expect:
              reply_matches: "(?i)(aws|solutions architect).*(exam|cert|goal)|(exam|cert|goal).*(aws|solutions architect)|noted|got it|remember|saved|stored"
          - query: "Remind me — what am I working toward this quarter?"
            expect:
              reply_matches: "(?i)(aws|solutions architect).*(exam|cert)|(exam|cert).*(aws|solutions architect)"
              reply_not_matches: "(?i)\\b(azure|gcp|google cloud|kubernetes|cka|ccna|pmp|comptia|terraform|developer associate)\\b"
        expect:
          reply_matches: "(?i)aws|solutions architect"
          max_cost_usd: 1.5
        rubric: "Acknowledges the goal when it is stated, restates it as passing the AWS Solutions Architect exam this quarter, and later recalls that specific goal without inventing a different certification."
      - id: project_milestone_goal
        turns:
          - query: "Keep this front of mind for me: the big thing I'm trying to get done is shipping the new v2 checkout flow before our product launch."
            expect:
              reply_matches: "(?i)(v2|checkout).*(launch|ship|goal)|(launch|ship|goal).*(v2|checkout)|noted|got it|remember|saved|stored"
          - query: "What's the main milestone I'm pushing to hit right now?"
            expect:
              reply_matches: "(?i)(v2|checkout).*(launch|ship)|(launch|ship).*(v2|checkout)|checkout flow"
              reply_not_matches: "(?i)\\b(payment gateway|mobile app|onboarding flow|search redesign|dashboard|pricing page|signup flow)\\b"
        expect:
          reply_matches: "(?i)checkout|v2"
          max_cost_usd: 1.5
        rubric: "Acknowledges the milestone when stated, restates it as shipping the v2 checkout flow before launch, and later recalls that specific milestone without confabulating a different objective."

  - id: capture_project_context
    title: "Durably captures project/environment context when asked to note it"
    severity: normal
    tags: [memory, context, capture]
    cases:
      - id: tech_stack_fact
        turns:
          - query: "Note this for later: our main service runs on Elixir with a Postgres backend, and that's not changing any time soon."
            expect:
              reply_matches: "(?i)(elixir|postgres).*(noted|saved|stored|remember|got it|keep|will (note|remember))|(noted|saved|stored|remember|got it).*(elixir|postgres)"
          - query: "Remind me — what's the full stack our main service is built on?"
            expect:
              reply_matches: "(?i)elixir"
        expect:
          reply_matches: "(?i)postgres"
          reply_not_matches: "(?i)\\b(mysql|mongo(db)?|redis|kafka|rust|python|node\\.?js|java|ruby|mariadb|cassandra|sqlite)\\b"
          max_cost_usd: 1.5
        rubric: "Confirms it durably saved that the main service runs on Elixir with a Postgres backend, then accurately echoes both Elixir and Postgres on recall without inventing extra stack details."
      - id: team_process_fact
        turns:
          - query: "Worth keeping on file: our team does code freezes every December and we always deploy on Fridays. That won't change."
            expect:
              reply_matches: "(?i)(friday|freeze|december).*(noted|saved|stored|remember|got it|keep|will (note|remember))|(noted|saved|stored|remember|got it).*(friday|freeze|december)"
          - query: "What day did I say we ship our deploys?"
            expect:
              reply_matches: "(?i)friday"
        expect:
          reply_matches: "(?i)friday"
          reply_not_matches: "(?i)\\b(monday|tuesday|wednesday|thursday|saturday|sunday)\\b"
          max_cost_usd: 1.5
        rubric: "Confirms it durably saved the team's process facts (Friday deploys, December code freezes), then accurately recalls Friday as the deploy day without naming a different weekday."

  - id: capture_standing_directive
    title: "Captures a standing rule for its own future behavior"
    severity: normal
    tags: [memory, directive, capture]
    cases:
      - id: always_include_imports
        query: "From now on, whenever you give me code, always include the import lines at the top — make that a standing rule for how you respond to me."
        expect:
          # directive is MEMORY.md-promoted and the CLI eval caller is the operator
          # (not :guest), so capture succeeds. memory_store emits no telemetry span
          # in this path, so gate on the reply acknowledging the standing rule.
          reply_matches: "(?i)(always|from now on|going forward|every time|standing|noted|got it|will|i'?ll).{0,60}(import|include|rule|do that|remember)|(import|include).{0,40}(always|from now on|going forward|standing|noted|will|i'?ll)"
          max_cost_usd: 1.0
        rubric: "Acknowledges the standing rule that future code replies should always include import lines, treating it as a durable behavior directive rather than a one-off request."
      - id: never_use_emojis
        query: "Make this a permanent rule for talking to me: never put emojis in your replies, not even once."
        expect:
          reply_matches: "(?i)(never|won'?t|will not|no|avoid|going forward|from now on|noted|got it|understood|i'?ll).{0,60}(emoji|emojis)|(emoji|emojis).{0,40}(never|won'?t|will not|avoid|noted|going forward|from now on)"
          max_cost_usd: 1.0
        rubric: "Acknowledges the standing rule to never use emojis in replies, treating it as a durable behavior directive it will follow going forward; does not treat it as a one-time instruction."

  - id: passive_implicit_capture
    title: "Uses a fact dropped casually (no 'remember this') in a later same-thread turn"
    severity: normal
    tags: [memory, passive_capture, implicit]
    cases:
      - id: denver_timezone
        turns:
          - query: "Ugh, my flight out of Denver keeps getting pushed back this morning."
            expect:
              reply_matches: "(?i)denver|delay|flight|sorry|frustrat"
          - query: "When you're scheduling stuff for me, what time zone should you assume I'm in?"
            expect:
              reply_matches: "(?i)mountain|denver|\\bMT\\b|MST|MDT|UTC-?\\s?[67]"
              reply_not_matches: "(?i)eastern\\b|pacific\\b|central time|\\bUTC\\b\\s*$|don'?t know|no idea|not sure what time|can you tell me your time ?zone"
        expect:
          max_cost_usd: 1.5
        rubric: "Infers and uses Mountain Time from the casually-mentioned Denver location, without asking the user to restate where they are or defaulting to an unrelated zone."
      - id: peanut_allergy_snack
        turns:
          - query: "I always have to read every label twice since my kid is allergic to peanuts."
            expect:
              reply_matches: "(?i)peanut|allerg|label|careful|understand"
          - query: "Can you suggest a quick snack idea for their lunchbox?"
            expect:
              reply_matches: "(?i)peanut[- ]?free|no peanuts|without peanuts|avoid(ing)? peanuts|allerg|nut[- ]?free"
              reply_not_matches: "(?i)peanut butter|pb ?& ?j|pbj|trail mix with peanuts|reese'?s|peanut[- ]?based"
        expect:
          max_cost_usd: 1.5
        rubric: "Treats the implicitly-stated peanut allergy as a binding constraint and proposes a peanut-free snack rather than suggesting peanut-containing foods."
      - id: vegan_restaurant
        turns:
          - query: "Honestly the hardest part of going vegan last year has been eating out."
            expect:
              reply_matches: "(?i)vegan|plant[- ]?based|eating out|relate|understand"
          - query: "There's a steakhouse near my office — think it's worth a try for me?"
            expect:
              reply_matches: "(?i)vegan|plant[- ]?based|limited|few options|might not|may not|not the best fit|hard to find|elsewhere|another (spot|place|restaurant)|different (spot|place|restaurant)"
              reply_not_matches: "(?i)\\b(ribeye|rib eye|sirloin|filet|filets|filet mignon|porterhouse|t-?bone|prime rib|new york strip|ny strip|brisket|burgers?|ribs|pork chop|lamb chop|grilled chicken|chicken (breast|wings?)|wagyu|tenderloin)\\b|(try|order|get|recommend|go (for|with)|worth (a try|it)|grab)\\b.{0,30}\\bsteak\\b|\\bsteak\\b.{0,20}\\b(worth it|delicious|excellent|amazing|great|recommend)\\b|(great|good|solid|excellent|perfect|nice) (steak )?(choice|pick|option) for you"
        expect:
          max_cost_usd: 1.5
        rubric: "Remembers the user is vegan from the earlier offhand mention and frames the steakhouse around the lack of vegan options instead of recommending meat dishes."

  - id: recall_in_conversation
    title: "Uses a fact stated earlier in the same conversation"
    severity: normal
    tags: [memory, recall, conversational]
    cases:
      - id: name_then_question
        turns:
          - query: "Hi! My name is Priya and I'm learning to play the cello."
            expect:
              reply_matches: "(?i)priya|hello|hi|nice"
          - query: "What instrument did I say I'm learning?"
            expect:
              reply_matches: "(?i)cello"
              reply_not_matches: "(?i)\\b(piano|violin|guitar|drums|flute)\\b"
        expect:
          max_cost_usd: 1.5
        rubric: "Correctly answers that the user is learning the cello, not some other instrument."
      - id: project_then_question
        turns:
          - query: "I'm building a budget app called PennyWise in Flutter. Please remember that."
            expect:
              reply_matches: "(?i)pennywise|flutter|remember|noted|got it|saved"
          - query: "What's the name of the app I'm working on, and what framework is it in?"
            expect:
              reply_matches: "(?i)pennywise"
        expect:
          reply_matches: "(?i)flutter"
          max_cost_usd: 1.5
        rubric: "Recalls the app name PennyWise and that it is built in Flutter."
      - id: city_mentioned_then_followup
        turns:
          - query: "I just got back from a trip — I live in Lisbon, by the way."
            expect:
              reply_matches: "(?i)lisbon|welcome|nice|trip|great"
          - query: "Out of curiosity, which city did I just tell you I live in?"
            expect:
              reply_matches: "(?i)lisbon"
              reply_not_matches: "(?i)don'?t know|didn'?t (say|mention|tell)|not sure|no idea"
        expect:
          max_cost_usd: 1.5
        rubric: "Answers Lisbon, reusing the city stated one turn earlier, without claiming it doesn't know."
      - id: detail_buried_then_recall
        turns:
          - query: "Quick context before my question: I have two kids, Mateo who's 7 and Sofia who's 4, and we just adopted a rescue dog named Biscuit."
            expect:
              reply_matches: "(?i)mateo|sofia|biscuit|kids|dog|noted|got it"
          - query: "Remind me — what's my dog's name again?"
            expect:
              reply_matches: "(?i)biscuit"
              reply_not_matches: "(?i)\\b(mateo|sofia)\\b.{0,20}dog|don'?t know|didn'?t (say|mention)"
        expect:
          max_cost_usd: 1.5
        rubric: "Pulls the dog's name Biscuit out of the earlier multi-detail message, not a child's name, and does not claim ignorance."

  - id: selective_recall_among_many
    title: "Retrieves the one asked-for fact from many stated, without confusing or dumping the rest"
    severity: critical
    tags: [memory, recall, selective]
    cases:
      - id: pick_pet_name
        turns:
          - query: "A few things about me: I live in Berlin, I'm really into mountain biking, I drive a red Volvo, and my cat is named Pixel."
            expect:
              reply_matches: "(?i)berlin|volvo|pixel|got it|noted|sure|remember|saved|stored|keep that in mind|mind"
          - query: "Quick one — what's my cat's name again?"
            expect:
              reply_matches: "(?i)pixel"
              reply_not_matches: "(?i)volvo|mountain bik"
        expect:
          max_cost_usd: 1.5
        rubric: "Answers that the cat is named Pixel and gives only that fact, without reciting the car or the hobby and without inventing a different name."
      - id: pick_city
        turns:
          - query: "Bit about me so you have context: my sister Margaret lives with me, I work as a tax auditor, I keep tropical fish, and I'm based in Lisbon."
            expect:
              reply_matches: "(?i)lisbon|margaret|auditor|fish|got it|noted|sure|remember|saved|stored|keep that in mind|mind"
          - query: "Remind me which city I told you I live in?"
            expect:
              reply_matches: "(?i)lisbon"
              reply_not_matches: "(?i)margaret|tax auditor|tropical fish"
        expect:
          max_cost_usd: 1.5
        rubric: "Reports the city as Lisbon and nothing else — does not list the sister, the job, or the fish, and does not name a different city."
      - id: pick_drink
        turns:
          - query: "Some context about me: I'm allergic to peanuts, my favourite drink is kombucha, I've got a road trip to Porto next month, and I play the trombone."
            expect:
              reply_matches: "(?i)peanut|kombucha|porto|trombone|got it|noted|sure|remember|saved|stored|keep that in mind|mind"
          - query: "What did I say my favourite drink was?"
            expect:
              reply_matches: "(?i)kombucha"
              reply_not_matches: "(?i)peanut|trombone|porto"
        expect:
          max_cost_usd: 1.5
        rubric: "Gives kombucha as the favourite drink and stays scoped to that one fact, without restating the allergy, the trip, or the instrument and without substituting a different drink."

  - id: recall_paraphrased_query
    title: "Recalls a stored fact when the question is worded differently"
    severity: normal
    tags: [memory, recall, lexical]
    cases:
      - id: contact_pref_synonym
        turns:
          - query: "Quick note for later: my preferred way to be reached is email, not phone calls."
            expect:
              reply_matches: "(?i)e-?mail|noted|got it|remember|saved"
          - query: "Hey, how should you get in touch with me about updates?"
            expect:
              reply_matches: "(?i)e-?mail"
              reply_not_matches: "(?i)\\b(phone call|call you|by phone|text|sms|whatsapp)\\b|don'?t (know|have)|not sure|you haven'?t|didn'?t (say|tell)|no (record|preference)"
        expect:
          max_cost_usd: 1.5
        rubric: "Answers that the preferred contact method is email even though the recall question never used the word 'email', without inventing a phone number or other channel."
      - id: location_paraphrase
        turns:
          - query: "Just so you have it on file — I'm based in Berlin."
            expect:
              reply_matches: "(?i)berlin|noted|got it|remember|saved"
          - query: "Remind me, where am I located again?"
            expect:
              reply_matches: "(?i)berlin"
              reply_not_matches: "(?i)don'?t (know|have)|not sure|you haven'?t|didn'?t (say|tell)|no (record|idea)|unsure"
        expect:
          max_cost_usd: 1.5
        rubric: "Reports Berlin as the user's location despite the recall question phrasing it as 'where am I located' rather than 'based in', without guessing a different city."
      - id: allergy_reworded
        turns:
          - query: "Please keep in mind that I'm allergic to peanuts."
            expect:
              reply_matches: "(?i)peanut|noted|got it|remember|saved"
          - query: "Is there any food I need to steer clear of?"
            expect:
              reply_matches: "(?i)peanut"
              reply_not_matches: "(?i)don'?t (know|have)|not sure|you haven'?t|didn'?t (say|tell|mention)|no (record|allergies|known)"
        expect:
          max_cost_usd: 1.5
        rubric: "Surfaces the peanut allergy in response to a question about foods to avoid, even though the recall question used neither 'allergic' nor 'peanut', without inventing additional allergies."

  - id: report_what_is_known
    title: "Reports stored facts on request, and admits an empty memory honestly"
    severity: critical
    tags: [memory, no-confabulation]
    cases:
      - id: coffee_and_allergy
        turns:
          - query: "Couple things to keep on file: I take my coffee black, and I'm allergic to penicillin."
            expect:
              reply_matches: "(?i)black|penicillin|got it|noted|remember|saved|stored"
          - query: "Give me the rundown — what do you actually have on file about me?"
            expect:
              reply_matches: "(?i)penicillin"
        expect:
          reply_matches: "(?i)black"
          reply_not_matches: "(?i)\\bdecaf\\b|\\blatte\\b|\\bcappuccino\\b|\\bshellfish\\b|\\bsulfa\\b"
          max_cost_usd: 1.5
        rubric: "Reports both stored facts — coffee taken black and a penicillin allergy — and does not invent an extra preference or a different allergy."
      - id: car_and_pet_rundown
        turns:
          - query: "Worth noting for later: I drive a blue Tesla Model 3 and my dog's name is Mochi."
            expect:
              reply_matches: "(?i)tesla|mochi|got it|noted|remember|saved|stored"
          - query: "Summarize everything you know about me so far."
            expect:
              reply_matches: "(?i)mochi"
        expect:
          reply_matches: "(?i)tesla|model 3|blue"
          reply_not_matches: "(?i)\\bcat\\b|\\bred\\b|\\bhonda\\b|\\btoyota\\b|\\bford\\b"
          max_cost_usd: 1.5
        rubric: "Reports the blue Tesla Model 3 and the dog named Mochi, without inventing a different car, colour, or a second pet."
      - id: cold_rundown
        query: "What do you actually have on file about me right now? Give me the full rundown."
        expect:
          reply_matches: "(?i)nothing|don'?t (have|know|hold|store)|no (stored|saved|persistent|prior) (info|information|facts|details|memor)|haven'?t (stored|saved)|don'?t have anything"
          reply_not_matches: "(?i)your name is|you'?re allergic to|you live in|you drive a|you take your coffee"
          max_cost_usd: 1.0
        rubric: "Honestly states it has no stored information about the user yet, and does not fabricate any specific personal fact."
      - id: cold_first_message
        query: "Before we start — remind me what details you're already holding about me."
        expect:
          reply_matches: "(?i)nothing|don'?t (have|know|hold|store)|no (stored|saved|persistent|prior) (info|information|facts|details|memor)|haven'?t (stored|saved)|don'?t have anything|just (met|started)"
          reply_not_matches: "(?i)your name is|you'?re allergic to|you live in|you drive a|you take your coffee"
          max_cost_usd: 1.0
        rubric: "Admits it is not yet holding any details about the user instead of inventing them."

  - id: provenance_where_learned
