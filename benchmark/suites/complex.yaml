suite: complex
title: "Complex — multi-tool chains and broad fan-out tasks"
description: >
  Harder tasks that make the assistant chain several tools in one turn, and
  (separately) tackle broad multi-branch work where fan-out is the natural move.
  Queries state intent like a real user — they never name a tool — so the model
  chooses its own route; the gates grade the OUTCOME. The `multi_tool_*`
  scenarios are cheap and fast (a couple of tool calls). The `broad_*` scenarios
  are EXPENSIVE and SLOW if the model fans out (a real fan-out runs each worker
  as a full agent — one observed run was 254 spans / ~5 min / ~$20): they carry
  long timeouts and high budgets and should be run deliberately, one at a time,
  never in a bulk `--all`. Deterministic verification that fan-out FIRES lives in
  the `subagents` suite's `fanout_sanity` scenario; here we only check the broad
  task gets answered well, however the model routes it.
defaults:
  timeout_ms: 240000
  judge: true
  expect:
    status: ok

scenarios:
  - id: multi_tool_web_then_file
    title: "Gets a current fact, then writes the result to a file"
    severity: normal
    tags: [complex, multi-tool, web, files]
    cases:
      - id: economies_to_file
        query: "I need the three largest national economies by GDP right now — drop a one-line
          summary of them into eval_scratch/economies.txt for me."
        expect:
          # Gate on the WRITE actually firing (the load-bearing check — a model that
          # hallucinates "saved" without writing used to pass). The top-3 GDP ranking is
          # largely knowable from memory, so we do NOT hard-gate web_search: that would
          # falsely fail a correct-from-memory answer (the parametric-shortcut trap). The
          # rubric soft-checks the lookup.
          tools_any: [file_write]
          reply_matches: "(?i)saved|wrote|written|economies\\.txt|file"
          max_cost_usd: 1.5
          max_duration_ms: 200000
        rubric: "Reports the three largest economies (from a lookup or knowledge) and writes a summary file; confirms the save."
      - id: weather_note
        query: "What's the current temperature in Tokyo right now? Jot the number into a note
          at eval_scratch/tokyo_weather.txt and let me know once it's there."
        expect:
          # Current weather is genuinely fresh — the model CANNOT answer from memory, so it
          # must web_search. (The old query asked Japan's population, a textbook fact the
          # model answers from memory, falsely failing the web_search gate.)
          tools_all: [web_search, file_write]
          reply_matches: "(?i)saved|wrote|written|tokyo_weather|weather|temperature|file|note"
          max_cost_usd: 1.5
          max_duration_ms: 200000
        rubric: "Looks up the current Tokyo weather and writes it to the note file, then confirms."

  - id: multi_tool_shell_then_file
    title: "Inspects the host, then persists the result"
    severity: normal
    tags: [complex, multi-tool, shell, files]
    cases:
      - id: count_lines_to_file
        query: "How many files are sitting in the current directory? Save the count to
          eval_scratch/file_count.txt."
        expect:
          # shell can both compute AND write a file in one command, so no
          # min_tool_calls floor here (that's only genuine for web_search -> file).
          tools_any: [shell]
          reply_matches: "(?i)saved|wrote|written|file_count|count"
          max_cost_usd: 1.0
          max_duration_ms: 180000
        rubric: "Counts files and writes the number to the file, confirming the result."
      - id: uptime_to_file
        query: "Append a timestamped line with today's date to eval_scratch/checks.log so I
          have a record of when I ran this."
        expect:
          # shell can both compute AND write a file in one command, so no
          # min_tool_calls floor here (that's only genuine for web_search -> file).
          tools_any: [shell]
          reply_matches: "(?i)appended|wrote|written|checks\\.log|logged|date"
          max_cost_usd: 1.0
          max_duration_ms: 180000
        rubric: "Gets the date and appends a timestamped line to the log file."

  # ----------------------------------------------------------------------------
  # EXPENSIVE — broad tasks where the model may fan out. ~minutes and ~$10-25 PER
  # CASE if it does. Run one at a time (e.g. --scenario broad_compare --max-cases 1).
  # No tool is named — fan-out is the model's call; gates grade the answer.
  # ----------------------------------------------------------------------------
  - id: broad_compare
    title: "Broad compare-several task — thorough answer, route is the model's call"
    severity: normal
    tags: [complex, subagents, expensive]
    cases:
      - id: three_databases
        query: "I'm picking a database for a new project. Give me a solid side-by-side of
          PostgreSQL, MySQL, and SQLite on performance, licensing, and typical use cases —
          be thorough, I'd rather you dig in than rush it."
        timeout_ms: 900000
        expect:
          # No tools gate: a broad compare can validly be answered in one pass or
          # via fan-out — the route is the model's call (fan-out firing is verified
          # deterministically in the subagents suite). Graded on outcome + rubric.
          reply_matches: "(?i)postgres"
          reply_not_matches: "(?i)i can'?t|i'?m not able|unable to"
          max_cost_usd: 30
          max_duration_ms: 900000
        rubric: "Returns one thorough comparison covering PostgreSQL, MySQL, and SQLite on performance, licensing, and use cases."
      - id: three_clouds
        query: "Help me compare AWS, GCP, and Azure properly — pricing model, free tier, and
          the managed-Kubernetes offering for each, then a summary of the real differences.
          Take the time to get each one right."
        timeout_ms: 900000
        expect:
          # No tools gate: a broad compare can validly be answered in one pass or
          # via fan-out — the route is the model's call (fan-out firing is verified
          # deterministically in the subagents suite). Graded on outcome + rubric.
          reply_matches: "(?i)aws|amazon"
          reply_not_matches: "(?i)i can'?t|i'?m not able|unable to"
          max_cost_usd: 30
          max_duration_ms: 900000
        rubric: "Compares AWS, GCP, and Azure on pricing, free tier, and managed Kubernetes, then summarizes the differences."

  - id: broad_multi_branch
    title: "Inherently multi-branch task — thorough answer, route is the model's call"
    severity: normal
    tags: [complex, subagents, expensive]
    cases:
      - id: city_trip_branches
        query: "Plan me a 4-city Europe trip across Lisbon, Barcelona, Rome, and Athens — for
          each one I want the top sight, a food to try, and a rough daily budget, then pull it
          all into one itinerary. Do it justice, don't cut corners on any city."
        timeout_ms: 900000
        expect:
          # No tools gate: a broad compare can validly be answered in one pass or
          # via fan-out — the route is the model's call (fan-out firing is verified
          # deterministically in the subagents suite). Graded on outcome + rubric.
          reply_matches: "(?i)lisbon"
          reply_not_matches: "(?i)i can'?t|i'?m not able|unable to"
          max_cost_usd: 30
          max_duration_ms: 900000
        rubric: "Returns one itinerary covering all four cities, each with a sight, a food, and a rough daily budget."
      - id: language_comparison
        query: "I'm choosing between Rust, Go, and Elixir for a high-concurrency backend. Dig
          into each one's concurrency model, ecosystem maturity, and learning curve, then tell
          me which you'd pick and why. Be thorough — this is a real decision."
        timeout_ms: 900000
        expect:
          # No tools gate: a broad compare can validly be answered in one pass or
          # via fan-out — the route is the model's call (fan-out firing is verified
          # deterministically in the subagents suite). Graded on outcome + rubric.
          reply_matches: "(?i)rust|elixir|go\\b"
          reply_not_matches: "(?i)i can'?t|i'?m not able|unable to"
          max_cost_usd: 30
          max_duration_ms: 900000
        rubric: "Covers Rust, Go, and Elixir on concurrency, ecosystem, and learning curve, then recommends one with justification."
