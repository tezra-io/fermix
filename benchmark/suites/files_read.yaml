suite: files_read
risk: host_readonly
title: "Read-only filesystem — read, glob, and content search"
description: >
  Exercises the read-only filesystem tools (file_read, glob_search,
  content_search) against the repository under evaluation, the
  way the developer actually uses them: read a specific file and summarize it,
  find files by glob pattern, and grep the repo for a term. Sandbox roots are
  an explicit precondition. A denial is a capability failure rather than an
  acceptable answer. Each scenario asserts tools_any over the plausible read
  tools plus a reply_matches on the substance. The model may
  pick different valid routes (glob then read, or content_search alone), so
  tools_all / tools_in_order are avoided.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok
    no_tool_errors: true

scenarios:
  - id: read_and_summarize_file
    title: "Reads a named file and summarizes its contents"
    severity: normal
    tags: [files, read]
    cases:
      - id: claude_md_code_rules
        query: "Read __EVAL_REPO_ROOT__/CLAUDE.md and summarize the non-negotiable code rules for me."
        expect:
          tools_any: [file_read, content_search, glob_search]
          reply_matches: "(?is)(?=.*linear flow)(?=.*small function)(?=.*surgical)(?=.*fallback)"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Summarizes the actual code rules from CLAUDE.md, including linear flow, small functions, surgical changes, and no fallbacks."
      - id: read_telemetry_doc
        query: "Open __EVAL_REPO_ROOT__/docs/TELEMETRY_CONTRACT.md and tell me in a couple of sentences what it's about."
        expect:
          tools_any: [file_read, glob_search, content_search]
          reply_matches: "(?is)(?=.*telemetry)(?=.*trace)(?=.*session_id)(?=.*emitter)"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Summarizes the telemetry contract's shared emitters, session correlation, and Opik tracing from the document."
      - id: read_mix_exs
        query: "Read __EVAL_REPO_ROOT__/apps/fermix_core/mix.exs and tell me its Elixir version requirement."
        expect:
          tools_any: [file_read, content_search, glob_search]
          reply_matches: "(?i)~>\\s*1\\.17|1\\.17"
          max_cost_usd: 0.6
          max_duration_ms: 90000
        rubric: "Reports the ~> 1.17 Elixir requirement found in apps/fermix_core/mix.exs."

  - id: find_files_by_pattern
    title: "Finds source files by glob pattern"
    severity: normal
    tags: [files, glob]
    cases:
      - id: ex_files_mentioning_gateway
        query: "Find all the *.ex files under __EVAL_REPO_ROOT__/apps that mention Gateway, and list a few of them."
        expect:
          tools_any: [glob_search, content_search, file_read]
          reply_matches: "(?is)(?=.*gateway)(?=.*apps/)(?=.*\\.ex)"
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: "Lists real .ex files under apps/ that reference Gateway, grounded in the search results; a denial or invented path fails."
      - id: list_test_files
        query: "List the Elixir test files under __EVAL_REPO_ROOT__ — anything matching apps/**/test/**/*_test.exs would do."
        expect:
          tools_any: [glob_search, content_search, file_read]
          reply_matches: "(?is)(?=.*apps/)(?=.*/test/)(?=.*_test\\.exs)"
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: "Lists real *_test.exs files under apps/**/test from the glob results; a denial or fabricated path fails."
      - id: find_markdown_docs
        query: "What milestone design docs are under __EVAL_REPO_ROOT__/docs? List the markdown files that start with MILESTONE."
        expect:
          tools_any: [glob_search, content_search, file_read]
          reply_matches: "(?i)docs/MILESTONE[^\\s`]*\\.md"
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: "Returns real MILESTONE_*.md paths under docs/ from the glob results; a denial or invented document fails."

  - id: search_repo_for_term
    title: "Searches repo content for a term and reports where it is used"
    severity: normal
    tags: [files, search]
    cases:
      - id: hardline_usage
        query: "Search __EVAL_REPO_ROOT__ for the word 'hardline' and tell me where it's used."
        expect:
          tools_any: [content_search, glob_search, file_read]
          reply_matches: "(?is)(?=.*hardline)(?=.*sandbox)(?=.*\\.(?:ex|md))"
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: "Reports real files where hardline appears, including sandbox code or docs; a denial or invented location fails."
      - id: telemetry_execute_calls
        query: "Under __EVAL_REPO_ROOT__, where do we call :telemetry.execute with the [:fermix, :tool, :exec] event? Point me at the files."
        expect:
          tools_any: [content_search, glob_search, file_read]
          reply_matches: "(?is)(?=.*tools/telemetry\\.ex)(?=.*:fermix)(?=.*:tool)(?=.*:exec)"
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: "Identifies apps/fermix_core/lib/fermix_core/tools/telemetry.ex as the shared emitter for [:fermix, :tool, :exec]; a denial or fabricated call site fails."
      - id: count_saferm_mentions
        query: "Where does SafeRm appear under __EVAL_REPO_ROOT__, and what roles do those references play?"
        expect:
          tools_any: [content_search, glob_search, file_read]
          reply_matches: "(?is)(?=.*SafeRm)(?=.*test/support/safe_rm\\.ex)(?=.*(?:rm_rf|sandbox))"
          max_cost_usd: 1.0
          max_duration_ms: 120000
        rubric: "Identifies test/support/safe_rm.ex and grounded SafeRm references in tests/docs; a denial or invented match fails."
