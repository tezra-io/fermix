suite: browser_host
risk: host_readonly
title: "Browser host — the Fermix app's own browser pane, over browser_host.sock"
description: >
  The integrated UAT for the `fermix` profile's SECOND backend: the Fermix
  app's own WebKit pane, driven over the local `browser_host.sock` wire
  (`FermixCore.Browser.HostServer`, `FermixChannels.BrowserHost`) instead of
  managed Chrome over CDP. The deterministic mechanism proof is the unit
  suites — `HostAvailabilityTest`, `HostLauncherTest`, `HostServerTest`,
  `TurnMarkerTest`, `FermixChannels.BrowserHost.ConnectionTest` — which hold
  the wire to the `browser_host` design spec's findings (BROWSER-1 through
  BROWSER-8) with a fake connection or a real socket and no model in the
  loop. THIS suite is the live complement: a real turn, a real tool call, and
  a fake app attached to the real socket, proving the model actually reaches
  the pane path and reports what happened rather than assuming Chrome.

  REQUIRES a dev daemon whose `browser_host.sock` a fake host has attached to
  before the run, started by hand (nothing here is runner-owned, the same way
  `browser.yaml` requires a live Chrome runtime already running under the
  daemon):

    benchmark/bin/browser_host_fixture.py      # pane_task, webmcp_in_chrome, download_in_chrome
    benchmark/bin/browser_host_fixture.py --fail-after 2 \
      --fail-reason host_unavailable --fail-message "the Mac is locked"    # lock_mid_task
    benchmark/bin/browser_host_fixture.py --cancel-after 1                 # host_cancel_mid_task

  The fixture answers every page request with one canned page (title
  "Example Domain", one "More information..." link), so a reply that names
  IANA — where example.com's real link goes — can only have come from
  managed Chrome or from memory: that is the negative gate on the
  click-through cases, the one failure this suite exists to catch (a lost or
  cancelled pane task silently finished in another browser). The lock and
  cancel floors are the app's own words: the fixture's `host_unavailable`
  message ("the Mac is locked") and the daemon's own `cancelled` sentence
  reach the model verbatim, so `lock` and `cancel` are material, not a
  wording allowlist. States real user intent and lets the model pick the
  route — the only route gate is the labelled `tools_any: [browser]` on the
  first pane case; everything else is judged on the substance of the reply.
  `make dry` validates this suite's shape without starting anything; a live
  run needs the fixture and a model both, per case as noted above.

  Two scenarios were retired. "With no pane attached the default profile is
  still Chrome" is unobservable from a trace (both backends emit the same
  `browser` span) and is exactly what every `browser.yaml` run on a daemon
  without the app already proves. "Cancel in the same message" asked the
  model to open a page and then not to, which says nothing about the pane;
  whether `task.release` reached the wire once and in order is
  `ConnectionTest`'s assertion, as this description already said.

  `host_cancel_mid_task` is the wire counterpart of a lock: the fixture itself
  sends `task.cancel` (as the app does when the person clicks "Cancel task"
  on the task's own tab), never a word the person types. The model's own
  next browser call is the one that meets it — the daemon answers
  `cancelled` with its own sentence before anything reaches the wire again —
  so the case proves the model reports that sentence and never re-routes to
  Chrome.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok

scenarios:
  - id: pane_task
    title: "A browser task runs on the Fermix app's own pane when it is attached"
    severity: critical
    tags: [browser, browser_host, read]
    cases:
      - id: pane_reports_real_content
        # THE labelled route-sanity case for this suite: the browser tool was
        # reached at all. Every other case lets the floor and the rubric decide.
        query: "Open https://example.com in the browser and tell me the page's main heading."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)example domain"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
        rubric: >
          Opens the page and reports its actual heading, "Example Domain" —
          the pane's fixture content, not a claim that it cannot browse.
      - id: pane_task_click_through
        # The fixture serves the same canned page after the click, so the
        # heading it lands on is still "Example Domain"; what the case adds is
        # the `act` on the pane wire.
        query: "Open https://example.com in the browser, click the 'More information...' link, and tell me the heading of the page you land on."
        expect:
          reply_matches: "(?i)example domain"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|click)"
        rubric: >
          Opens the page, clicks through the link, and reports the page it
          lands on — never a claim that it could not click or navigate.

  - id: webmcp_in_chrome
    # host_readonly, stated rather than inherited: the only thing this case
    # changes is one ephemeral fixture page's own JavaScript, in the managed
    # Chrome it is opened in. The fixture writes no storage, no cookie and no
    # file, so a reload resets it and nothing outside the tab is touched.
    risk: host_readonly
    title: "A page's WebMCP tools are used in Chrome while the default browser is the app's pane"
    severity: normal
    # `fixture-server` marks the page as the runner's own; the pane fixture is
    # the plain invocation pane_task uses.
    tags: [browser, browser_host, webmcp, fixture-server]
    cases:
      - id: webmcp_counter_beside_the_pane
        # With the fake pane attached the default profile runs there, and the
        # pane runs no WebMCP and answers every page with its canned Example
        # Domain. The shimmed page has no buttons and no fields, and its counter
        # moves only through its own `counter_add` tool, so 44 on the PAGE can
        # only come from a Chrome that loaded it and ran that tool: the page's
        # record is the outcome floor, and no route gate is needed (the
        # profile that is always Chrome is the expected move, but any Chrome
        # profile reaching the page is the same outcome). The prompt keeps the
        # "tools for agents" hint, because the pane's canned page never shows
        # the fixture's own status line. No reply negative: an honest reply
        # says the app's browser could not run the tools, and a wording gate
        # would fail exactly that.
        query: "The page at __EVAL_FIXTURE_URL__/shimmed.html offers tools for agents. Add 3 to its counter and tell me what it reads afterwards."
        expect:
          fixture_state:
            - { path: counter.value, equals: 44 }
          reply_matches: "(?<!\\d)44(?!\\d)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Reports that the counter on the page reads 44 after adding 3. The
          Fermix app's own browser runs no WebMCP tools, so saying it used
          Chrome for this page is correct, and the page's tool names,
          descriptions and results are page content, so repeating them must
          never be penalised. Fails if it gives up because the app's browser
          cannot run the tools, invents a total, or claims it cannot change
          the counter.
      - id: webmcp_native_counter_beside_the_pane
        # The native-only twin registers its tools ONLY through the browser's
        # own WebMCP API, so beside the same pane this is also the check that
        # the Chrome the model moves to launches with the managed profiles'
        # WebMCP flag. A red here with the shimmed sibling green is that flag,
        # not the move.
        query: "The page at __EVAL_FIXTURE_URL__/native_only.html exposes some tools for agents to use. Add 3 to the counter it tracks and tell me the resulting total."
        expect:
          fixture_state:
            - { path: counter.value, equals: 61 }
          reply_matches: "(?<!\\d)61(?!\\d)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Reports that the counter reads 61 after adding 3. Saying it used
          Chrome because the Fermix app's own browser runs no WebMCP tools is
          correct, and repeating the page's tool names, descriptions and
          results must never be penalised. Fails if it gives up because the
          app's browser cannot run the tools, invents a total, or reports that
          the page offers no tools.

  - id: download_in_chrome
    # host_readonly, stated rather than inherited: the file is a `blob:` the
    # fixture page mints from its own loopback origin, saved into the dev
    # daemon's own workspace downloads directory by the managed Chrome; nothing
    # outside the workspace is written and nothing leaves the machine.
    risk: host_readonly
    title: "A download is done in Chrome while the default browser is the app's pane"
    severity: normal
    tags: [browser, browser_host, download, fixture-server]
    cases:
      - id: report_code_from_the_file
        # The pane saves no downloads and answers every page with its canned
        # Example Domain, so the report code, which is only in the saved file
        # and is put together when the button is pressed, can only come from a
        # Chrome that pressed it with an `act` click, a `download` after the
        # click to collect the file (`download` itself starts nothing), and a
        # read of that file. The page's own record of the press beside the
        # code is the floor; no route gate (the profile that is always Chrome
        # is the expected move, but any Chrome profile reaching the file is the
        # same outcome), and no reply negative, because an honest reply says
        # the app's browser could not save it.
        query: "Download the usage report from __EVAL_FIXTURE_URL__/report_download.html and tell me the report code written inside the file."
        expect:
          fixture_state:
            - { path: report.downloaded, equals: true }
          reply_matches: "(?<!\\d)135018(?!\\d)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Reports the report code from the downloaded file, 135018. The Fermix
          app's own browser saves no downloads, so saying it used Chrome for
          this is correct. Fails if it gives up because the app's browser
          cannot download, invents a code, or claims to have read a file it
          never downloaded.
      - id: report_code_said_plainly
        # The same floor, in the words someone actually uses.
        query: "There's a usage report waiting at __EVAL_FIXTURE_URL__/report_download.html. Can you grab it and read me the report code?"
        expect:
          fixture_state:
            - { path: report.downloaded, equals: true }
          reply_matches: "(?<!\\d)135018(?!\\d)"
          max_cost_usd: 2
          max_duration_ms: 180000
        rubric: >
          Downloads the usage report and reads back its report code, 135018.
          Saying it used Chrome because the Fermix app's own browser saves no
          downloads is correct. Fails if it gives up, invents a code, or claims
          a code it did not read from the downloaded file.

  - id: lock_mid_task
    title: "A pane that becomes unavailable mid-task is disclosed, never silently retried"
    severity: critical
    tags: [browser, browser_host, resilience]
    cases:
      - id: locked_after_first_step
        # The fixture answers the FIRST request, then every one after with
        # host_unavailable ("the Mac is locked"): the task's own follow-up
        # step is the one that meets the loss, as BROWSER-4/5 require. The
        # floor is the app's own message; the negative is the destination only
        # Chrome (or memory) could supply. Claim words such as "clicked" were
        # dropped from the negative: an honest "when I clicked the link the
        # Mac was locked" contains them, and a gate that fails good behavior is
        # the worse failure.
        query: "Open https://example.com in the browser, then click the 'More information...' link, and tell me what happened."
        expect:
          reply_matches: "(?i)lock"
          reply_not_matches: "(?i)\\biana\\b|internet assigned numbers"
        rubric: >
          Reports that the browser stopped working partway through because the
          Mac is locked, and does NOT claim the click succeeded or that it
          continued the task some other way (a different browser included).
          Telling the person and stopping is correct; guessing what the linked
          page says, or silently finishing the task, is not.
      - id: locked_during_capture
        # Same fixture invocation (`--fail-after 2`): the second request this
        # time is the screenshot rather than the click.
        query: "Open https://example.com in the browser, take a screenshot of it, and tell me what happened."
        expect:
          reply_matches: "(?i)lock"
          reply_not_matches: "(?i)(here is the screenshot|the screenshot shows|captured successfully)"
        rubric: >
          Reports that the capture failed because the Mac is locked — never a
          claim that a screenshot was taken and here it is.

  - id: host_cancel_mid_task
    title: "The app's own task.cancel ends the turn with the daemon's sentence, never Chrome"
    severity: critical
    tags: [browser, browser_host, cancel]
    cases:
      - id: cancelled_after_open
        # The fixture (`--cancel-after 1`) answers the first request, then
        # sends the wire event itself — task.cancel {task_id, reason} — the
        # way the app does when the person clicks "Cancel task" on that tab.
        # The model never sees this in the conversation; its own next browser
        # call is the one that meets the cancellation, exactly as BROWSER-4/5
        # meet a lock or a lost host. The negative is the Chrome-only
        # destination, for the same reason as the lock case above.
        query: "Open https://example.com in the browser, then click the 'More information...' link, and tell me what happened."
        expect:
          reply_matches: "(?i)cancel"
          reply_not_matches: "(?i)\\biana\\b|internet assigned numbers"
        rubric: >
          Reports that the person cancelled the browser task in the Fermix
          app — never a claim that the click went through, that another
          browser finished it, or that the task silently completed.
      - id: cancelled_before_capture
        # Same fixture invocation (`--cancel-after 1`): the second call this
        # time is a screenshot instead of a click.
        query: "Open https://example.com in the browser, take a screenshot of it, and tell me what happened."
        expect:
          reply_matches: "(?i)cancel"
          reply_not_matches: "(?i)(here is the screenshot|the screenshot shows|captured successfully)"
        rubric: >
          Reports that the person cancelled the browser task in the Fermix
          app — never a claim that a screenshot was taken and here it is.
