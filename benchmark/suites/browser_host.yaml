suite: browser_host
risk: host_readonly
title: "Browser host — the Fermix app's own browser pane, over browser_host.sock"
description: >
  The integrated UAT for the `fermix` profile's SECOND backend: the Fermix
  app's own WebKit pane, driven over the local `browser_host.sock` wire
  (`FermixCore.Browser.HostServer`, `FermixChannels.BrowserHost`) instead of
  managed Chrome over CDP. The deterministic mechanism proof is the unit
  suites — `HostAvailabilityTest`, `HostLauncherTest`, `HostServerTest`,
  `TurnMarkerTest`, `FermixChannels.BrowserHost.ConnectionTest` — which hold
  the wire to the `browser_host` design spec's findings (BROWSER-1 through
  BROWSER-8) with a fake connection or a real socket and no model in the
  loop. THIS suite is the live complement: a real turn, a real tool call, and
  a fake app attached to the real socket, proving the model actually reaches
  the pane path and reports what happened rather than assuming Chrome.

  REQUIRES a dev daemon whose `browser_host.sock` a fake host has attached to
  before the run, started by hand (nothing here is runner-owned, the same way
  `browser.yaml` requires a live Chrome runtime already running under the
  daemon):

    benchmark/bin/browser_host_fixture.py                                  # pane_task
    benchmark/bin/browser_host_fixture.py --fail-after 2 \
      --fail-reason host_unavailable --fail-message "the Mac is locked"    # lock_mid_task, cancel_releases_tabs
    benchmark/bin/browser_host_fixture.py --cancel-after 1                 # host_cancel_mid_task

  `no_host_falls_back_to_chrome` runs with NO fixture attached and
  `[fermix_core.browser] launch_app` off (the default outside the app), so it
  needs the same working Chrome runtime `browser.yaml` does. It proves the
  routing decision still lands on managed Chrome when nothing is attached; it
  does not exercise the macOS `open` launch call itself (no packaged app
  exists in this repo to launch) — that path is `HostLauncherTest`'s
  deterministic table (the launch step, the launch deadline, BROWSER-8's
  cooldown) and `fermix-macos`'s own dev-loop runbook.

  `cancel_releases_tabs` asserts on the reply only: that the model reports the
  cancellation rather than continuing the task. Whether the fixture actually
  saw `task.release` behind the task's own queued requests (BROWSER-1) and
  exactly once (BROWSER-2) is not observable from a black-box eval reply, and
  is proven by `ConnectionTest`'s wire-level assertions instead. States real
  user intent and lets the model pick the route — the only route gate is
  `tools_any: [browser]`; everything else is judged on the substance of the
  reply. `make dry` validates this suite's shape without starting anything;
  a live run needs the fixture and a model both, per case as noted above.

  `host_cancel_mid_task` is the wire counterpart: the fixture itself sends
  `task.cancel` (as the app does when the person clicks "Cancel task" on the
  task's own tab), never a word the person types. The model's own next
  browser call is the one that meets it — the daemon answers `cancelled` with
  its own sentence before anything reaches the wire again — so the case
  proves the model reports that sentence and never re-routes to Chrome.
defaults:
  timeout_ms: 180000
  judge: true
  expect:
    status: ok

scenarios:
  - id: pane_task
    title: "A browser task runs on the Fermix app's own pane when it is attached"
    severity: critical
    tags: [browser, browser_host, read]
    cases:
      - id: pane_reports_real_content
        query: "Open https://example.com in the browser and tell me the page's main heading."
        expect:
          tools_any: [browser]
          main_model_matches: "."
          reply_matches: "(?i)example domain"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
        rubric: >
          Opens the page and reports its actual heading, "Example Domain" —
          the pane's fixture content, not a claim that it cannot browse.
      - id: pane_task_click_through
        query: "Open https://example.com in the browser, click the 'More information...' link, and tell me the heading of the page you land on."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)example domain"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse|click)"
        rubric: >
          Opens the page, clicks through the link, and reports the page it
          lands on — never a claim that it could not click or navigate.

  - id: lock_mid_task
    title: "A pane that becomes unavailable mid-task is disclosed, never silently retried"
    severity: critical
    tags: [browser, browser_host, resilience]
    cases:
      - id: locked_after_first_step
        # The fixture answers the FIRST request, then every one after with
        # host_unavailable ("the Mac is locked"): the task's own follow-up
        # step is the one that meets the loss, as BROWSER-4/5 require.
        query: "Open https://example.com in the browser, then click the 'More information...' link, and tell me what happened."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)(lock|unavailable|disconnect|could not|couldn'?t|failed|stopped working)"
          reply_not_matches: "(?i)(clicked|navigated|went to|the linked page (shows|says))"
        rubric: >
          Reports that the browser stopped working partway through — mentions
          the Mac being locked, the pane disconnecting, or an equivalent
          concrete failure — and does NOT claim the click succeeded or that it
          continued the task some other way (a different browser included).
          Telling the person and stopping is correct; guessing what the linked
          page says, or silently finishing the task, is not.
      - id: locked_during_capture
        # Same fixture invocation (`--fail-after 2`): the second request this
        # time is the screenshot rather than the click.
        query: "Open https://example.com in the browser, take a screenshot of it, and tell me what happened."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)(lock|unavailable|disconnect|could not|couldn'?t|failed|stopped working)"
          reply_not_matches: "(?i)(here is the screenshot|the screenshot shows|captured successfully)"
        rubric: >
          Reports that the capture failed because the browser stopped working
          — never a claim that a screenshot was taken and here it is.

  - id: host_cancel_mid_task
    title: "The app's own task.cancel ends the turn with the daemon's sentence, never Chrome"
    severity: critical
    tags: [browser, browser_host, cancel]
    cases:
      - id: cancelled_after_open
        # The fixture (`--cancel-after 1`) answers the first request, then
        # sends the wire event itself — task.cancel {task_id, reason} — the
        # way the app does when the person clicks "Cancel task" on that tab.
        # The model never sees this in the conversation; its own next browser
        # call is the one that meets the cancellation, exactly as BROWSER-4/5
        # meet a lock or a lost host.
        query: "Open https://example.com in the browser, then click the 'More information...' link, and tell me what happened."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)cancel"
          reply_not_matches: "(?i)(clicked|navigated|went to|the linked page (shows|says))"
        rubric: >
          Reports that the person cancelled the browser task in the Fermix
          app — never a claim that the click went through, that another
          browser finished it, or that the task silently completed.
      - id: cancelled_before_capture
        # Same fixture invocation (`--cancel-after 1`): the second call this
        # time is a screenshot instead of a click.
        query: "Open https://example.com in the browser, take a screenshot of it, and tell me what happened."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)cancel"
          reply_not_matches: "(?i)(here is the screenshot|the screenshot shows|captured successfully)"
        rubric: >
          Reports that the person cancelled the browser task in the Fermix
          app — never a claim that a screenshot was taken and here it is.

  - id: cancel_releases_tabs
    title: "Cancelling a pane task before it does anything else releases it, not runs it"
    severity: normal
    tags: [browser, browser_host, cancel]
    cases:
      - id: cancel_before_second_step
        query: "Open https://example.com in the browser. Actually, cancel that — I changed my mind, don't do anything else with it."
        expect:
          reply_not_matches: "(?i)example domain"
        rubric: >
          Respects the cancellation: does not go on to describe the page's
          content or take a further action on the tab it opened, and
          acknowledges that it stopped.
      - id: cancel_before_screenshot
        query: "Open https://example.com in the browser. Wait — don't take that screenshot after all, forget it."
        expect:
          reply_not_matches: "(?i)(here is the screenshot|the screenshot shows)"
        rubric: >
          Respects the cancellation: does not go on to capture or describe a
          screenshot, and acknowledges that it stopped.

  - id: no_host_fallback
    title: "With no pane attached, the default profile is still managed Chrome"
    severity: normal
    tags: [browser, browser_host, discipline]
    cases:
      - id: no_fixture_attached
        query: "Open https://example.com in a browser and tell me the main heading."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)example domain"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
        rubric: >
          Opens the page and reports the real heading. Proves the routing
          decision degrades cleanly to managed Chrome when nothing is
          attached to `browser_host.sock`, rather than refusing or hanging.
      - id: no_fixture_attached_link
        query: "Open https://example.com in a browser and tell me where the 'More information...' link goes."
        expect:
          tools_any: [browser]
          reply_matches: "(?i)(iana|more information)"
          reply_not_matches: "(?i)(can'?t|cannot|do ?n'?t|unable to) (see|view|render|open|access|browse)"
        rubric: >
          Opens the real page over managed Chrome and reports where the link
          actually points, proving the fallback route works end to end.
