name: ci

on:
  pull_request:
    branches: [main, dev, "release/**"]
  push:
    branches: [main, dev, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One leg per shipped-and-executed platform (M22 T0): the release builds
    # macos_aarch64 / macos_x86_64 / linux_aarch64 / linux_x86_64, and before
    # this matrix only linux_x86_64 ever ran the suite. The `gate` job below
    # aggregates these legs so legs can be renamed/added/removed without
    # touching branch protection — but only once protection actually requires
    # `gate`. See the note on that job for what is required today.
    name: compile · format · credo · test (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-x64 also stresses the change's test files, so it needs the
          # history to diff against and the time to repeat them.
          - { os: ubuntu-24.04, leg: linux-x64, timeout: 45, fetch_depth: 0 }
          - { os: ubuntu-24.04-arm, leg: linux-arm64, timeout: 30, fetch_depth: 1 }
          - { os: macos-15, leg: macos-arm64, timeout: 45, fetch_depth: 1 }
          - { os: macos-15-intel, leg: macos-x64, timeout: 45, fetch_depth: 1 }
    env:
      MIX_ENV: test
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: ${{ matrix.fetch_depth }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-test-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-test-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Fetch deps
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Apple Maps helper (macOS)
        # `mix compile` above built `fermix-maps` through apps/fermix_nif's
        # Makefile, as the app-engine release build does. This compiles it again
        # with the flags written here, kept in lockstep with MAPS_SWIFTFLAGS, so
        # loosening the Makefile's (dropping -warnings-as-errors, or raising the
        # macOS 15 deployment target past the app's floor) fails this leg, then
        # self-checks the build mix made. Its fixture requests run in the test
        # step (Tools.PlaceSearch.HelperTest); the live MapKit search is opt-in
        # (`--only mapkit_live`) and never runs in CI.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          swiftc --version
          swiftc -O -swift-version 5 -warnings-as-errors -target "$(uname -m)-apple-macos15.0" \
            apps/fermix_nif/swift_src/fermix_maps.swift -o "${RUNNER_TEMP}/fermix-maps"
          helper=_build/test/lib/fermix_nif/priv/fermix-maps
          if [ ! -x "$helper" ]; then
            echo "::error title=Apple Maps helper missing::mix compile built no ${helper}"
            exit 1
          fi
          file "$helper"
          "$helper" --check

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Test
        id: test
        # `mix compile --warnings-as-errors` above covers lib/ only; warnings
        # raised while loading the .exs suite (a drifted test double, an
        # unimplemented behaviour callback) reach no gate without the flag here.
        # The script tees the output to mix-test.log, which keeps the ExUnit
        # banner: seed and max_cases are the two facts every ordering
        # investigation starts from. When at most five tests fail and nothing
        # else is wrong, it reruns only those tests once, per app; tests that
        # pass then are flagged "Flaky test" (annotation, job summary,
        # flaky-tests.json) and the leg passes. `scripts/ci/flaky_report.py`
        # counts the flags across runs: fix anything flagged twice.
        run: >-
          uv run scripts/ci/mix_test_retry.py
          --log "${RUNNER_TEMP}/mix-test.log"
          --flaky-json "${RUNNER_TEMP}/flaky-tests.json"

      - name: Stress the change's test files under load
        # A flaky test usually passes the change that wrote it and fails an
        # unrelated PR a month later. Repeating the change's own test files
        # with every core busy makes the change that wrote it the one that
        # sees it. See AGENTS.md, Tests under load.
        # No run starts after --budget-s, and a later run starts only when its
        # app's previous run would still end inside it. 720 s of the 15-minute
        # timeout leaves 3 minutes for uv's start, the burners' stop and the
        # overrun of the last run started, which the budget never cuts short.
        # Raise the two together.
        if: matrix.leg == 'linux-x64'
        timeout-minutes: 15
        env:
          STRESS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          uv run scripts/ci/stress_changed_tests.py
          --base "${STRESS_BASE}"
          --budget-s 720
          --log-dir "${RUNNER_TEMP}/stress"

      - name: Upload flaky-test evidence
        if: success() && steps.test.outputs.flaky == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flaky-tests-${{ matrix.leg }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/flaky-tests.json
            ${{ runner.temp }}/mix-test*.log
          retention-days: 30
          if-no-files-found: error

      - name: Record failure evidence
        if: failure()
        run: |
          set -uo pipefail
          {
            echo "leg: ${{ matrix.leg }} (${{ matrix.os }})"
            echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "arch: ${RUNNER_ARCH:-unknown}"
            echo "elixir: ${{ env.ELIXIR_VERSION }}  otp: ${{ env.OTP_VERSION }}"
            echo "workflow sha: ${{ github.sha }}"
            echo "pr head sha: ${{ github.event.pull_request.head.sha }}"
            echo "checked out: $(git rev-parse HEAD)"
            echo "run attempt: ${{ github.run_attempt }}"
            grep -E "Running ExUnit with seed" "${RUNNER_TEMP}/mix-test.log" 2>/dev/null \
              || echo "seed: not reached (failed before the test step)"
          } > "${RUNNER_TEMP}/ci-evidence.txt"
          cat "${RUNNER_TEMP}/ci-evidence.txt"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-${{ matrix.leg }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-evidence.txt
            ${{ runner.temp }}/mix-test*.log
            ${{ runner.temp }}/stress/*.log
          retention-days: 14
          if-no-files-found: warn

  checksum-integrity:
    # The baked checksums are the trust root for everything Fermix downloads
    # at runtime (plugin tarballs, the compux Computer Use sidecar). Runtime
    # verifies installs against them; this job verifies THEM against the
    # actually-published assets, so a republished/tampered/mispinned artifact
    # fails the PR instead of surfacing as a user-facing install error.
    name: catalog + compux checksum integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify plugin catalog sha256s against published assets
        run: |
          set -euo pipefail
          fail=0
          while IFS=$'\t' read -r name version url sha; do
            if ! curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "$url" -o /tmp/artifact; then
              echo "::error title=Catalog artifact unreachable::$name@$version $url"
              fail=1
              continue
            fi
            actual=$(sha256sum /tmp/artifact | awk '{print $1}')
            if [ "$actual" != "$sha" ]; then
              echo "::error title=Catalog checksum mismatch::$name@$version expected=$sha actual=$actual ($url)"
              fail=1
            else
              echo "ok: $name@$version"
            fi
          done < <(jq -r '.plugins[] | .name as $n | .versions[] | .version as $v | .artifacts[] | [$n, $v, .url, .sha256] | @tsv' apps/fermix_core/priv/plugins/index.json)
          exit "$fail"

      - name: Verify compux checksum map against its published release
        run: |
          set -euo pipefail
          ref=$(grep '"compux"' mix.lock | grep -oE '[a-f0-9]{40}' | head -1)
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/tezra-io/compux/$ref/checksum-compux.exs" -o /tmp/checksum-compux.exs
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/tezra-io/compux/$ref/mix.exs" -o /tmp/compux-mix.exs
          version=$(grep -oE '@version "[0-9.]+"' /tmp/compux-mix.exs | grep -oE '[0-9.]+')
          fail=0
          found=0
          while read -r target sha; do
            found=1
            # Artifact extension mirrors Compux.Binary.artifact_name/2: a zipped
            # .app on macOS (its code signature must survive), a bare-binary
            # tarball elsewhere.
            case "$target" in
              macos-*) ext="zip" ;;
              *) ext="tar.gz" ;;
            esac
            url="https://github.com/tezra-io/compux/releases/download/v${version}/compux-${version}-${target}.${ext}"
            if ! curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 "$url" -o /tmp/compux-artifact; then
              echo "::error title=compux artifact unreachable::$target $url"
              fail=1
              continue
            fi
            actual=$(sha256sum /tmp/compux-artifact | awk '{print $1}')
            if [ "$actual" != "$sha" ]; then
              echo "::error title=compux checksum mismatch::$target expected=$sha actual=$actual"
              fail=1
            else
              echo "ok: compux $target v$version"
            fi
          done < <(grep -oE '"[a-z0-9_-]+" => "[a-f0-9]{64}"' /tmp/checksum-compux.exs | sed -E 's/"([^"]+)" => "([^"]+)"/\1 \2/')
          if [ "$found" = 0 ]; then
            echo "::error title=Empty compux checksum map::the pinned ref ships no checksums — Computer Use cannot install"
            fail=1
          fi
          exit "$fail"

  harness:
    # The python eval harness under benchmark/ gates nothing today: ci.yml runs
    # no python, and the only tracked hook is Elixir-only. Its ~420 hermetic
    # specs and the suite validator therefore only ever ran by hand, so harness
    # regressions surfaced first in a scheduled eval run against a live daemon.
    # Both targets are offline: no secrets, no daemon, no network, no FERMIX_HOME.
    # Deliberately no `paths:` filter — the aggregate gate treats a skipped leg
    # as red, so a filtered-out run would wedge the required check.
    name: benchmark harness tests + suite validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Harness developer tests
        run: make -C benchmark tests
      - name: Validate behavioral suites (no spend)
        run: make -C benchmark dry

  release-scripts:
    name: release script contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Run hermetic release tests
        run: for t in scripts/release/test_*.py; do echo "== $t =="; uv run "$t" || exit 1; done
      - name: Run hermetic CI script tests
        run: for t in scripts/ci/test_*.py; do echo "== $t =="; uv run "$t" || exit 1; done

  disclaim-shim:
    # The macOS disclaim exec shim ships inside release payloads, cross-compiled
    # by `zig cc` under strict flags — while dev macOS builds use the lenient
    # host cc. That split already shipped one release-only C break (the v0.6.0
    # NIF), so compile the shim here with the release-exact zig flags on every
    # push. Keep the flags in lockstep with DISCLAIM_CFLAGS in
    # apps/fermix_nif/Makefile and ZIG_VERSION with release.yml.
    name: disclaim shim cross-compile (release zig flags)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.15.2"
      - name: Cross-compile for both macOS targets
        run: |
          set -euo pipefail
          for target in aarch64-macos x86_64-macos; do
            zig cc -target "$target" -std=c99 -O2 -Wall -Wextra -Werror \
              apps/fermix_nif/c_src/fermix_disclaim.c -o "${RUNNER_TEMP}/disclaim_${target}"
            echo "built ${target}"
          done

  # Aggregate gate: one stable check name (`compile · format · credo · test`),
  # green iff every job it needs passed, decoupled from the OS-matrix leg names.
  # `if: always()` so a failed/skipped matrix still produces a definitive RED
  # here rather than a skipped required check that would itself wedge the merge.
  #
  # This job gates nothing until branch protection requires IT. As of
  # 2026-09-12 `main` required the three leg contexts directly — linux-x64,
  # linux-arm64, macos-arm64 — so macos-x64, checksum-integrity, harness,
  # release-scripts and disclaim-shim were all advisory, and `dev` required
  # nothing at all. Point protection at this one context on both branches, or
  # this job documents an intent the repository does not enforce.
  gate:
    name: compile · format · credo · test
    runs-on: ubuntu-24.04
    needs: [check, checksum-integrity, harness, release-scripts, disclaim-shim]
    if: always()
    steps:
      - name: Require every matrix leg to have passed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          CHECKSUM_RESULT: ${{ needs.checksum-integrity.result }}
          HARNESS_RESULT: ${{ needs.harness.result }}
          RELEASE_SCRIPTS_RESULT: ${{ needs.release-scripts.result }}
          DISCLAIM_RESULT: ${{ needs.disclaim-shim.result }}
        run: |
          echo "check (matrix) result: $CHECK_RESULT"
          echo "checksum-integrity result: $CHECKSUM_RESULT"
          echo "harness result: $HARNESS_RESULT"
          echo "release-scripts result: $RELEASE_SCRIPTS_RESULT"
          echo "disclaim-shim result: $DISCLAIM_RESULT"
          [ "$CHECK_RESULT" = "success" ] || exit 1
          [ "$CHECKSUM_RESULT" = "success" ] || exit 1
          [ "$HARNESS_RESULT" = "success" ] || exit 1
          [ "$RELEASE_SCRIPTS_RESULT" = "success" ] || exit 1
          [ "$DISCLAIM_RESULT" = "success" ] || exit 1
