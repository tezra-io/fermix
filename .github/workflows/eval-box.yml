# The reusable disposable eval box (Milestone 22 §3.2): one recipe owns the
# box anatomy — Comet-hosted Opik over its API (operator decision 2026-07-18,
# replacing the in-box docker stack), seeded disposable FERMIX_HOME, daemon
# boot with bounded readiness, tier dispatch, report artifacts. Thin callers
# (eval-nightly / eval-weekly) own only cadence and tier selection.
#
# Secrets never reach PR-triggered workflows: this runs only via workflow_call
# from scheduled callers or manual workflow_dispatch.
name: eval-box

on:
  workflow_call:
    inputs:
      tier:
        description: "regression | capability | dangerous"
        required: true
        type: string
      ref:
        description: "Git ref to evaluate (schedules run off main; dev is the active branch)"
        type: string
        default: dev
      model:
        description: "Candidate Anthropic model, run at medium effort — must differ from judge.model in benchmark/config.yaml and behavioral_config.yaml"
        type: string
        default: claude-opus-5-5
    secrets:
      # The candidate daemon's provider key (Anthropic); the judged tiers' Claude
      # judge reads the same key through its SDK.
      ANTHROPIC_API_KEY:
        required: true
      FERMIX_OPIK_API_KEY:
        required: true
      FERMIX_OPIK_WORKSPACE:
        required: true
    outputs:
      exit_code:
        # The TIER RUNNER's own exit code, not the job's status. The callers
        # classify on it (3 = preconditions, 4 = measurement invalid, 5 = valid but
        # the release gate is red) and cannot see it any other way: a caller's
        # `needs.<job>.outputs` reads only what `on.workflow_call.outputs` declares.
        # Each tier step gets the code intact because it runs benchmark/bin/tier.sh,
        # which execs the runner; `make` would report every outcome as 2. When a
        # tier runs more than one step, benchmark/bin/tier_exit_code.sh decides
        # which of their codes this output carries.
        description: "Exit code of the tier's runner (empty if the tier never ran)"
        value: ${{ jobs.box.outputs.exit_code }}
  workflow_dispatch:
    inputs:
      tier:
        description: "Eval tier"
        required: true
        type: choice
        options: [regression, capability, dangerous]
      ref:
        description: "Git ref to evaluate"
        type: string
        default: dev
      model:
        description: "Candidate Anthropic model, run at medium effort — must differ from judge.model in benchmark/config.yaml and behavioral_config.yaml"
        type: string
        default: claude-opus-5-5

# No `permissions` here or on the job: the box inherits its caller's token, so only
# the job that runs the capability tier (eval-weekly's) grants id-token: write, for
# the Workload Identity Federation sign-in its Claude Code needs. The judge needs
# none (it is Claude's, on an API key), so the regression and dangerous tiers never
# hold the right to mint GitHub OIDC tokens. A direct dispatch gets the
# repository's default token, which must stay read-only (Settings > Actions >
# General > Workflow permissions; read-only as of 2026-10-13), and the sign-in step
# refuses it with a sentence: run the capability tier on demand through
# eval-weekly.

concurrency:
  group: eval-box
  cancel-in-progress: false

jobs:
  box:
    name: eval-box (${{ inputs.tier }})
    runs-on: ubuntu-24.04
    outputs:
      # Chosen by benchmark/bin/tier_exit_code.sh in the step of that name: the
      # code of the tier step that failed, and 0 only when every step that ran
      # exited 0. This was a `||` chain over the four steps until a capability
      # run proved it wrong — `||` yields the first TRUTHY operand and the string
      # "0" is truthy, so the green deterministic axis published "0" and the
      # judged axis's 5 (release gate RED) never left the job.
      exit_code: ${{ steps.tier_exit_code.outputs.exit_code }}
    # Per-tier runaway backstop (M22 §3.2): a hung regression must not burn
    # capability-sized wall-clock/tokens.
    timeout-minutes: ${{ inputs.tier == 'capability' && 180 || inputs.tier == 'regression' && 60 || 30 }}
    env:
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28"
      TIER: ${{ inputs.tier }}
      # The daemon under test: Anthropic's provider on the `model` input, at this
      # reasoning effort (seeded as the provider block's reasoning_effort in the eval
      # home's config.toml; the Anthropic adapter sends it as output_config.effort).
      CANDIDATE_MODEL: ${{ inputs.model }}
      CANDIDATE_REASONING_EFFORT: medium
      OPIK_PROJECT: fermix-eval-ci-${{ inputs.tier }}
      # Comet-hosted Opik: the exporter writes to /opik/api, the harness reads
      # /opik/api/v1/private — same host, different base paths. Auth comes from
      # the FERMIX_OPIK_* secrets on the steps that need it.
      OPIK_BASE_URL: https://www.comet.com/opik/api/v1/private
      OPIK_UI_BASE: https://www.comet.com/opik
      # The Workload Identity Federation profile the capability tier's Claude Code
      # signs in through (written by the sign-in step, read by Claude Code).
      WIF_PROFILE: fermix-eval
    steps:
      - name: Resolve the disposable eval home
        # Absolute with no '..' (upload-artifact@v4 rejects parent-relative
        # patterns), outside the checkout (the dangerous-tier rsync must never
        # find its target inside the source tree), leaf contains 'eval'
        # (seeder + harness guards). runner.temp is unavailable in job-level
        # env, hence a step writing GITHUB_ENV.
        run: echo "EVAL_HOME=$RUNNER_TEMP/fermix-eval-ci" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: astral-sh/setup-uv@v5

      - name: Cache deps and _build (dev env — distinct from the test-env CI cache)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-dev-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-dev-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Restore capability leaderboard
        if: inputs.tier == 'capability'
        uses: actions/cache/restore@v4
        with:
          path: benchmark/reports/capability/leaderboard.json
          key: capability-leaderboard-${{ github.run_id }}
          restore-keys: |
            capability-leaderboard-

      - name: Fetch deps
        run: mix deps.get

      # Every JUDGED tier (regression, capability) grades replies with the Claude
      # judge on claude-haiku-5-5 (`judge:` in behavioral_config.yaml and
      # config.yaml; benchmark/bin/evallib/judge.py). Its SDK reads ANTHROPIC_API_KEY,
      # which this step and the judged tier steps hold from the ANTHROPIC_API_KEY
      # repository secret: the candidate daemon runs on the same key, so one
      # provider-side spend cap bounds both.
      #
      # The preflight is one real verdict on a canned case through the judge's own
      # code (bin/judge_preflight.py) with the judge settings the tier's runner
      # loads, before anything else is spent: the configured model must answer
      # through the secret (--expect-source; never a profile on the box), and a
      # judge on the candidate's model is refused before any call. It costs a
      # fraction of a cent per run.
      - name: Prove the judge answers (judged tiers)
        id: judge_preflight
        if: inputs.tier == 'regression' || inputs.tier == 'capability'
        working-directory: benchmark
        env:
          # run_eval.py (regression) loads behavioral_config.yaml; run_capability.py
          # (capability) loads config.yaml.
          JUDGE_CONFIG: ${{ inputs.tier == 'regression' && 'behavioral_config.yaml' || 'config.yaml' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            fail "The repository secret ANTHROPIC_API_KEY is empty: the $TIER tier's judge (the anthropic backend in benchmark/$JUDGE_CONFIG) reads it, as does the daemon under test. Set it under Settings > Secrets and variables > Actions > Secrets."
          fi
          if ! preflight="$(uv run bin/judge_preflight.py --config "$JUDGE_CONFIG" \
                              --candidate-model "$CANDIDATE_MODEL" \
                              --expect-source ANTHROPIC_API_KEY 2>&1)"; then
            fail "The judge preflight failed: $(printf '%s' "$preflight" | tail -n 3 | tr '\n' ' ')"
          fi
          printf '%s\n' "$preflight"

      # The capability tier's delegated coding tasks run Claude Code, which signs in
      # through Workload Identity Federation: a run gets no Anthropic key
      # (Harness.Run spawns claude under `env -i` with HOME, PATH, TERM and USER
      # only; the `bare` exception is in the next step), so the federation settings
      # live where claude finds them from HOME alone: an `oidc_federation` profile
      # in ~/.config/anthropic, the documented default configuration directory,
      # made active by its `active_config` file and naming an identity-token file.
      # The IDs are not secrets and come from repository variables;
      # ANTHROPIC_EVAL_WORKSPACE_ID may stay empty while the federation rule covers
      # a single workspace.
      #
      # The identity token is this job's GitHub OIDC token. GitHub's expire about
      # five minutes after issue and each can be exchanged only once (its `jti`).
      # Every exchange re-reads the file, so a background loop replaces it every
      # WIF_REFRESH_SECONDS, atomically, for at most WIF_REFRESH_MAX rounds (longer
      # than the capability tier's timeout). The step "Stop the Anthropic
      # identity-token refresher" ends it and fails the job if any refresh failed.
      # The token file sits under RUNNER_TEMP, outside the checkout, the eval home
      # and the uploaded artifact, and goes with the VM. The Claude Code step below
      # proves the sign-in with one real call.
      - name: Sign in to Anthropic through Workload Identity Federation (capability tier)
        id: wif_sign_in
        if: inputs.tier == 'capability'
        env:
          WIF_REFRESH_SECONDS: "60"
          WIF_REFRESH_MAX: "200"
          ANTHROPIC_EVAL_ORGANIZATION_ID: ${{ vars.ANTHROPIC_EVAL_ORGANIZATION_ID }}
          ANTHROPIC_EVAL_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_EVAL_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_EVAL_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_EVAL_FEDERATION_RULE_ID }}
          ANTHROPIC_EVAL_WORKSPACE_ID: ${{ vars.ANTHROPIC_EVAL_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          for name in ANTHROPIC_EVAL_ORGANIZATION_ID ANTHROPIC_EVAL_SERVICE_ACCOUNT_ID \
                      ANTHROPIC_EVAL_FEDERATION_RULE_ID; do
            if [ -z "${!name:-}" ]; then
              fail "The repository variable $name is empty: the capability tier's Claude Code signs in to Anthropic through Workload Identity Federation. Set it under Settings > Secrets and variables > Actions > Variables."
            fi
          done
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            fail "This job cannot request a GitHub OIDC token: the job that calls eval-box.yml must grant 'id-token: write' (eval-weekly's capability job does; a direct eval-box dispatch cannot, so run the capability tier through eval-weekly)."
          fi

          wif_dir="$RUNNER_TEMP/anthropic-wif"
          jwt="$wif_dir/github-oidc.jwt"
          anthropic_dir="$HOME/.config/anthropic"
          (umask 077 && mkdir -p "$wif_dir" "$anthropic_dir/configs")
          jq -n --arg rule "$ANTHROPIC_EVAL_FEDERATION_RULE_ID" \
                --arg account "$ANTHROPIC_EVAL_SERVICE_ACCOUNT_ID" \
                --arg org "$ANTHROPIC_EVAL_ORGANIZATION_ID" \
                --arg workspace "${ANTHROPIC_EVAL_WORKSPACE_ID:-}" \
                --arg token "$jwt" '
            {version: "1.0",
             authentication: {type: "oidc_federation", federation_rule_id: $rule,
                              service_account_id: $account,
                              identity_token: {source: "file", path: $token}},
             organization_id: $org}
            + (if $workspace == "" then {} else {workspace_id: $workspace} end)' \
            > "$anthropic_dir/configs/$WIF_PROFILE.json"
          printf '%s\n' "$WIF_PROFILE" > "$anthropic_dir/active_config"

          # The job's OIDC request credential never reaches a command line or an
          # environment another process can read (/proc/<pid>/cmdline and
          # /proc/<pid>/environ): curl takes the header on stdin, and the refresher
          # below gets the credential on a file descriptor into a shell variable.
          oidc_request_token="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          oidc_request_url="$ACTIONS_ID_TOKEN_REQUEST_URL"

          # A fresh GitHub OIDC token, written beside the target and renamed over it
          # so no reader ever sees half a token. Prints nothing it fetched.
          fetch_jwt() {
            local tmp
            tmp="$(mktemp "$wif_dir/github-oidc.XXXXXX")"
            if printf 'Authorization: Bearer %s\n' "$oidc_request_token" \
                 | curl -fsS --retry 3 --max-time 30 -H @- \
                     "$oidc_request_url&audience=https://api.anthropic.com" \
                 | jq -er '.value' > "$tmp" \
               && grep -Eqx '[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' "$tmp"; then
              mv -f "$tmp" "$jwt"
              return 0
            fi
            rm -f "$tmp"
            return 1
          }
          if ! fetch_jwt; then
            fail "Could not fetch a GitHub OIDC token for the audience https://api.anthropic.com."
          fi

          refresh_loop() {
            local round
            for ((round = 1; round <= WIF_REFRESH_MAX; round++)); do
              sleep "$WIF_REFRESH_SECONDS"
              if fetch_jwt; then
                echo "$(date -u +%FT%TZ) refreshed"
              else
                echo "$(date -u +%FT%TZ) refresh FAILED"
              fi
            done
            echo "$(date -u +%FT%TZ) stopped at the cap of $WIF_REFRESH_MAX refreshes"
          }
          # The loop outlives this step beside every process the candidate drives,
          # so it starts from a wiped environment holding only what it needs; the
          # request credential arrives on fd 3 and lives only in a shell variable.
          env -i PATH="$PATH" HOME="$HOME" wif_dir="$wif_dir" jwt="$jwt" \
            oidc_request_url="$oidc_request_url" \
            WIF_REFRESH_SECONDS="$WIF_REFRESH_SECONDS" WIF_REFRESH_MAX="$WIF_REFRESH_MAX" \
            bash -c "set -uo pipefail; $(declare -f fetch_jwt refresh_loop)
              IFS= read -r oidc_request_token <&3; exec 3<&-
              refresh_loop" \
            3<<< "$oidc_request_token" < /dev/null >> "$wif_dir/refresher.log" 2>&1 &
          echo "$!" > "$wif_dir/refresher.pid"
          disown
          echo "The capability tier's Claude Code signs in to Anthropic through the $WIF_PROFILE federation profile."

      # The coding-harness tasks (suites/capability/harness.yaml) delegate to a
      # vendor CLI, and the daemon advertises `claude_code_run` only when `claude`
      # is on its PATH at boot, so this finishes before the daemon starts. A GitHub
      # runner ships no vendor CLI; without this step the runner holds those tasks
      # out as NOT EVALUATED and the release gate is red for that alone.
      #
      # Signed in and on the pinned model, or the tier stops here. A claude that
      # is installed but cannot authenticate is worse than none: the daemon
      # advertises `claude_code_run`, every delegated run fails, and the tasks
      # score 0.00 as the candidate's failure.
      #
      # It signs in through the federation profile the step above wrote and the
      # identity token its refresher keeps fresh.
      #
      # A run the candidate starts with `bare: true` reads only ANTHROPIC_API_KEY
      # (bare mode reads no profile and no federation settings), and the claude
      # adapter passes that name through from the daemon's own environment, which
      # holds the candidate's Anthropic key: such a run authenticates with, and is
      # billed to, the candidate's key instead of this profile.
      #
      # The model is pinned in ~/.claude/settings.json, with self-updates off; a
      # `model` the candidate passes to claude_code_run still overrides the pin.
      #
      # Pinned: one release's native linux-x64 binary, its sha256 copied from that
      # release's manifest.json, whose detached signature verifies against the
      # Claude Code release signing key (31DD DE24 DDFA B679 F42D 7BD2 BAA9 29FF
      # 1A7E CACE). Bump the two together.
      #
      # The preflight runs under the same wiped environment a harness run gets, so
      # it proves what a run will meet: `claude auth status` must name the
      # federation profile, and one real call must succeed on the pinned model with
      # no API key in play. That call costs well under a cent per weekly run, and
      # it may spend the identity token in the file, so the step then waits (at
      # most WIF_ROTATION_WAIT_SECONDS) for the refresher's next rotation before
      # any harness run can need an exchange.
      - name: Install Claude Code and prove its sign-in (capability tier)
        id: claude_code
        if: inputs.tier == 'capability'
        env:
          CLAUDE_CODE_VERSION: "2.1.296"
          CLAUDE_CODE_SHA256: 24972e3bc859fab2b46ed4c1e51f7d6130f06d3bd550811a114640de3370d0de
          CLAUDE_MODEL: claude-haiku-5-5
          WIF_ROTATION_WAIT_SECONDS: "150"
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          wif_dir="$RUNNER_TEMP/anthropic-wif"
          if [ ! -s "$wif_dir/refresher.pid" ]; then
            fail "The Anthropic federation sign-in did not finish, so Claude Code has no identity token to exchange."
          fi
          arch="$(uname -m)"
          if [ "$arch" != "x86_64" ]; then
            fail "The pinned Claude Code binary is built for x86_64; this runner is $arch."
          fi

          install_dir="$RUNNER_TEMP/claude-code-$CLAUDE_CODE_VERSION/bin"
          claude="$install_dir/claude"
          download="$RUNNER_TEMP/claude-code-$CLAUDE_CODE_VERSION.download"
          curl -fsSL --retry 3 -o "$download" \
            "https://downloads.claude.ai/claude-code-releases/$CLAUDE_CODE_VERSION/linux-x64/claude"
          actual="$(sha256sum "$download" | cut -d' ' -f1)"
          if [ "$actual" != "$CLAUDE_CODE_SHA256" ]; then
            rm -f "$download"
            fail "Claude Code $CLAUDE_CODE_VERSION binary checksum mismatch: expected $CLAUDE_CODE_SHA256, got $actual."
          fi
          mkdir -p "$install_dir"
          install -m 0755 "$download" "$claude"
          rm -f "$download"
          "$claude" --version

          # Claude Code's user config: the model under test, and no self-updates.
          mkdir -p "$HOME/.claude"
          jq -n --arg model "$CLAUDE_MODEL" \
            '{model: $model, env: {DISABLE_AUTOUPDATER: "1", DISABLE_UPDATES: "1"}}' \
            > "$HOME/.claude/settings.json"

          # What a harness run gets: the daemon's HOME and PATH, TERM and USER, nothing else.
          run_env=(env -i HOME="$HOME" PATH="$install_dir:$PATH"
                   TERM=xterm-256color USER="$(id -un)")
          # Which credential claude selects (network-free).
          if ! source_line="$("${run_env[@]}" "$claude" auth status --text 2>&1)"; then
            fail "claude finds no credential in the environment a harness run gets: $source_line"
          fi
          case "$source_line" in
            *oidc_federation*"profile $WIF_PROFILE"*) ;;
            *) fail "claude selects a credential other than the $WIF_PROFILE federation profile: $source_line" ;;
          esac
          # One real call, in the output mode the claude adapter renders, from an
          # empty directory so no project settings apply.
          probe_dir="$RUNNER_TEMP/claude-code-preflight"
          events="$probe_dir/events.jsonl"
          mkdir -p "$probe_dir"
          call_status=0
          (cd "$probe_dir" && "${run_env[@]}" "$claude" -p --output-format stream-json --verbose \
             --max-turns 1 -- 'Reply with the single word OK.') \
            < /dev/null > "$events" 2> "$probe_dir/stderr.log" || call_status=$?
          from_events() { jq -Rrn "[inputs | fromjson?] | $1" "$events"; }
          is_error="$(from_events 'map(select(.type == "result")) | last | .is_error | tostring')"
          reply="$(from_events 'map(select(.type == "result")) | last | .result // "no result event"')"
          key_source="$(from_events 'map(select(.type == "system" and .subtype == "init")) | first | .apiKeySource // "missing"')"
          session_model="$(from_events 'map(select(.type == "system" and .subtype == "init")) | first | .model // "missing"')"
          used_models="$(from_events 'map(select(.type == "result")) | last | .modelUsage // {} | keys | join(",")')"
          if [ "$call_status" -ne 0 ] || [ "$is_error" != "false" ]; then
            fail "The preflight call failed in the environment a harness run gets (exit $call_status): $reply $(tail -n 3 "$probe_dir/stderr.log" | tr '\n' ' ')"
          fi
          if [ "$key_source" != "none" ]; then
            fail "The preflight call authenticated with an API key (apiKeySource: $key_source), not the $WIF_PROFILE federation profile."
          fi
          if [ "$session_model" != "$CLAUDE_MODEL" ] || [ "$used_models" != "$CLAUDE_MODEL" ]; then
            fail "The preflight call ran on '$used_models' (session model '$session_model'), not the pinned $CLAUDE_MODEL."
          fi

          # The call may have spent the token in the file. Wait for one rotation
          # that starts after the call ended, so the first delegated run finds an
          # unspent token.
          refreshes() { grep -c ' refreshed$' "$wif_dir/refresher.log" || true; }
          spent_at="$(refreshes)"
          deadline=$((SECONDS + WIF_ROTATION_WAIT_SECONDS))
          until [ "$(refreshes)" -gt "$spent_at" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              fail "The identity-token refresher did not replace the token within ${WIF_ROTATION_WAIT_SECONDS}s of the Claude Code preflight, so the first delegated run could find it spent: read $wif_dir/refresher.log."
            fi
            sleep 1
          done
          echo "Claude Code $CLAUDE_CODE_VERSION signs in through the $WIF_PROFILE federation profile and answers on $CLAUDE_MODEL."
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Seed the disposable home and boot the daemon
        env:
          # The candidate's provider key: the daemon reads it at boot
          # (config/runtime.exs) and nothing writes it to disk. The judge's steps
          # hold the same key; no other provider's key is here.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FERMIX_CAP_HOME: ${{ env.EVAL_HOME }}
          FERMIX_CAP_PROJECT: ${{ env.OPIK_PROJECT }}
          # The daemon exporter's hosted-Opik config (fermix_opik reads these
          # at boot; capability-daemon.sh passes the parent env through).
          FERMIX_OPIK_BASE_URL: https://www.comet.com/opik/api
          FERMIX_OPIK_API_KEY: ${{ secrets.FERMIX_OPIK_API_KEY }}
          FERMIX_OPIK_WORKSPACE: ${{ secrets.FERMIX_OPIK_WORKSPACE }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::The repository secret ANTHROPIC_API_KEY is empty: the daemon under test runs on Anthropic ($CANDIDATE_MODEL at $CANDIDATE_REASONING_EFFORT effort) and reads its key from it at boot. Set it under Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          # The job's OIDC request credential (id-token: write) belongs to the Anthropic
          # sign-in step; the daemon and every process it spawns go without it.
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          # Checker trials may commit inside the eval workspace; give git an identity.
          git config --global user.name "fermix-eval-box"
          git config --global user.email "eval-box@localhost"
          mkdir -p "$EVAL_HOME"
          seed_args="--provider anthropic --model ${CANDIDATE_MODEL} --reasoning-effort ${CANDIDATE_REASONING_EFFORT}"
          case "$TIER" in
            regression)
              # Behavioral repo-read cases expand __EVAL_REPO_ROOT__ to this
              # checkout; host-readonly profiles skip the strict-sandbox check,
              # so the checkout may sit in allowed_roots here (and only here).
              seed_args="$seed_args --allow-root $GITHUB_WORKSPACE"
              ;;
            dangerous)
              # run_eval's strict-profile preflight requires the disposable
              # workspace to be a git snapshot at the SAME HEAD as this harness
              # checkout (workspace_revision_error). actions/checkout is shallow,
              # which git refuses to clone from — rsync the tree instead
              # (.git included; _build/deps are gitignored so the tree stays clean).
              rsync -a --exclude _build --exclude deps "$GITHUB_WORKSPACE/" "$EVAL_HOME/workspace/"
              ;;
          esac
          FERMIX_CAP_SEED_ARGS="$seed_args" benchmark/bin/capability-daemon.sh up

      - name: Tier — regression (host-safe-core, judged)
        id: regression
        if: inputs.tier == 'regression'
        working-directory: benchmark
        env:
          FERMIX_EVAL_HOME: ${{ env.EVAL_HOME }}
          OPIK_API_KEY: ${{ secrets.FERMIX_OPIK_API_KEY }}
          OPIK_WORKSPACE: ${{ secrets.FERMIX_OPIK_WORKSPACE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          uv run bin/run_eval.py --check --judge
          make dry
          # Publish the RUNNER's exit code before failing the step on it. bin/tier.sh
          # execs run_eval.py so the code survives; `make regression` would report
          # every outcome as 2 and the callers have no other source. `|| rc=$?` keeps
          # `set -e` from ending the step first.
          rc=0
          bin/tier.sh regression || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      # The two capability axes are independent run_capability.py processes and
      # are kept in separate steps on purpose: folded into one `run:` under
      # `set -euo pipefail`, a transient judge fault in the judged axis discarded
      # an already-complete, already-paid deterministic sweep and skipped the
      # leaderboard save (observed 2026-07-25: 110 turns / $5.78 disowned).
      - name: Tier — capability (deterministic composite)
        id: capability_deterministic
        if: inputs.tier == 'capability'
        working-directory: benchmark
        env:
          FERMIX_EVAL_HOME: ${{ env.EVAL_HOME }}
          OPIK_API_KEY: ${{ secrets.FERMIX_OPIK_API_KEY }}
          OPIK_WORKSPACE: ${{ secrets.FERMIX_OPIK_WORKSPACE }}
          # True by construction on this box: the runner VM and the seeded
          # FERMIX_HOME exist only for this run; no channels are configured;
          # the sandbox is strict and home-scoped (M22 §3.2).
          CONFIRM_DAEMON_ISOLATED: "1"
          CONFIRM_ISOLATED_ENV: "1"
          CONFIRM_COST: "1"
        run: |
          set -euo pipefail
          # Pre-checks spend nothing and are classified only as pass/fail, so make
          # is fine for them; the tier itself goes through tier.sh, which execs
          # run_capability.py and keeps 3/4/5 distinct all the way to the callers.
          make check
          make estimate
          rc=0
          bin/tier.sh capability || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Tier — capability (judged axis)
        id: capability_judged
        if: ${{ !cancelled() && inputs.tier == 'capability' }}
        working-directory: benchmark
        env:
          FERMIX_EVAL_HOME: ${{ env.EVAL_HOME }}
          OPIK_API_KEY: ${{ secrets.FERMIX_OPIK_API_KEY }}
          OPIK_WORKSPACE: ${{ secrets.FERMIX_OPIK_WORKSPACE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # tier.sh, not make: the judged axis publishes its runner's code too.
          rc=0
          bin/tier.sh capability-judged || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Tier — dangerous (sandbox_verify on a disposable box)
        id: dangerous
        if: inputs.tier == 'dangerous'
        working-directory: benchmark
        env:
          FERMIX_EVAL_HOME: ${{ env.EVAL_HOME }}
          OPIK_API_KEY: ${{ secrets.FERMIX_OPIK_API_KEY }}
          OPIK_WORKSPACE: ${{ secrets.FERMIX_OPIK_WORKSPACE }}
          # The D5 guard: only a disposable, throwaway environment may run the
          # dangerous suites. This box qualifies by construction.
          FERMIX_EVAL_DISPOSABLE: "1"
        run: |
          set -euo pipefail
          uv run bin/run_eval.py --check
          rc=0
          uv run bin/run_eval.py --dangerous --suite sandbox_verify \
            --scenario assistant_refuses_hardline_shell --profile destructive \
            --confirm-daemon-isolated --confirm-isolated-env --confirm-private-data || rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Publish the deciding tier exit code
        id: tier_exit_code
        # Its whole job is to report a FAILING tier's code, so it has to outlive
        # the step that failed: an `if:` without a status function implicitly
        # ANDs success(). A cancelled run publishes nothing, which is exactly
        # what the callers classify as "produced no evidence".
        if: ${{ !cancelled() }}
        working-directory: benchmark
        env:
          # <outcome>:<code> per step. The outcome is what separates a step that
          # never ran from one that FAILED before its runner published — the
          # second decided the run and has no code, and must not be spoken for
          # by a later step's.
          REGRESSION: ${{ steps.regression.outcome }}:${{ steps.regression.outputs.exit_code }}
          CAPABILITY_DETERMINISTIC: ${{ steps.capability_deterministic.outcome }}:${{ steps.capability_deterministic.outputs.exit_code }}
          CAPABILITY_JUDGED: ${{ steps.capability_judged.outcome }}:${{ steps.capability_judged.outputs.exit_code }}
          DANGEROUS: ${{ steps.dangerous.outcome }}:${{ steps.dangerous.outputs.exit_code }}
        run: |
          set -euo pipefail
          # Named in the order the steps ran: that order is the precedence rule.
          # A plain assignment propagates the script's status, so an unusable set
          # of codes fails this step instead of publishing a guess.
          code="$(bin/tier_exit_code.sh \
            regression="$REGRESSION" \
            capability_deterministic="$CAPABILITY_DETERMINISTIC" \
            capability_judged="$CAPABILITY_JUDGED" \
            dangerous="$DANGEROUS")"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Save capability leaderboard
        # Keyed to the deterministic axis, which is what writes the board — a
        # judged-axis failure must not throw away a sweep that completed.
        #
        # Exit 5 is "measurement valid and RECORDED, release gate red": the row is
        # already on disk when the runner returns, and the step still fails under
        # `set -e`. Keying on the step's outcome therefore discarded exactly the
        # rows the next weekly restore needs. `!cancelled()` is required because an
        # `if:` without a status function implicitly ANDs `success()`, which would
        # skip this step the moment the tier step failed.
        if: ${{ !cancelled() && inputs.tier == 'capability'
                && (steps.capability_deterministic.outcome == 'success'
                    || steps.capability_deterministic.outputs.exit_code == '5') }}
        uses: actions/cache/save@v4
        with:
          path: benchmark/reports/capability/leaderboard.json
          key: capability-leaderboard-${{ github.run_id }}

      - name: Daemon down
        if: always()
        env:
          FERMIX_CAP_HOME: ${{ env.EVAL_HOME }}
        run: benchmark/bin/capability-daemon.sh down

      - name: Stop the Anthropic identity-token refresher
        # After the daemon is down, so no delegated run can still need a fresh
        # identity token; `always()` so a failed tier step does not leave it running.
        if: ${{ always() && inputs.tier == 'capability' }}
        run: |
          set -euo pipefail
          wif_dir="$RUNNER_TEMP/anthropic-wif"
          if [ ! -f "$wif_dir/refresher.pid" ]; then
            echo "No token refresher was started: the Anthropic sign-in step did not finish."
            exit 0
          fi
          pid="$(cat "$wif_dir/refresher.pid")"
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          fi
          counts="$(awk '/ refreshed$/ {r++} / refresh FAILED$/ {f++} END {print r + 0, f + 0}' "$wif_dir/refresher.log")"
          read -r refreshed failed <<<"$counts"
          echo "Identity-token refresher: $refreshed refreshed, $failed failed."
          if [ "$failed" -gt 0 ]; then
            grep -v ' refreshed$' "$wif_dir/refresher.log"
            echo "::error::$failed identity-token refreshes failed during the $TIER tier, so a delegated claude_code_run may have failed to authenticate: read this run's cap_harness scores as a possible environment failure, not the candidate's."
            exit 1
          fi

      - name: Daemon log tail (failure diagnostics)
        if: failure()
        run: tail -n 200 "${{ env.EVAL_HOME }}/daemon.log" || true

      - name: Upload reports and daemon log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.tier }}-${{ github.run_number }}
          path: |
            benchmark/reports/
            ${{ env.EVAL_HOME }}/daemon.log
          if-no-files-found: warn
          retention-days: 30
