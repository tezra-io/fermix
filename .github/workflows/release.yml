name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build, sign, and publish
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28"
      ZIG_VERSION: "0.15.2"
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches mix.exs version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mix_version="$(awk -F '"' '/^      version:/ { print $2; exit }' mix.exs)"
          tag_version="${TAG_NAME#v}"
          if [ "$mix_version" != "$tag_version" ]; then
            echo "::error::Tag $TAG_NAME (=> $tag_version) does not match mix.exs version $mix_version. Bump mix.exs and re-tag."
            exit 1
          fi
          echo "Releasing v$mix_version"

      - name: Assemble release notes from CHANGELOG
        # Curated notes come from the version's CHANGELOG.md section, not from
        # auto-generated commit/PR titles. Runs before the build so a missing
        # CHANGELOG entry fails fast (extract_changelog.sh exits non-zero) rather
        # than after a 10-minute build.
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          {
            printf '## What'\''s new in %s\n\n' "$TAG_NAME"
            ./scripts/release/extract_changelog.sh "$version" CHANGELOG.md
            printf '\n'
            sed "s|__REPO__|${REPO}|g" scripts/release/signing_footer.md
          } > RELEASE_NOTES.md
          echo '----- assembled RELEASE_NOTES.md -----'
          cat RELEASE_NOTES.md

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install xz, jq
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils jq

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Fetch deps
        run: mix deps.get

      - name: Build and digest assets
        run: |
          set -euo pipefail
          mix assets.setup
          mix assets.deploy

      - name: Build all Burrito targets
        run: mix release fermix --overwrite

      - name: Sign and hash binaries
        working-directory: burrito_out
        run: |
          set -euo pipefail
          for bin in fermix_*; do
            case "$bin" in *.sig|*.pem|*.sha256) continue ;; esac
            cosign sign-blob --yes \
              --output-signature "${bin}.sig" \
              --output-certificate "${bin}.pem" \
              "$bin"
            sha256sum "$bin" > "${bin}.sha256"
          done
          ls -la

      - name: Generate releases.json
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: ./scripts/release/build_releases_json.sh > burrito_out/releases.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          # Pre-release tags (those carrying a SemVer pre-release segment, e.g.
          # v0.3.0-beta) publish as a GitHub pre-release so they are never marked
          # "Latest". Stable tags (v0.3.0) have no '-' and publish normally.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Curated notes assembled from the CHANGELOG section + signing footer.
          body_path: RELEASE_NOTES.md
          files: |
            burrito_out/fermix_*
            burrito_out/releases.json

      - name: Bump Homebrew tap
        # Only stable releases bump the tap. A pre-release tag (v*-beta/-rc/...)
        # must never promote itself to the formula that all `brew` users install.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set - skipping Homebrew tap bump"
            exit 0
          fi
          tap_dir="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/tezra-io/homebrew-tap.git" "$tap_dir"
          RELEASES_JSON="$PWD/burrito_out/releases.json" FORMULA="$tap_dir/Formula/fermix.rb" scripts/homebrew/bump.sh
          git -C "$tap_dir" config user.name "github-actions[bot]"
          git -C "$tap_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$tap_dir" add Formula/fermix.rb
          if git -C "$tap_dir" diff --cached --quiet; then
            echo "tap formula already current; nothing to push"
            exit 0
          fi
          git -C "$tap_dir" commit -m "fermix ${VERSION#v}"
          git -C "$tap_dir" push

  verify:
    # M22 T5: prove the artifacts users actually download — signature verifies
    # keyless against this workflow's OIDC identity, and the binary executes on
    # every shipped-and-runnable platform. Downloads the PUBLISHED assets, never
    # a rebuild.
    name: verify published artifacts (${{ matrix.target }})
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux_x86_64 }
          - { os: ubuntu-24.04-arm, target: linux_aarch64 }
          - { os: macos-15, target: macos_aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release download "$TAG_NAME" \
            --repo "${{ github.repository }}" \
            --pattern "fermix_${{ matrix.target }}*"
          ls -la

      - name: Verify keyless signature against the published blob
        run: |
          cosign verify-blob \
            --certificate "fermix_${{ matrix.target }}.pem" \
            --signature "fermix_${{ matrix.target }}.sig" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/release.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "fermix_${{ matrix.target }}"

      - name: Run the shipped binary
        env:
          FERMIX_HOME: ${{ runner.temp }}/fermix-verify-home
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x "fermix_${{ matrix.target }}"
          out=$("./fermix_${{ matrix.target }}" --version)
          echo "$out"
          tag="$TAG_NAME"
          case "$out" in
            *"${tag#v}"*) echo "version matches tag" ;;
            *) echo "::error::--version output does not contain ${tag#v}"; exit 1 ;;
          esac

      - name: Verify the Homebrew formula serves this release (stable tags)
        if: matrix.os == 'macos-15' && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          brew tap tezra-io/tap
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 12); do
            stable=$(brew info --json=v2 tezra-io/tap/fermix 2>/dev/null \
              | jq -r '.formulae[0].versions.stable // empty')
            if [ "$stable" = "$version" ]; then break; fi
            sleep 10
            brew update >/dev/null 2>&1 || true
          done
          brew install tezra-io/tap/fermix
          fermix --version | grep -F "$version"
