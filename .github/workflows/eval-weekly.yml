# Weekly eval (Milestone 22 T2a + T2b): full capability benchmark on a
# disposable box, then the dangerous tier — sandbox_verify, the safety gate of
# record for hardline-shaped shell requests. Any tier that fails files (or
# updates) a GitHub issue via the shared `alert` job; the dangerous tier is
# labelled critical.
#
# Schedules execute the workflow file on the DEFAULT branch (main); dev is
# checked out explicitly inside the box.
name: eval-weekly

on:
  schedule:
    - cron: "23 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read

# No workflow-level concurrency here: the reusable eval-box declares the
# `eval-box` group itself, and a caller sharing its callee's group collides
# with its own still-running run (the documented reusable-workflow footgun).

jobs:
  capability:
    uses: ./.github/workflows/eval-box.yml
    with:
      tier: capability
      ref: dev
    secrets: inherit

  dangerous:
    # Runs even if the capability tier went red — the safety signal is
    # independent of capability drift. Only a cancelled run skips it.
    needs: capability
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/eval-box.yml
    with:
      tier: dangerous
      ref: dev
    secrets: inherit

  alert:
    name: file an issue for any tier that failed or left no evidence
    needs: [capability, dangerous]
    # always(), not !cancelled(): a cancelled, evicted or skipped tier is the
    # ABSENCE of evidence, and absence used to file nothing at all — a green-looking
    # week in which nothing ran is the one outcome CI must never hide.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
        with:
          script: |
            // What went wrong decides WHICH issue is filed, because the fixes differ:
            // a red release gate is a real, recorded result; exit 3/4 means no valid
            // measurement exists; a cancelled or skipped tier means the run never
            // produced evidence at all. The exit code is the tier RUNNER's own, which
            // eval-box.yml captures per tier step and publishes as `exit_code` — a
            // caller cannot read it from the job status, because `make` collapses every
            // runner outcome to 2.
            const needs = JSON.parse(process.env.NEEDS);
            // Only the capability runner defines 5, and its 3/4 causes differ from the
            // behavioral runner's, so the explanation is keyed on the tier.
            const CAPABILITY_TIERS = new Set(["capability"]);
            const KINDS = {
              no_run: {
                title: "produced no evidence",
                line: () => "The tier was **cancelled or skipped**, so it produced no evidence — this is an absent result, not a passing one.",
              },
              no_measurement: {
                title: "has no valid measurement",
                line: (job) => CAPABILITY_TIERS.has(job)
                  ? "The capability runner exited 3/4: preconditions failed, or the measurement was **invalid** (missing trace evidence, a usage limit, invalidated auth, a checker/evaluator failure, or more than one route). No leaderboard row was written."
                  : "The behavioral runner exited 3/4: preconditions failed, or required cases were skipped and the evidence was **INCOMPLETE**. `run_eval.py` never exits 5.",
              },
              gate_red: {
                title: "release gate is red",
                line: () => [
                  "The sweep was **valid and recorded** (exit 5): the measurement is sound and the leaderboard row was written. Exit 5 is a RELEASE decision, not a capability regression.",
                  "",
                  "Read the gate reason in the run report FIRST. The shipped capability sweep declares no safety gate, so the gate reports **\"release gate: safety not evaluated (no capability case declares a safety gate)\"** — a deliberate fail-closed posture pending a separate safety pack, and nothing to do with the candidate. Only a `pass@1` / `pass^k` reason is a score problem.",
                ].join("\n"),
              },
              failing: {
                title: "is failing",
                line: () => "The tier failed.",
              },
            };
            const classify = (result, exit) => {
              if (result === "cancelled" || result === "skipped") return "no_run";
              if (result !== "failure") return null;
              if (exit === "3" || exit === "4") return "no_measurement";
              if (exit === "5") return "gate_red";
              return "failing";
            };
            const flagged = Object.entries(needs)
              .map(([job, r]) => [job, classify(r.result, (r.outputs || {}).exit_code)])
              .filter(([, kind]) => kind !== null);
            if (flagged.length === 0) return;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            for (const [job, kind] of flagged) {
              const critical = job === "dangerous";
              // One tier owns ONE running issue. The title used to vary by kind, so a
              // persistently-red tier that changed failure mode accumulated up to four
              // open issues and the de-dupe comment landed on none of them.
              const prefix = `${process.env.WORKFLOW}: the ${job} tier`;
              const title = `${prefix} ${KINDS[kind].title}`;
              const existing = open.find((i) => i.title.startsWith(prefix) && !i.pull_request);
              if (existing) {
                // De-dupe: a persistently-red tier updates one running issue
                // instead of filing a new one every run.
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Still red (${kind}) — ${KINDS[kind].line(job)}\n\n${runUrl}`,
                });
                continue;
              }
              const body = [
                `The **${job}** tier in \`${process.env.WORKFLOW}\`: ${KINDS[kind].line(job)}`,
                critical
                  ? "\n**Critical** — `sandbox_verify` is the safety gate of record for hardline-shaped shell requests."
                  : "",
                `\nRun: ${runUrl}`,
                "\nWhile this issue stays open, further occurrences add a comment instead of a new issue. Close it once the tier is green again.",
              ].join("\n");
              const created = await github.rest.issues.create({ owner, repo, title, body });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: created.data.number,
                labels: critical ? ["eval-failure", "critical"] : ["eval-failure"],
              });
            }
