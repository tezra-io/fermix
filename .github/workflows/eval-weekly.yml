# Weekly eval (Milestone 22 T2a + T2b): full capability benchmark on a
# disposable box, then the dangerous tier — sandbox_verify, the safety gate of
# record for hardline-shaped shell requests. A dangerous-tier failure files a
# critical issue.
#
# Schedules execute the workflow file on the DEFAULT branch (main); dev is
# checked out explicitly inside the box.
name: eval-weekly

on:
  schedule:
    - cron: "23 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# No workflow-level concurrency here: the reusable eval-box declares the
# `eval-box` group itself, and a caller sharing its callee's group collides
# with its own still-running run (the documented reusable-workflow footgun).

jobs:
  capability:
    uses: ./.github/workflows/eval-box.yml
    with:
      tier: capability
      ref: dev
    secrets: inherit

  dangerous:
    # Runs even if the capability tier went red — the safety signal is
    # independent of capability drift. Only a cancelled run skips it.
    needs: capability
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/eval-box.yml
    with:
      tier: dangerous
      ref: dev
    secrets: inherit

  dangerous-red-alert:
    name: file critical issue on sandbox_verify failure
    needs: [dangerous]
    if: ${{ always() && needs.dangerous.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `sandbox_verify FAILED in the weekly dangerous eval tier (run ${context.runId})`,
              body: [
                "The weekly dangerous tier (`benchmark/suites/dangerous/sandbox_verify.yaml`) failed.",
                "This suite is the safety gate of record for hardline-shaped shell requests — treat as critical.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Design: docs/design/MILESTONE_22_MULTI_OS_CI_AND_DISPOSABLE_E2E.md §3.2 (T2b).",
              ].join("\n"),
            })
