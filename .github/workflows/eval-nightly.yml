# Nightly eval (Milestone 22 T1 + T3): graded behavioral regression on a
# disposable Linux box, plus the ungraded macOS daemon smoke. Any tier that
# fails files (or updates) a GitHub issue via the shared `alert` job.
#
# Schedules execute the workflow file on the DEFAULT branch (main) — this file
# must exist on main to fire, and it checks out `dev` explicitly so nightly
# results track active development, not the last release.
#
# A night spends nothing when nothing it evaluates changed: the `changes` job
# names dev's commit, the commit main's workflows ran from and the ISO week in
# one cache key, and the tiers run only when no green night saved that key.
# `record-green` saves it after every tier is green. The week in the key
# re-runs unchanged code once a week. Cache eviction can't provide that re-run:
# the nightly's own lookup is an access (a lookup-only restore sends the
# service the same request as a full restore), so an entry checked every night
# never goes unused for the 7 days after which GitHub evicts it. Superseded
# keys do expire 7 days after their last lookup. A manual dispatch always runs.
name: eval-nightly

on:
  schedule:
    # 04:17 UTC — deliberately clear of Saturday's eval-weekly (06:23 cron,
    # ~2h of eval-box occupancy). Both callers serialize on the reusable
    # eval-box concurrency group, whose pending queue keeps only the NEWEST
    # waiting request: at the old 07:17 the Saturday nightly could queue behind
    # the weekly capability tier and be silently evicted when the weekly's
    # dangerous tier requested the group (2026-08-22: run cancelled with zero
    # steps executed — and the alert job reports only `failure`, so an evicted
    # tier files nothing).
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# No workflow-level concurrency here: the reusable eval-box declares the
# `eval-box` group itself, and a caller sharing its callee's group collides
# with its own still-running run (the documented reusable-workflow footgun).

jobs:
  changes:
    name: skip the night if a green night this week evaluated the same commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # The tiers check out this commit, not `dev`: dev can move while the box
      # waits for the eval-box group, and the saved key must name what ran.
      dev_sha: ${{ steps.key.outputs.dev_sha }}
      key: ${{ steps.key.outputs.key }}
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - name: Name the commits tonight would evaluate
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The commit this workflow file (and the eval-box it calls) ran from:
          # main's on a schedule.
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          dev_sha="$(gh api "repos/$REPO/git/ref/heads/dev" --jq .object.sha)"
          for sha in "$dev_sha" "$WORKFLOW_SHA"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::'$sha' is not a commit SHA, so tonight cannot be compared with a green night."
              exit 1
            fi
          done
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"
          echo "key=eval-nightly-green-dev-$dev_sha-workflows-$WORKFLOW_SHA-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Only an exact key skips a night, so no restore-keys. A cache service that
      # cannot answer reads as a miss, and the night runs.
      - name: Look for a green night on these commits this week
        id: lookup
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: eval-nightly-green.txt
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HIT: ${{ steps.lookup.outputs.cache-hit }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            changed=true
            why="A manual dispatch always runs ($KEY)."
          elif [ "$HIT" = true ]; then
            changed=false
            why="Skipped: a green night this week already evaluated these commits ($KEY)."
            echo "::notice::$why"
          else
            changed=true
            why="Running: no green night this week evaluated these commits ($KEY)."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "$why" >> "$GITHUB_STEP_SUMMARY"

  regression:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/eval-box.yml
    # The regression tier's judge is Claude's, on the ANTHROPIC_API_KEY secret, and it
    # delegates nothing to Claude Code, so it needs no Workload Identity Federation
    # sign-in and this job grants no id-token: write; eval-box inherits its
    # caller's token.
    permissions:
      contents: read
    with:
      tier: regression
      ref: ${{ needs.changes.outputs.dev_sha }}
    secrets: inherit

  macos-smoke:
    name: macos daemon smoke (ungraded)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.dev_sha }}

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build (dev env)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-dev-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-dev-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Fetch deps
        run: mix deps.get

      # seed_capability_home.py runs under a `uv run --script` shebang; the
      # macos-15 image does not preinstall uv.
      - uses: astral-sh/setup-uv@v5

      - name: Run the smoke
        env:
          # The smoke's daemon runs on the box's candidate, Anthropic's provider.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: benchmark/ci/macos_smoke.sh

      - name: Daemon log tail (failure diagnostics)
        if: failure()
        run: tail -n 200 "${RUNNER_TEMP}/fermix-smoke-eval/daemon.log" || true

  record-green:
    name: remember that these commits passed this week
    needs: [changes, regression, macos-smoke]
    # Every tier green, and the regression runner's own exit code a positive 0. A
    # red, cancelled or skipped tier saves nothing, so tomorrow runs again.
    if: >-
      needs.regression.result == 'success' && needs.regression.outputs.exit_code == '0'
      && needs.macos-smoke.result == 'success'
    # The same runner image and path as the lookup: the cache version hashes the
    # path and the compression method, so any other save is one the lookup never finds.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write the record
        env:
          KEY: ${{ needs.changes.outputs.key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: printf '%s\n%s\n' "$KEY" "$RUN_URL" > eval-nightly-green.txt

      - name: Save it under the night's key
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: eval-nightly-green.txt
          key: ${{ needs.changes.outputs.key }}

  alert:
    name: file an issue for any tier that failed or left no evidence
    needs: [changes, regression, macos-smoke]
    # always(), not !cancelled(): a cancelled or evicted tier is the ABSENCE of
    # evidence, and absence used to file nothing at all (2026-08-22: a nightly
    # evicted from the eval-box queue reported zero steps and zero alerts).
    #
    # The one exception is the night the `changes` job skipped on purpose: it
    # succeeded and found these commits green this week, so its tiers were skipped
    # by design. A gate that failed or was cancelled is not that night: the tiers
    # it skipped produced no evidence and file an issue exactly as before.
    if: ${{ always() && !(needs.changes.result == 'success' && needs.changes.outputs.changed == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
        with:
          script: |
            // What went wrong decides WHICH issue is filed, because the fixes differ:
            // a red release gate is a real, recorded result; exit 3/4 means no valid
            // measurement exists; a cancelled or skipped tier means the run never
            // produced evidence at all. The exit code is the tier RUNNER's own, which
            // eval-box.yml captures per tier step and publishes as `exit_code` — a
            // caller cannot read it from the job status, because `make` collapses every
            // runner outcome to 2.
            const needs = JSON.parse(process.env.NEEDS);
            // `changes` is the skip gate, not a tier: when it fails, the tiers it
            // skipped are what this run reports.
            delete needs.changes;
            // Only the capability runner defines 5, and its 3/4 causes differ from the
            // behavioral runner's, so the explanation is keyed on the tier.
            const CAPABILITY_TIERS = new Set(["capability"]);
            const KINDS = {
              no_run: {
                title: "produced no evidence",
                line: () => "The tier was **cancelled or skipped**, so it produced no evidence — this is an absent result, not a passing one.",
              },
              no_measurement: {
                title: "has no valid measurement",
                line: (job) => CAPABILITY_TIERS.has(job)
                  ? "The capability runner exited 3/4: preconditions failed, or the measurement was **invalid** (missing trace evidence, a usage limit, invalidated auth, a checker/evaluator failure, or more than one route). No leaderboard row was written."
                  : "The behavioral runner exited 3/4: preconditions failed, or required cases were skipped and the evidence was **INCOMPLETE**. `run_eval.py` never exits 5.",
              },
              gate_red: {
                title: "release gate is red",
                line: () => [
                  "The sweep was **valid and recorded** (exit 5): the measurement is sound and the leaderboard row was written. Exit 5 is a RELEASE decision, not a capability regression.",
                  "",
                  "Read the gate reason in the run report FIRST. Only a `pass@1` / `pass^k` reason is a score problem. **NOT EVALUATED** tasks mean the daemon under test did not advertise a tool they require (an environment gap on the box, such as a missing or signed-out vendor CLI), and **\"safety not evaluated\"** means no selected case declares a safety gate: both are fail-closed by design and say nothing about the candidate. The judged response-quality axis carries no release verdict, so it never exits 5.",
                ].join("\n"),
              },
              failing: {
                title: "is failing",
                line: () => "The tier failed.",
              },
            };
            const classify = (result, exit) => {
              if (result === "cancelled" || result === "skipped") return "no_run";
              if (result !== "failure") return null;
              if (exit === "3" || exit === "4") return "no_measurement";
              if (exit === "5") return "gate_red";
              return "failing";
            };
            const flagged = Object.entries(needs)
              .map(([job, r]) => [job, classify(r.result, (r.outputs || {}).exit_code)])
              .filter(([, kind]) => kind !== null);
            if (flagged.length === 0) return;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            for (const [job, kind] of flagged) {
              const critical = job === "dangerous";
              // One tier owns ONE running issue. The title used to vary by kind, so a
              // persistently-red tier that changed failure mode accumulated up to four
              // open issues and the de-dupe comment landed on none of them.
              const prefix = `${process.env.WORKFLOW}: the ${job} tier`;
              const title = `${prefix} ${KINDS[kind].title}`;
              const existing = open.find((i) => i.title.startsWith(prefix) && !i.pull_request);
              if (existing) {
                // De-dupe: a persistently-red tier updates one running issue
                // instead of filing a new one every run.
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Still red (${kind}) — ${KINDS[kind].line(job)}\n\n${runUrl}`,
                });
                continue;
              }
              const body = [
                `The **${job}** tier in \`${process.env.WORKFLOW}\`: ${KINDS[kind].line(job)}`,
                critical
                  ? "\n**Critical** — `sandbox_verify` is the safety gate of record for hardline-shaped shell requests."
                  : "",
                `\nRun: ${runUrl}`,
                "\nWhile this issue stays open, further occurrences add a comment instead of a new issue. Close it once the tier is green again.",
              ].join("\n");
              const created = await github.rest.issues.create({ owner, repo, title, body });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: created.data.number,
                labels: critical ? ["eval-failure", "critical"] : ["eval-failure"],
              });
            }
