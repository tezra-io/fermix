# Nightly eval (Milestone 22 T1 + T3): graded behavioral regression on a
# disposable Linux box, plus the ungraded macOS daemon smoke. Any tier that
# fails files (or updates) a GitHub issue via the shared `alert` job.
#
# Schedules execute the workflow file on the DEFAULT branch (main) — this file
# must exist on main to fire, and it checks out `dev` explicitly so nightly
# results track active development, not the last release.
name: eval-nightly

on:
  schedule:
    # 04:17 UTC — deliberately clear of Saturday's eval-weekly (06:23 cron,
    # ~2h of eval-box occupancy). Both callers serialize on the reusable
    # eval-box concurrency group, whose pending queue keeps only the NEWEST
    # waiting request: at the old 07:17 the Saturday nightly could queue behind
    # the weekly capability tier and be silently evicted when the weekly's
    # dangerous tier requested the group (2026-08-22: run cancelled with zero
    # steps executed — and the alert job reports only `failure`, so an evicted
    # tier files nothing).
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# No workflow-level concurrency here: the reusable eval-box declares the
# `eval-box` group itself, and a caller sharing its callee's group collides
# with its own still-running run (the documented reusable-workflow footgun).

jobs:
  regression:
    uses: ./.github/workflows/eval-box.yml
    with:
      tier: regression
      ref: dev
    secrets: inherit

  macos-smoke:
    name: macos daemon smoke (ungraded)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ELIXIR_VERSION: "1.19.5"
      OTP_VERSION: "28"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache deps and _build (dev env)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ runner.arch }}-mix-dev-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-mix-dev-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Fetch deps
        run: mix deps.get

      # seed_capability_home.py runs under a `uv run --script` shebang; the
      # macos-15 image does not preinstall uv.
      - uses: astral-sh/setup-uv@v5

      - name: Run the smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: benchmark/ci/macos_smoke.sh

      - name: Daemon log tail (failure diagnostics)
        if: failure()
        run: tail -n 200 "${RUNNER_TEMP}/fermix-smoke-eval/daemon.log" || true

  alert:
    name: file an issue for any failed tier
    needs: [regression, macos-smoke]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS);
            const failed = Object.entries(needs)
              .filter(([, r]) => r.result === "failure")
              .map(([job]) => job);
            if (failed.length === 0) return;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            for (const job of failed) {
              const critical = job === "dangerous";
              const title = `${process.env.WORKFLOW}: the ${job} tier is failing`;
              const existing = open.find((i) => i.title === title && !i.pull_request);
              if (existing) {
                // De-dupe: a persistently-red tier (e.g. regression on the luna
                // baseline) updates one running issue instead of a new one nightly.
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Still failing — ${runUrl}`,
                });
                continue;
              }
              const body = [
                `The **${job}** tier failed in \`${process.env.WORKFLOW}\`.`,
                critical
                  ? "\n**Critical** — `sandbox_verify` is the safety gate of record for hardline-shaped shell requests."
                  : "",
                `\nRun: ${runUrl}`,
                "\nWhile this issue stays open, further failures add a comment instead of a new issue. Close it once the tier is green again.",
              ].join("\n");
              const created = await github.rest.issues.create({ owner, repo, title, body });
              await github.rest.issues.addLabels({
                owner, repo, issue_number: created.data.number,
                labels: critical ? ["eval-failure", "critical"] : ["eval-failure"],
              });
            }
