\* EXPECT: holds
\* CHECKS: An answer landing between the run's outcome step and its send lets the message out while the finalising write finds the claim gone; the day was spent before the send, so a plan for later the same day brings no second unprompted message.
SPECIFICATION Spec
CONSTANTS Runs = {r1, r2}  MaxFaults = 1  DaysToDate = 2
          OwnerCanAnswer = TRUE  OwnerAnswersDuringRun = TRUE  PlanCanBeToday = TRUE  RaiseInConversation = FALSE
          SendCanFail = TRUE  AnswerCanBeLost = FALSE  DaemonCanCrash = FALSE
          SingleClaimant = TRUE  FinalizeIsCAS = TRUE  ChecksBeforeSend = TRUE  WhereLiveGuard = TRUE  SettleClearsClaim = TRUE
          BudgetRead = TRUE  SpendBeforeSend = TRUE  TouchCap = TRUE  BootSweep = TRUE  ScanExpires = TRUE
INVARIANT TypeOK
INVARIANT OneUnpromptedPerDay
