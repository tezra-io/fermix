\* EXPECT: mechanism FinalizeIsCAS covers 01_core_rules
\* CHECKS: Terminal states stay terminal because the run's finalising write is a compare-and-set: without it a run that outlived the owner's done reopens the loop as asked.
SPECIFICATION Spec
CONSTANTS Runs = {r1, r2}  MaxFaults = 1  DaysToDate = 2
          OwnerCanAnswer = TRUE  OwnerAnswersDuringRun = TRUE  PlanCanBeToday = TRUE  RaiseInConversation = TRUE
          SendCanFail = TRUE  AnswerCanBeLost = TRUE  DaemonCanCrash = TRUE
          SingleClaimant = TRUE  FinalizeIsCAS = FALSE  ChecksBeforeSend = TRUE  WhereLiveGuard = TRUE  SettleClearsClaim = TRUE
          BudgetRead = TRUE  SpendBeforeSend = TRUE  TouchCap = TRUE  BootSweep = TRUE  ScanExpires = TRUE
INVARIANT TypeOK
INVARIANT TerminalNeverReopens
