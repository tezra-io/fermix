\* EXPECT: mechanism BudgetRead covers 07_one_unprompted_a_day
\* CHECKS: One a day rests on the claim reading the day's budget: without it a plan for later the same day brings a second unprompted message.
SPECIFICATION Spec
CONSTANTS Runs = {r1, r2}  MaxFaults = 1  DaysToDate = 2  LapseDays = 2
          Classes = {"dated", "after"}  Reaches = {"message"}
          OwnerCanAnswer = TRUE  OwnerAnswersDuringRun = FALSE  PlanCanBeToday = TRUE  OwnerChangesReach = FALSE  RaiseInConversation = FALSE
          RaiseUnprompted = TRUE  SendCanFail = TRUE  AnswerCanBeLost = FALSE  DaemonCanCrash = FALSE
          SingleClaimant = TRUE  FinalizeIsCAS = TRUE  ChecksBeforeSend = TRUE  WhereLiveGuard = TRUE  SettleClearsClaim = TRUE
          BudgetRead = FALSE  SpendBeforeSend = FALSE  TouchCap = TRUE  AfterCap = TRUE  AskedNeedsDue = TRUE
          NextTouchLaterDay = TRUE  SlotGate = TRUE  ConversationGate = TRUE  WindowCleared = TRUE
          WindowLapses = TRUE  BootSweep = TRUE  ScanExpires = TRUE
INVARIANT TypeOK
INVARIANT OneUnpromptedPerDay
