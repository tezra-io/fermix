\* EXPECT: mechanism BootSweep covers 14_every_loop_ends
\* CHECKS: Ending rests on the boot sweep: without it a claim stranded by a crash is left to a run that no longer exists, and the scan never looks at the loop again.
SPECIFICATION Spec
CONSTANTS Runs = {r1, r2}  MaxFaults = 1  DaysToDate = 2  LapseDays = 2
          Classes = {"dated", "after"}  Reaches = {"message", "conversation"}
          OwnerCanAnswer = FALSE  OwnerAnswersDuringRun = TRUE  PlanCanBeToday = TRUE  OwnerChangesReach = FALSE  RaiseInConversation = TRUE
          RaiseUnprompted = TRUE  SendCanFail = TRUE  AnswerCanBeLost = TRUE  DaemonCanCrash = TRUE
          SingleClaimant = TRUE  FinalizeIsCAS = TRUE  ChecksBeforeSend = TRUE  WhereLiveGuard = TRUE  SettleClearsClaim = TRUE
          BudgetRead = TRUE  SpendBeforeSend = TRUE  TouchCap = TRUE  AfterCap = TRUE  AskedNeedsDue = TRUE
          NextTouchLaterDay = TRUE  SlotGate = TRUE  ConversationGate = TRUE  WindowCleared = TRUE
          WindowLapses = TRUE  BootSweep = FALSE  ScanExpires = TRUE
INVARIANT TypeOK
PROPERTY EveryLoopEnds
