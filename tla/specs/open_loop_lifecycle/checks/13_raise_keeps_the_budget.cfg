          Classes = {"dated", "after"}  Reaches = {"message"}
          OwnerCanAnswer = TRUE  OwnerAnswersDuringRun = FALSE  PlanCanBeToday = TRUE  OwnerChangesReach = FALSE  RaiseInConversation = TRUE
          RaiseUnprompted = TRUE  SendCanFail = TRUE  AnswerCanBeLost = FALSE  DaemonCanCrash = FALSE
          SingleClaimant = TRUE  FinalizeIsCAS = TRUE  ChecksBeforeSend = TRUE  WhereLiveGuard = TRUE  SettleClearsClaim = TRUE
          BudgetRead = TRUE  SpendBeforeSend = TRUE  TouchCap = TRUE  AfterCap = TRUE  AskedNeedsDue = TRUE
          NextTouchLaterDay = TRUE  SlotGate = TRUE  ConversationGate = TRUE  WindowCleared = TRUE
          WindowLapses = TRUE  BootSweep = TRUE  ScanExpires = TRUE
INVARIANT TypeOK
INVARIANT OneUnpromptedPerDay
