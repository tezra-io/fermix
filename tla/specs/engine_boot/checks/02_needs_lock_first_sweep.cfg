\* EXPECT: mechanism LockFirst covers 01_one_engine_sweeps
\* CHECKS: No boot settles a running engine's work only because a daemon takes the lock before its rails start: taken where the control socket binds, the second daemon's rails have already swept.
SPECIFICATION Spec
CONSTANTS Boots = {b1, b2}  Rails = {calls, jobs}  MaxStarts = 3  MaxClaims = 2
          EnginesCanEnd = TRUE  CommandsCanBoot = FALSE
          LockFirst = FALSE  SweepsAtBoot = TRUE  SweepNeedsEngine = TRUE
SYMMETRY Symm
INVARIANT TypeOK
INVARIANT OnlyGoneWorkIsSwept
