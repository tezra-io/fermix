\* EXPECT: holds
\* CHECKS: With two daemons started on one home in any order, and engines that die or are stopped with work in flight, no boot settles a row a running engine holds, a refused boot leaves the home unwritten, and a serving engine finds no claim but its own.
SPECIFICATION Spec
CONSTANTS Boots = {b1, b2}  Rails = {calls, jobs}  EngineOnly = {calls}  MaxStarts = 3  MaxClaims = 2
          EnginesCanEnd = TRUE  CommandsCanBoot = FALSE
          LockFirst = TRUE  SweepsAtBoot = TRUE  SweepNeedsEngine = TRUE
SYMMETRY Symm
INVARIANT TypeOK
INVARIANT OnlyGoneWorkIsSwept RefusedBootWritesNothing ServingEngineOwnsClaims
