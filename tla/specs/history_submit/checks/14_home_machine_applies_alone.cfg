\* EXPECT: violated HS-2 len=9
\* CHECKS: On a Mac that is its own home, a purge whose own apply here has not happened (two purges or pauses from chat at once, or one whose apply failed after the home recorded it) is stepped over when the later one applies alone and records its id as the mark, and the home's next sitting holding an event inside the earlier window is noted.
SPECIFICATION Spec
CONSTANTS Computers = {h}  HomeMachine = h  Stamps = {1, 2}
          MaxPurges = 2  MaxAway = 0
          OwnerCanPurge = TRUE  ScopedPurges = FALSE  ComputersGoAway = FALSE
          WriteRechecks = TRUE  ComputerFences = TRUE  MarkBeforeEvents = TRUE
          PurgeDeletesNotes = TRUE  MarkSkipsApplied = TRUE  RefusalNamesAllPending = TRUE
          MarkAfterFences = TRUE
INVARIANT TypeOK
INVARIANT PurgedWindowNeverGainsANote
