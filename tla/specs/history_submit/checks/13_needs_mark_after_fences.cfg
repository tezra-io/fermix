\* EXPECT: mechanism MarkAfterFences covers 01_purged_window_never_gains_a_note
\* CHECKS: A delivery applied on a computer while it forms a sitting keeps the purged window out only because the computer writes the mark after the fences: mark first, the sitting reads the new mark and an event the fence has not yet deleted, and the home no longer asks about that interval.
SPECIFICATION Spec
CONSTANTS Computers = {c1}  HomeMachine = none  Stamps = {1, 2, 3}
          MaxPurges = 2  MaxAway = 1  MaxRestores = 0
          OwnerCanPurge = TRUE  ScopedPurges = FALSE  ComputersGoAway = TRUE  HomeCanRestore = FALSE
          WriteRechecks = TRUE  ComputerFences = TRUE  MarkBeforeEvents = TRUE
          PurgeDeletesNotes = TRUE  MarkSkipsApplied = TRUE  RefusalNamesAllPending = TRUE
          MarkAfterFences = FALSE  HereAppliesPending = TRUE  MarkTiedToHome = TRUE
INVARIANT TypeOK
INVARIANT PurgedWindowNeverGainsANote
