\* EXPECT: holds
\* CHECKS: On a Mac that is its own home, with two purges from chat that may run at once, an apply here that may come late (a command whose apply failed is applied on the scheduler's tick), and late events at any stamp, no note ever holds an event stamped inside a purged window: this machine applies every interval of its own above its mark before its mark moves (HS-2, fixed).
SPECIFICATION Spec
CONSTANTS Computers = {h}  HomeMachine = h  Stamps = {1, 2}
          MaxPurges = 2  MaxAway = 0
          OwnerCanPurge = TRUE  ScopedPurges = FALSE  ComputersGoAway = FALSE
          WriteRechecks = TRUE  ComputerFences = TRUE  MarkBeforeEvents = TRUE
          PurgeDeletesNotes = TRUE  MarkSkipsApplied = TRUE  RefusalNamesAllPending = TRUE
          MarkAfterFences = TRUE  HereAppliesPending = TRUE
INVARIANT TypeOK
INVARIANT PurgedWindowNeverGainsANote
