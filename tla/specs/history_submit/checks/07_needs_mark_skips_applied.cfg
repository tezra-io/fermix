\* EXPECT: mechanism MarkSkipsApplied covers 06_every_sitting_settles
\* CHECKS: Without the mark, a sitting whose events lie either side of a window the computer already purged is refused for that window every time, and its events are never noted.
SPECIFICATION Spec
CONSTANTS Computers = {c1}  HomeMachine = none  Stamps = {1, 2, 3}
          MaxPurges = 2  MaxAway = 1
          OwnerCanPurge = TRUE  ScopedPurges = FALSE  ComputersGoAway = TRUE
          WriteRechecks = TRUE  ComputerFences = TRUE  MarkBeforeEvents = TRUE
          PurgeDeletesNotes = TRUE  MarkSkipsApplied = FALSE  RefusalNamesAllPending = TRUE
          MarkAfterFences = TRUE
INVARIANT TypeOK
PROPERTY EverySittingSettles
