\* EXPECT: holds
\* CHECKS: With the home's store restored from a backup (its interval ids starting again) while a computer keeps the mark it applied under the store before, a computer that goes away, late events at any stamp, sittings and answers in flight and purges from chat before and after the restore, no note ever holds an event stamped inside a purged window: a mark counts only under the home store it names.
SPECIFICATION Spec
CONSTANTS Computers = {c1}  HomeMachine = none  Stamps = {1, 2}
          MaxPurges = 1  MaxAway = 1  MaxRestores = 1
          OwnerCanPurge = TRUE  ScopedPurges = FALSE  ComputersGoAway = TRUE  HomeCanRestore = TRUE
          WriteRechecks = TRUE  ComputerFences = TRUE  MarkBeforeEvents = TRUE
          PurgeDeletesNotes = TRUE  MarkSkipsApplied = TRUE  RefusalNamesAllPending = TRUE
          MarkAfterFences = TRUE  HereAppliesPending = TRUE  MarkTiedToHome = TRUE
INVARIANT TypeOK
INVARIANT PurgedWindowNeverGainsANote
