\* EXPECT: mechanism HereAppliesPending covers 14_home_machine_applies_every_pending
\* CHECKS: On a Mac that is its own home, the purged window stays out only because this machine applies every interval of its own above its mark: applying a command's own interval alone, a later purge's apply steps the mark over an earlier one this machine never applied, and its next sitting holding an event inside the earlier window is noted (HS-2).
SPECIFICATION Spec
CONSTANTS Computers = {h}  HomeMachine = h  Stamps = {1, 2}
          MaxPurges = 2  MaxAway = 0
          OwnerCanPurge = TRUE  ScopedPurges = FALSE  ComputersGoAway = FALSE
          WriteRechecks = TRUE  ComputerFences = TRUE  MarkBeforeEvents = TRUE
          PurgeDeletesNotes = TRUE  MarkSkipsApplied = TRUE  RefusalNamesAllPending = TRUE
          MarkAfterFences = TRUE  HereAppliesPending = FALSE
INVARIANT TypeOK
INVARIANT PurgedWindowNeverGainsANote
