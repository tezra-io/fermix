\* EXPECT: holds
\* CHECKS: With run and Manager crashes, failed and timed-out sends and a lease that can lapse mid-hand-off, reconciliation finalizes only dead runs, every ended run gets its terminal row, its outcome ends delivered or dead-lettered, no send outlives its caller, and the worker never sends to a client-owned origin.
SPECIFICATION Spec
CONSTANTS Origins = {"chat", "text", "client"}  MaxAttempts = 2  MaxManagerCrashes = 1
          RunsCanCrash = TRUE  ManagerCanCrash = TRUE  SendsCanFail = TRUE
          AcceptedSendsCanTimeOut = TRUE  TerminalWriteCanFail = FALSE  ReconcileScanCanFail = FALSE
          LeaseCanLapse = TRUE  OwnerCancels = FALSE
          CleanDownDropsOnly = TRUE  IgnoresUntrackedRun = TRUE  GuardedTerminalUpdate = TRUE
          RestForOne = TRUE  ReconcilesAtBoot = TRUE  CrashDownTerminalizes = TRUE
          MarksDelivered = TRUE  ClientDeadLetters = TRUE  WorkerDrainsOutbox = TRUE  DeadLetterCap = TRUE
          LeasesFirstAttempt = TRUE  SendsDieWithCaller = TRUE  CancelsStrandedRow = TRUE
          WorkerDeadLettersClient = TRUE
INVARIANT TypeOK
INVARIANT ReconcileFindsDeadRuns NoOrphanedSends WorkerNeverSendsToClient
PROPERTY EveryRunEndsTerminal OutboxDrains
