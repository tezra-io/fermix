\* EXPECT: holds
\* CHECKS: With messages lost or late, both engines crashing, the staging or the server's marker failing, the network failing for good and the provider refusing deletes, at most one of the server and the Mac serves as the primary, the Mac's boot is never refused for its marker, and once the Mac serves it serves the server's copy and nothing of its retired one.
SPECIFICATION Spec
CONSTANTS MessagesCanBeLost = TRUE  MaxLosses = 2
          ServerCanCrash = TRUE  MacCanCrash = TRUE  MaxCrashes = 1
          TransferCanFail = TRUE  NetCanFail = TRUE  DeleteCanFail = TRUE  MaxPresses = 4
          MarkerBeforeCommit = TRUE  MarkerBeforeConfig = TRUE  RecordEntries = TRUE  PruneRetired = TRUE
          DeleteBeforeRestore = TRUE  DeleteOfferedOnlyBack = TRUE  UnconfirmedKept = TRUE  StartKeptFirst = TRUE
          MovingBackRefused = TRUE  StoppedReturnClears = TRUE  UndoneInAnyPhase = TRUE  RestoreOnFenceRequest = TRUE
INVARIANT TypeOK
INVARIANT AtMostOnePrimary NoRefusedBoot RetiredCopyNeverServes
