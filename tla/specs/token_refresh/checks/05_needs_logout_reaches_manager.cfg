\* EXPECT: mechanism LogoutReachesManager covers 01_no_overlap_safe
\* CHECKS: A logout sticks only because it stops the profile's manager, which would otherwise write the entry back.
SPECIFICATION Spec
CONSTANTS Profiles = {p1, p2}  CodexProfiles = {p1}  CliProfile = p1  LogoutProfile = p2
          None = None  MaxAttempts = 3  Rounds = 2
          CliRefreshes = TRUE  RefreshesCanOverlap = FALSE  ResponseCanBeLost = FALSE
          UserCanLogout = TRUE  LogoutFromCli = FALSE  SignOutForgets = FALSE
          ReadsDiskBeforeRefresh = TRUE  OneCallbackPerManager = TRUE
          MergesOnWrite = TRUE  LogoutReachesManager = FALSE
INVARIANT TypeOK
INVARIANT LogoutSticks
