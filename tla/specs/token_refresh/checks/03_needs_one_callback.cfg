SPECIFICATION Spec
CONSTANTS Profiles = {p1, p2}  CodexProfiles = {p1}  CliProfile = p1  LogoutProfile = p2
          None = None  MaxAttempts = 3  Rounds = 2
          CliRefreshes = TRUE  RefreshesCanOverlap = FALSE  ResponseCanBeLost = FALSE
          UserCanLogout = TRUE  LogoutFromCli = FALSE  SignOutForgets = FALSE
          ReadsDiskBeforeRefresh = TRUE  OneCallbackPerManager = FALSE
          MergesOnWrite = TRUE  LogoutReachesManager = TRUE
          StoreLock = TRUE  ProfileLock = FALSE  RefusesMissingEntry = TRUE
          CliLogoutReachesDaemon = TRUE
INVARIANT TypeOK
INVARIANT NeverSendConsumed
