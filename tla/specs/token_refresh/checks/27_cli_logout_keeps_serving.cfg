\* EXPECT: holds
\* CHECKS: A CLI logout has the running daemon let go of the profile, so once it is done the daemon's manager no longer serves the account.
SPECIFICATION Spec
CONSTANTS Profiles = {p1, p2}  CodexProfiles = {p1}  CliProfile = p1  LogoutProfile = p2
          None = None  MaxAttempts = 3  Rounds = 2
          CliRefreshes = FALSE  RefreshesCanOverlap = FALSE  ResponseCanBeLost = FALSE
          UserCanLogout = TRUE  LogoutFromCli = TRUE  SignOutForgets = FALSE
          ReadsDiskBeforeRefresh = TRUE  OneCallbackPerManager = TRUE
          MergesOnWrite = TRUE  LogoutReachesManager = TRUE
          StoreLock = TRUE  ProfileLock = TRUE  RefusesMissingEntry = TRUE
          CliLogoutReachesDaemon = TRUE
INVARIANT TypeOK
INVARIANT LogoutStopsServing
