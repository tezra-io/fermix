          SubjectRule = TRUE  SubjectRuleCoversUndecided = TRUE  ExcludesBusyWatchers = TRUE  SettleFenced = TRUE  TasksDieWithDispatcher = TRUE  BootReset = TRUE
          NonePassesAtAccept = TRUE  ClaimNeedsIdleJob = TRUE  CueSlotCap = TRUE  AtomicCueSettle = TRUE  RunSettleFenced = TRUE  ReapsOnlyDeadRuns = TRUE
          ReconcilesRuns = TRUE  ExhaustsAfterAction = TRUE  ToolsMarkWriteOnce = TRUE  ConfirmFenced = TRUE  ReclaimsOrphans = TRUE  AdmitsAfterScan = TRUE
