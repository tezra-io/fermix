\* EXPECT: holds
\* CHECKS: With provider and content failures, deadlines, task and runner crashes, failed runs and restarts of the dispatcher and the scheduler: no delivery is claimed while an older one of its subject is live, a watcher never has two filter calls running, and a delivery is acked only by a settled run.
