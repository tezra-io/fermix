\* EXPECT: holds
\* CHECKS: With popups, a tab and a close attempt by the person, a cancel, a quit and a drop, every task tab is released once, the person's tabs are never released, the person never closes a running task's tab, the caps hold, and the idle release spares task tabs.
SPECIFICATION Spec
CONSTANTS Tasks = {t1, t2}  OpensPerTask = 1  MaxTabs = 4
          TaskCap = 1  GlobalCap = 1
          HostCanDetach = TRUE  HostCanCrash = FALSE  SessionCanLock = FALSE
          PersonCanQuit = TRUE  PersonOpensTabs = TRUE  PersonCanCloseTabs = TRUE
          PersonCanCancel = TRUE  LaunchCanTimeOut = TRUE  PagesOpenPopups = TRUE
          DecideOnceAtStart = TRUE  LastReportWins = TRUE  SingleLaunch = TRUE
          LaunchDeadline = TRUE  OwnershipRegistry = TRUE  ReleaseOnce = TRUE
          PersonCannotCloseTaskTab = TRUE  TabCaps = TRUE  StoppingHandshake = TRUE
          QuitBound = TRUE  NoChromeRetry = TRUE
SYMMETRY Symm
INVARIANT TypeOK
INVARIANT TabsReleasedExactlyOnce PersonTabsNeverReleasedByTasks NoTaskTabClosedByPerson CapsHold IdleReleaseSparesTaskTabs
