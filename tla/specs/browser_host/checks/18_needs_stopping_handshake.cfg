\* EXPECT: mechanism StoppingHandshake covers 17_quit_never_abandons
\* CHECKS: A quit never leaves a host task running as the app detaches only because the app sends host_stopping and holds its quit for the answer.
SPECIFICATION Spec
CONSTANTS Tasks = {t1, t2}  OpensPerTask = 1  MaxTabs = 2
          TaskCap = 1  GlobalCap = 2
          HostCanDetach = TRUE  HostCanCrash = FALSE  SessionCanLock = FALSE
          PersonCanQuit = TRUE  PersonOpensTabs = FALSE  PersonCanCloseTabs = FALSE
          PersonCanCancel = FALSE  LaunchCanTimeOut = TRUE  PagesOpenPopups = FALSE
          DecideOnceAtStart = TRUE  LastReportWins = TRUE  SingleLaunch = TRUE
          LaunchDeadline = TRUE  OwnershipRegistry = TRUE  ReleaseOnce = TRUE
          PersonCannotCloseTaskTab = TRUE  TabCaps = TRUE  StoppingHandshake = FALSE
          QuitBound = TRUE  NoChromeRetry = TRUE
INVARIANT TypeOK
PROPERTY QuitNeverAbandons
