\* EXPECT: holds
\* CHECKS: A watcher's task with runner crashes (late writes included) and loop errors: every pending delivery, a retried attempt's pending then skipped included, reaches a final status.
SPECIFICATION Spec
CONSTANTS NumRuns = 2  Fires = 1  SendAttempts = 2  OwnerMoves = 0  OwnerEdits = 0  ManualRuns = 0
          DaemonCanCrash = FALSE  SchedulerCrashes = 0  SchedulerTimeouts = 0  RunnerCanCrash = TRUE
          LoopCanFail = TRUE  PlatformCanFail = FALSE  ResponsesCanStall = FALSE
          AtomicRaceStop = TRUE  RetriesOnlyUnsent = TRUE  ReconcilesRuns = TRUE
          CrashFailsPendingDelivery = TRUE  DeliveryWatchdog = TRUE
          AtomicSettle = TRUE  ReconcilesPending = TRUE  RefusalBacksOff = TRUE
          OwnerWritesColumns = TRUE  LoopDiesWithRunner = TRUE
          CuesOn = TRUE  CueTask = TRUE  Cues = 1  TicksAdmit = TRUE
INVARIANT TypeOK
PROPERTY DeliveryReachesFinal
