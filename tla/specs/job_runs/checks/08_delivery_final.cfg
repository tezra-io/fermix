\* EXPECT: holds
\* CHECKS: With runner crashes and failing or stalling sends, every pending delivery of a successful run reaches a final status.
SPECIFICATION Spec
CONSTANTS NumRuns = 2  Fires = 2  SendAttempts = 2  OwnerMoves = 0  ManualRuns = 0
          DaemonCanCrash = FALSE  SchedulerCrashes = 0  RunnerCanCrash = TRUE
          LoopCanFail = FALSE  PlatformCanFail = TRUE  ResponsesCanStall = TRUE
          AtomicRaceStop = TRUE  RetriesOnlyUnsent = TRUE  ReconcilesRuns = TRUE
          CrashFailsPendingDelivery = TRUE  DeliveryWatchdog = TRUE
INVARIANT TypeOK
PROPERTY DeliveryReachesFinal
