\* EXPECT: holds
\* CHECKS: With runner crashes (late writes included), a Scheduler restart, loop errors and failing or stalling sends, every pending delivery reaches a final status.
SPECIFICATION Spec
CONSTANTS NumRuns = 2  Fires = 2  SendAttempts = 2  OwnerMoves = 0  OwnerEdits = 0  ManualRuns = 0
          DaemonCanCrash = FALSE  SchedulerCrashes = 1  RunnerCanCrash = TRUE
          LoopCanFail = TRUE  PlatformCanFail = TRUE  ResponsesCanStall = TRUE
          AtomicRaceStop = TRUE  RetriesOnlyUnsent = TRUE  ReconcilesRuns = TRUE
          CrashFailsPendingDelivery = TRUE  DeliveryWatchdog = TRUE
          AtomicSettle = TRUE  ReconcilesPending = TRUE  RefusalBacksOff = TRUE
          OwnerWritesColumns = TRUE
INVARIANT TypeOK
PROPERTY DeliveryReachesFinal
