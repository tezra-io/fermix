\* EXPECT: holds
\* CHECKS: With failing and stalling sends, loop errors and runner crashes, final text reaches the user at most once and no runner waits on a send forever.
SPECIFICATION Spec
CONSTANTS NumRuns = 2  Fires = 2  SendAttempts = 2  OwnerMoves = 0  ManualRuns = 0
          DaemonCanCrash = FALSE  SchedulerCrashes = 0  RunnerCanCrash = TRUE
          LoopCanFail = TRUE  PlatformCanFail = TRUE  ResponsesCanStall = TRUE
          AtomicRaceStop = TRUE  RetriesOnlyUnsent = TRUE  ReconcilesRuns = TRUE
          CrashFailsPendingDelivery = TRUE  DeliveryWatchdog = TRUE
INVARIANT TypeOK
INVARIANT DeliveredAtMostOnce
PROPERTY SendNeverWedgesRunner
