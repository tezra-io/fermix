\* EXPECT: mechanism HeldEndsWithRun covers 17_held_browser_request_ends_when_off
\* CHECKS: A browser request the server turn's held process took ends when the master switch goes off only because the held process runs it linked to its run: if the run only called it, ending the run would leave the request to go on after Admission answered it stopped here (INVOKE-1).
SPECIFICATION Spec
CONSTANTS Calls = {e}  Effects = {e}  Held = {e}  Watches = {}  MaxTries = 2  MaxDrops = 2
          SessionCanDrop = TRUE  ComputerCanStop = TRUE  AnswersCanExpire = TRUE
          OwnerCanSwitchOff = TRUE  HomeCanMoveOn = TRUE
          JournalBeforeRun = TRUE  NoResendOfEffects = TRUE  EpochCheck = TRUE
          SwitchReadAtAdmit = TRUE  ServerDeadline = TRUE
          AskOnceSent = TRUE  SwitchReadAtStart = TRUE
          HeldEndsWithRun = FALSE
INVARIANT TypeOK
INVARIANT OffAlwaysWins
