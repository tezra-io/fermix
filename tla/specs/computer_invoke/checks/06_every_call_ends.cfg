\* EXPECT: holds
\* CHECKS: With an effect and a read asked at once, a session that drops with words in flight and a computer that stops in the middle, told to the server when it stands again, every call ends, in the closed set (answers that leave memory are 24's).
SPECIFICATION Spec
CONSTANTS Calls = {e, r}  Effects = {e}  Held = {}  Watches = {}  MaxTries = 2  MaxDrops = 1
          SessionCanDrop = TRUE  ComputerCanStop = TRUE  AnswersCanExpire = FALSE
          OwnerCanSwitchOff = FALSE  HomeCanMoveOn = FALSE
          JournalBeforeRun = TRUE  NoResendOfEffects = TRUE  EpochCheck = TRUE
          SwitchReadAtAdmit = TRUE  ServerDeadline = TRUE
          AskOnceSent = TRUE  SwitchReadAtStart = TRUE
          HeldEndsWithRun = TRUE  RestartTold = TRUE
INVARIANT TypeOK
PROPERTY EveryCallEnds
