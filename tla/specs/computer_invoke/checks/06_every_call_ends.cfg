\* EXPECT: holds
\* CHECKS: With an effect and a read asked at once, a session that drops with words in flight, a computer that stops in the middle and answers that leave memory, every call ends, in the closed set.
SPECIFICATION Spec
CONSTANTS Calls = {e, r}  Effects = {e}  Held = {}  MaxTries = 2  MaxDrops = 1
          SessionCanDrop = TRUE  ComputerCanStop = TRUE  AnswersCanExpire = TRUE
          OwnerCanSwitchOff = FALSE  HomeCanMoveOn = FALSE
          JournalBeforeRun = TRUE  NoResendOfEffects = TRUE  EpochCheck = TRUE
          SwitchReadAtAdmit = TRUE  ServerDeadline = TRUE
          AskOnceSent = TRUE  SwitchReadAtStart = TRUE
INVARIANT TypeOK
PROPERTY EveryCallEnds
