\* EXPECT: holds
\* CHECKS: With one call that changes something, a session that drops with words in flight, a computer that stops in the middle, answers that leave memory, the master switch going off and the home moving on to a newer copy, an effect happens at most once, whatever acted is in the journal, no request from an older copy is admitted, and nothing starts or stays running once the switch is off.
SPECIFICATION Spec
CONSTANTS Calls = {e}  Effects = {e}  MaxTries = 2  MaxDrops = 2
          SessionCanDrop = TRUE  ComputerCanStop = TRUE  AnswersCanExpire = TRUE
          OwnerCanSwitchOff = TRUE  HomeCanMoveOn = TRUE
          JournalBeforeRun = TRUE  NoResendOfEffects = TRUE  EpochCheck = TRUE
          SwitchReadAtAdmit = TRUE  ServerDeadline = TRUE
INVARIANT TypeOK
INVARIANT EffectAtMostOnce ActedIsJournaled StaleEpochNeverActs OffAlwaysWins
