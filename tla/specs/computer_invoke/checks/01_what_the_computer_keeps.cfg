\* EXPECT: holds
\* CHECKS: With one call that changes something, a session that drops with words in flight, a computer that stops in the middle, answers that leave memory, the master switch going off and the home moving on to a newer copy, an effect happens at most once, whatever acted is in the journal, no request from an older copy is admitted, nothing starts or stays running or waiting once the switch is off, a request that waited included, and a computer that said it has no record of a request never runs it.
SPECIFICATION Spec
CONSTANTS Calls = {e}  Effects = {e}  Held = {}  MaxTries = 2  MaxDrops = 2
          SessionCanDrop = TRUE  ComputerCanStop = TRUE  AnswersCanExpire = TRUE
          OwnerCanSwitchOff = TRUE  HomeCanMoveOn = TRUE
          JournalBeforeRun = TRUE  NoResendOfEffects = TRUE  EpochCheck = TRUE
          SwitchReadAtAdmit = TRUE  ServerDeadline = TRUE
          AskOnceSent = TRUE  SwitchReadAtStart = TRUE
INVARIANT TypeOK
INVARIANT EffectAtMostOnce ActedIsJournaled StaleEpochNeverActs OffAlwaysWins NoRecordIsFinal
