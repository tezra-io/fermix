\* EXPECT: mechanism AskOnceSent covers 01_what_the_computer_keeps
\* CHECKS: A computer that answered it has no record of a request never runs it after, only because the caller asks about its request itself, once it sent it: with the family asking for every id registered, a session that starts between a request's registration and its sending is asked about it first, answers no record, and then runs it.
SPECIFICATION Spec
CONSTANTS Calls = {e}  Effects = {e}  MaxTries = 2  MaxDrops = 2
          SessionCanDrop = TRUE  ComputerCanStop = TRUE  AnswersCanExpire = TRUE
          OwnerCanSwitchOff = TRUE  HomeCanMoveOn = TRUE
          JournalBeforeRun = TRUE  NoResendOfEffects = TRUE  EpochCheck = TRUE
          SwitchReadAtAdmit = TRUE  ServerDeadline = TRUE
          AskOnceSent = FALSE  SwitchReadAtStart = TRUE
INVARIANT TypeOK
INVARIANT NoRecordIsFinal
