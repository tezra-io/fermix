\* EXPECT: mechanism LocalNotify covers 06_chat_accounted
\* CHECKS: A phone that acked a reply off screen tells its owner only because the app posts the notification itself.
SPECIFICATION Spec
CONSTANTS Devices = {a, b}  Idle = {b}  MaxRows = 1  MaxFaults = 2  MaxFailures = 3
          SocketsCanFreeze = TRUE  DispatchCanFail = TRUE  AnswerCanBeLost = TRUE  DaemonCanCrash = TRUE  OwnerReadsElsewhere = TRUE
          DecidesOnEvidence = TRUE  AcksAfterAnnounce = TRUE  LocalNotify = FALSE  NotifiedSet = TRUE
          RetriesTransient = TRUE  AttemptCap = TRUE  BootCheck = TRUE
          WatermarkCursor = FALSE
INVARIANT TypeOK
PROPERTY ChatAccounted
