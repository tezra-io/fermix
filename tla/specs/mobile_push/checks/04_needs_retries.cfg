\* EXPECT: mechanism RetriesTransient covers 01_core_rules
\* CHECKS: Giving a device up only after the third attempt rests on the retry, which today's single attempt lacks.
SPECIFICATION Spec
CONSTANTS Devices = {a, b}  Idle = {b}  MaxRows = 1  MaxFaults = 2  MaxFailures = 3
          SocketsCanFreeze = TRUE  DispatchCanFail = TRUE  AnswerCanBeLost = TRUE  DaemonCanCrash = TRUE  OwnerReadsElsewhere = TRUE
          DecidesOnEvidence = TRUE  AcksAfterAnnounce = TRUE  LocalNotify = TRUE  NotifiedSet = TRUE
          RetriesTransient = FALSE  AttemptCap = TRUE  BootCheck = TRUE
          WatermarkCursor = FALSE
INVARIANT TypeOK
INVARIANT GivesUpOnlyAfterThree
