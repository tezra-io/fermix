\* EXPECT: holds
\* CHECKS: With every fault on, a phone alerts once for a reply, a device gets at most three attempts and is given up only after the third, and a device is skipped only on evidence.
SPECIFICATION Spec
CONSTANTS Devices = {a, b}  Idle = {b}  MaxRows = 1  MaxFaults = 2  MaxFailures = 3
          SocketsCanFreeze = TRUE  DispatchCanFail = TRUE  AnswerCanBeLost = TRUE  DaemonCanCrash = TRUE  OwnerReadsElsewhere = TRUE
          DecidesOnEvidence = TRUE  AcksAfterAnnounce = TRUE  LocalNotify = TRUE  NotifiedSet = TRUE
          RetriesTransient = TRUE  AttemptCap = TRUE  BootCheck = TRUE
          WatermarkCursor = FALSE
INVARIANT TypeOK
INVARIANT AtMostOneAlert AttemptsBounded GivesUpOnlyAfterThree SkippedOnlyOnEvidence
