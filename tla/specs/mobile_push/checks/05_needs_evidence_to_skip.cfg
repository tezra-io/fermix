\* EXPECT: mechanism DecidesOnEvidence covers 01_core_rules
\* CHECKS: Skipping a device only on evidence rests on the decision reading the acked cursor and the read frontier; today's code skips every device while any socket is registered.
SPECIFICATION Spec
CONSTANTS Devices = {a, b}  Idle = {b}  MaxRows = 1  MaxFaults = 2  MaxFailures = 3
          SocketsCanFreeze = TRUE  DispatchCanFail = TRUE  AnswerCanBeLost = TRUE  DaemonCanCrash = TRUE  OwnerReadsElsewhere = TRUE
          DecidesOnEvidence = FALSE  AcksAfterAnnounce = TRUE  LocalNotify = TRUE  NotifiedSet = TRUE
          RetriesTransient = TRUE  AttemptCap = TRUE  BootCheck = TRUE
          WatermarkCursor = FALSE
INVARIANT TypeOK
INVARIANT SkippedOnlyOnEvidence
