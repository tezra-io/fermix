                    - ShellOption: !If [HasShellAccess, " --shell-access", ""]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
      - SubnetRouteTableAssociation
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber

  # The stack is complete only once first boot says it ended well: enrolled
  # with the primary, or ready for a restore. A first boot that fails sends
  # its sentence, which fails the stack with it as the reason; one that never
  # reports fails it when the 30 minutes run out.
  FirstBootHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  FirstBoot:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Instance
    Properties:
      Handle: !Ref FirstBootHandle
      Timeout: "1800"
      Count: 1

Outputs:
  InstanceId:
    Description: The server's instance id.
    Value: !Ref Instance
  CheckBeforeMoving:
    Condition: IsEnroll
    Description: What to compare before you move to this server.
    Value: !Sub "Before you move, check that Fermix shows the instance id ${Instance} for this server. If it shows another, do not move."
  RestoreSteps:
    Condition: IsRestore
    Description: How to restore the newest snapshot onto this server.
    Value: !Sub "Open a shell on ${Instance} with Session Manager and follow the steps its system log lists after Ready to restore your home here."
  SnapshotBucket:
    Description: >-
      The versioned bucket the server writes encrypted snapshots to. Restore
      from the newest one with your recovery passphrase.
    Value: !If [IsRestore, !Ref ExistingSnapshotBucket, !Ref SnapshotBucket]
  Region:
    Description: The region of the server and its bucket.
    Value: !Ref AWS::Region
