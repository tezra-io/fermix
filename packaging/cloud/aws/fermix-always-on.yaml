AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Fermix Always On: one Debian server in your own AWS account that enrolls
  with your Fermix primary and becomes the primary once you move to it, or,
  in restore mode, takes a snapshot of a lost one. No inbound port, IMDSv2
  only, an encrypted disk, and a versioned snapshot bucket the server can add
  to but never read or delete. Fermix holds no AWS credential.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Enrollment or restore
        Parameters:
          - Mode
          - EnrollmentCode
          - ExistingSnapshotBucket
      - Label:
          default: Server
        Parameters:
          - InstanceType
          - VolumeSize
          - Arm64ImageId
          - X86ImageId
      - Label:
          default: Repair (optional)
        Parameters:
          - ShellAccess
    ParameterLabels:
      Mode:
        default: Add a server, or restore one
      EnrollmentCode:
        default: Enrollment code from Fermix
      ExistingSnapshotBucket:
        default: Snapshot bucket to restore from
      ShellAccess:
        default: Shell access through Session Manager
      InstanceType:
        default: Instance type
      VolumeSize:
        default: Disk size (GiB)
      Arm64ImageId:
        default: Debian image for arm64 types
      X86ImageId:
        default: Debian image for x86_64 types

Parameters:
  Mode:
    Type: String
    Default: enroll
    AllowedValues:
      - enroll
      - restore
    Description: >-
      enroll adds a server that your Fermix primary moves to, with the code it
      shows. restore prepares a server for the newest snapshot of a primary
      that is gone, with no code; its system log lists the steps. Restoring on
      AWS is not available in this version: the steps need a shell on the
      server, which the Debian image cannot give yet, so the stack refuses
      restore. Restore onto a Linux host you have a terminal on instead
      (curl -fsSL https://fermix.ai/always-on | sudo sh -s -- --restore).
  EnrollmentCode:
    Type: String
    NoEcho: true
    Default: ""
    MaxLength: 2048
    AllowedPattern: "^$|^fxenroll1\\.[A-Za-z0-9_-]{32,2038}$"
    ConstraintDescription: >-
      Paste the whole code Fermix shows: it starts with fxenroll1. and works
      once, for 30 minutes.
    Description: >-
      enroll only: the code Fermix shows when you add an Always On server. It
      works once, for 30 minutes, and the console never shows it again.
  ExistingSnapshotBucket:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: An S3 bucket name, or empty.
    Description: >-
      restore only: the bucket the lost server wrote its snapshots to (its
      stack's SnapshotBucket output). The new server keeps writing there, and
      makes no bucket of its own. Launch the stack in that bucket's region.
  ShellAccess:
    Type: String
    Default: "false"
    AllowedValues:
      - "false"
      - "true"
    Description: >-
      true lets Session Manager open a shell on the server, through the AWS
      managed policy AmazonSSMManagedInstanceCore on its role: the way to
      restore a snapshot onto it, or to repair it. The server needs the SSM
      agent, which Debian's images do not carry; first boot fails the stack
      when it is missing.
  InstanceType:
    Type: String
    Default: t4g.medium
    AllowedValues:
      - t4g.medium
      - t4g.large
      - t4g.xlarge
      - m7g.large
      - t3.medium
      - t3.large
      - t3.xlarge
      - m7i.large
    Description: >-
      t4g and m7g are arm64 (Graviton); t3 and m7i are x86_64. The image
      parameter of the matching architecture is used.
  VolumeSize:
    Type: Number
    Default: 30
    MinValue: 20
    MaxValue: 1024
    Description: The encrypted gp3 disk, in GiB.
  Arm64ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/debian/release/13/latest/arm64
    Description: The public parameter naming the latest Debian arm64 image.
  X86ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/debian/release/13/latest/amd64
    Description: The public parameter naming the latest Debian x86_64 image.

Mappings:
  InstanceArchitecture:
    t4g.medium:
      Architecture: arm64
    t4g.large:
      Architecture: arm64
    t4g.xlarge:
      Architecture: arm64
    m7g.large:
      Architecture: arm64
    t3.medium:
      Architecture: x86_64
    t3.large:
      Architecture: x86_64
    t3.xlarge:
      Architecture: x86_64
    m7i.large:
      Architecture: x86_64

Rules:
  EnrollTakesACode:
    RuleCondition: !Equals [!Ref Mode, enroll]
    Assertions:
      - Assert: !Not [!Equals [!Ref EnrollmentCode, ""]]
        AssertDescription: To add a server, paste the enrollment code Fermix shows.
      - Assert: !Equals [!Ref ExistingSnapshotBucket, ""]
        AssertDescription: A new server makes its own snapshot bucket; leave the bucket to restore from empty.
  RestoreTakesABucket:
    RuleCondition: !Equals [!Ref Mode, restore]
    Assertions:
      - Assert: !Equals [!Ref EnrollmentCode, ""]
        AssertDescription: A restore takes no enrollment code; leave it empty.
      - Assert: !Not [!Equals [!Ref ExistingSnapshotBucket, ""]]
        AssertDescription: Name the bucket the lost server wrote its snapshots to.
  RestoreNeedsShellAccess:
    RuleCondition: !Equals [!Ref Mode, restore]
    Assertions:
      - Assert: !Equals [!Ref ShellAccess, "true"]
        AssertDescription: >-
          A restore on AWS needs a shell on the server, which the template's
          Debian image cannot give yet (it carries no SSM agent), so restoring
          on AWS is not available in this version. Restore onto a Linux host you
          have a terminal on instead, with the first-boot script's --restore.

Conditions:
  IsArm64: !Equals [!FindInMap [InstanceArchitecture, !Ref InstanceType, Architecture], arm64]
  IsRestore: !Equals [!Ref Mode, restore]
  IsEnroll: !Not [!Condition IsRestore]
  HasShellAccess: !Equals [!Ref ShellAccess, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.75.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.75.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable

  # No inbound rule: the server dials out to the primary and to every service
  # it uses.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fermix Always On server, no inbound access
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: Outbound to the primary, providers, relays and package mirrors
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  # Versioned, so a snapshot the server overwrites stays recoverable for 90
  # days as a noncurrent version. Each snapshot is current for 30 days, then
  # noncurrent for 90 more, so the bucket holds about 120 days of them. Kept
  # when the stack is deleted: it is the recovery point when the server is
  # gone, and a restore stack writes to it again instead of making its own.
  SnapshotBucket:
    Type: AWS::S3::Bucket
    Condition: IsEnroll
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSnapshotsAfter30Days
            Status: Enabled
            ExpirationInDays: 30
          - Id: ExpireNoncurrentAfter90Days
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  SnapshotBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsEnroll
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref SnapshotBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SnapshotBucket.Arn
              - !Sub "${SnapshotBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # The server's only permission: add objects to the snapshot bucket (this
  # stack's, or in restore mode the lost server's). It can neither read, list
  # nor delete them. With ShellAccess, also what Session Manager needs.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: !If
        - HasShellAccess
        - - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Ref AWS::NoValue
      Policies:
        - PolicyName: fermix-snapshots-write-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !If
                  - IsRestore
                  - !Sub "arn:${AWS::Partition}:s3:::${ExistingSnapshotBucket}/*"
                  - !Sub "${SnapshotBucket.Arn}/*"
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !If [IsArm64, !Ref Arm64ImageId, !Ref X86ImageId]
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          InstanceMetadataTags: disabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: !Ref VolumeSize
              Encrypted: true
              DeleteOnTermination: true
        NetworkInterfaces:
          - DeviceIndex: 0
            SubnetId: !Ref Subnet
            Groups:
              - !Ref SecurityGroup
            AssociatePublicIpAddress: true
            DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Ref AWS::StackName
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Ref AWS::StackName
        # The first-boot script is packaging/cloud/first-boot.sh in
        # tezra-io/fermix, the same bytes https://fermix.ai/always-on serves.
        # User data holds at most 16 KB, so it travels compressed; the server
        # checks its SHA-256 before running it. The enrollment code and the
        # wait handle reach the script only in its environment; the script
        # signals the handle once, with the sentence when it fails.
        UserData:
          Fn::Base64:
            Fn::Join:
              - ""
              - - |
                  #!/bin/sh
                  # Fermix Always On: unpack the first-boot script and run it once.
                  set -eu
                  umask 022
                  mkdir -p /usr/local/lib/fermix-always-on
                  base64 -d <<'FERMIX_FIRST_BOOT' | gzip -dc >/usr/local/lib/fermix-always-on/first-boot.sh
